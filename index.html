};

const WEEK_DAYS = ["السبت", "الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];
const WEEK_DAYS_EN = {
  "السبت": "Saturday",
  "الأحد": "Sunday",
  "الاثنين": "Monday",
  "الثلاثاء": "Tuesday",
  "الأربعاء": "Wednesday",
  "الخميس": "Thursday",
  "الجمعة": "Friday",
};

/* أيام الإجازة الأسبوعية لموظف — متوافقة مع البيانات القديمة (weeklyOffDay نص واحد) والجديدة (weeklyOffDays مصفوفة) */
function getOffDays(emp) {
  if (Array.isArray(emp?.weeklyOffDays) && emp.weeklyOffDays.length) return emp.weeklyOffDays;
  if (emp?.weeklyOffDay) return [emp.weeklyOffDay];
  return ["الجمعة"];
}
function formatOffDays(days, t) {
  return days.map((d) => t(d, WEEK_DAYS_EN[d] || d)).join(t("، ", ", "));
}

/* تحويل تاريخ ميلادي إلى هجري للعرض جنب حقل التاريخ (بدون اتصال إنترنت، عبر Intl المدمجة في المتصفح) */
function toHijri(dateStr) {
  if (!dateStr) return "";
  try {
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d)) return "";
    const parts = new Intl.DateTimeFormat("en-u-ca-islamic", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(d);
    const get = (t) => parts.find((p) => p.type === t)?.value || "";
    return `${get("year")}/${get("month")}/${get("day")} هـ`;
  } catch (e) {
    return "";
  }
}

function HijriNote({ dateStr }) {
  const h = toHijri(dateStr);
  if (!h) return null;
  return <div style={{ fontSize: 10, color: "#a3927a", marginTop: 2 }}>{h}</div>;
}

/* حالة تاريخ (إقامة/عقد) حسب الأيام المتبقية */
function expiryStatus(dateStr, t) {
  const tr = t || ((ar) => ar);
  if (!dateStr) return { label: tr("غير محدد", "Not set"), tone: "gold", days: null };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(dateStr);
  const days = Math.round((d - today) / (1000 * 60 * 60 * 24));
  if (days < 0) return { label: tr(`منتهية منذ ${Math.abs(days)} يوم`, `Expired ${Math.abs(days)} days ago`), tone: "brick", days };
  if (days <= 30) return { label: tr(`تنتهي خلال ${days} يوم`, `Expires in ${days} days`), tone: "brick", days };
  if (days <= 90) return { label: tr(`تنتهي خلال ${days} يوم`, `Expires in ${days} days`), tone: "gold", days };
  return { label: tr(`سارية (${days} يوم متبقي)`, `Valid (${days} days left)`), tone: "green", days };
}

function EmployeesTab({ employees, setEmployees, branches, entities, entityOfBranch, leaves, logActivity, canEditWeeklyOff = true }) {
  const { t } = useLang();
  const [form, setForm] = useState(EMPTY_EMP);
  const [editingId, setEditingId] = useState(null);
  const [filterBranch, setFilterBranch] = useState("");
  const [searchQuery, setSearchQuery] = useState("");
  const [profileEmp, setProfileEmp] = useState(null);
  const [formErr, setFormErr] = useState("");

  const resetForm = () => {
    setForm(EMPTY_EMP);
    setEditingId(null);
    setFormErr("");
  };

  const submit = () => {
    const missing = [];
    if (!form.name.trim()) missing.push(t("الاسم الكامل", "Full Name"));
    if (!form.nationalId.trim()) missing.push(t("رقم الهوية / الإقامة", "National ID / Iqama No."));
    if (!form.branchId) missing.push(t("الفرع الأساسي", "Primary Branch"));
    if (!form.position.trim()) missing.push(t("المسمى الوظيفي", "Job Title"));
    if (!String(form.salary).trim()) missing.push(t("الراتب الأساسي", "Basic Salary"));
    if (!form.joinDate) missing.push(t("تاريخ التعيين", "Hire Date"));
    if (!form.phone.trim()) missing.push(t("رقم الجوال", "Mobile Number"));
    if (missing.length) {
      setFormErr(t(`الرجاء تعبئة الحقول الإلزامية: ${missing.join("، ")}`, `Please fill in the required fields: ${missing.join(", ")}`));
      return;
    }
    setFormErr("");
    const cleanForm = { ...form, additionalBranchIds: (form.additionalBranchIds || []).filter((id) => id !== form.branchId) };
    if (editingId) {
      setEmployees((prev) => prev.map((e) => (e.id === editingId ? { ...cleanForm, id: editingId } : e)));
      logActivity && logActivity("تعديل موظف", "employees", form.name);
    } else {
      setEmployees((prev) => [...prev, { ...cleanForm, id: uid() }]);
      logActivity && logActivity("إضافة موظف", "employees", form.name);
    }
    resetForm();
  };

  const edit = (emp) => {
    setForm({ ...EMPTY_EMP, ...emp, additionalBranchIds: Array.isArray(emp.additionalBranchIds) ? emp.additionalBranchIds : [] });
    setEditingId(emp.id);
  };

  const remove = (id) => {
    const target = employees.find((e) => e.id === id);
    setEmployees((prev) => prev.filter((e) => e.id !== id));
    logActivity && logActivity("حذف موظف", "employees", target?.name || id);
    if (editingId === id) resetForm();
  };

  const addCareerEntry = (empId, entry) => {
    const newEntry = { ...entry, id: uid() };
    setEmployees((prev) =>
      prev.map((e) => (e.id === empId ? { ...e, careerHistory: [...(e.careerHistory || []), newEntry] } : e))
    );
    setProfileEmp((prev) => (prev && prev.id === empId ? { ...prev, careerHistory: [...(prev.careerHistory || []), newEntry] } : prev));
    logActivity && logActivity("إضافة حدث مسار وظيفي", "employees", employees.find((e) => e.id === empId)?.name || "");
  };

  const updateGovFees = (empId, fees) => {
    setEmployees((prev) => prev.map((e) => (e.id === empId ? { ...e, govFees: { ...(e.govFees || {}), ...fees } } : e)));
    setProfileEmp((prev) => (prev && prev.id === empId ? { ...prev, govFees: { ...(prev.govFees || {}), ...fees } } : prev));
    logActivity && logActivity("تعديل رسوم حكومية", "employees", employees.find((e) => e.id === empId)?.name || "");
  };

  const toggleWeeklyOffDay = (empId, day) => {
    setEmployees((prev) =>
      prev.map((e) => {
        if (e.id !== empId) return e;
        const current = getOffDays(e);
        const next = current.includes(day) ? current.filter((d) => d !== day) : [...current, day];
        const finalDays = next.length ? next : [day];
        return { ...e, weeklyOffDays: finalDays, weeklyOffDay: finalDays[0] };
      })
    );
    setProfileEmp((prev) => {
      if (!prev || prev.id !== empId) return prev;
      const current = getOffDays(prev);
      const next = current.includes(day) ? current.filter((d) => d !== day) : [...current, day];
      const finalDays = next.length ? next : [day];
      return { ...prev, weeklyOffDays: finalDays, weeklyOffDay: finalDays[0] };
    });
    logActivity && logActivity("تحديد الإجازة الأسبوعية", "employees", `${employees.find((e) => e.id === empId)?.name || ""}: ${day}`);
  };

  const updateWorkShift = (empId, shift) => {
    setEmployees((prev) => prev.map((e) => (e.id === empId ? { ...e, workShift: shift } : e)));
    setProfileEmp((prev) => (prev && prev.id === empId ? { ...prev, workShift: shift } : prev));
    logActivity && logActivity("تحديد وقت الدوام", "employees", `${employees.find((e) => e.id === empId)?.name || ""}: ${shift.start}-${shift.end}`);
  };

  const removeCareerEntry = (empId, entryId) => {
    setEmployees((prev) =>
      prev.map((e) => (e.id === empId ? { ...e, careerHistory: (e.careerHistory || []).filter((h) => h.id !== entryId) } : e))
    );
    setProfileEmp((prev) => (prev && prev.id === empId ? { ...prev, careerHistory: (prev.careerHistory || []).filter((h) => h.id !== entryId) } : prev));
  };

  const q = searchQuery.trim().toLowerCase();
  const list = employees.filter(
    (e) =>
      (!filterBranch || e.branchId === filterBranch) &&
      (!q || (e.name || "").toLowerCase().includes(q) || (e.nationalId || "").toLowerCase().includes(q))
  );

  return (
    <div>
      <Header title={t("الموظفون", "Employees")} subtitle={t("سجل بيانات الموظفين عبر جميع الفروع", "Employee records across all branches")} />

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 22 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: COLORS.espresso }}>
          {editingId ? t("تعديل بيانات موظف", "Edit Employee") : t("إضافة موظف جديد", "Add New Employee")}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end" }}>
          <Field label={t("صورة الموظف", "Employee Photo")}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              {form.photo ? (
                <img src={form.photo} alt="" style={{ width: 42, height: 42, borderRadius: "50%", objectFit: "cover", border: `1px solid ${COLORS.line}` }} />
              ) : (
                <div style={{ width: 42, height: 42, borderRadius: "50%", background: COLORS.paperDark, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15, fontWeight: 700, color: "#a3927a" }}>
                  {(form.name || "؟").trim().charAt(0)}
                </div>
              )}
              <input
                type="file"
                accept="image/*"
                style={{ ...inputStyle, padding: "6px 8px", maxWidth: 170 }}
                onChange={(e) => {
                  const file = e.target.files && e.target.files[0];
                  if (!file) return;
                  compressImage(file, 400, 0.75).then((dataUrl) => setForm((f) => ({ ...f, photo: dataUrl }))).catch(() => {});
                  e.target.value = "";
                }}
              />
              {form.photo && (
                <Btn small tone="secondary" onClick={() => setForm((f) => ({ ...f, photo: "" }))}>{t("إزالة", "Remove")}</Btn>
              )}
            </div>
          </Field>
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 12 }}>
          <Field label={t("الاسم الكامل", "Full Name")} required>
            <input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          </Field>
          <Field label={t("رقم الهوية / الإقامة", "National ID / Iqama No.")} required>
            <input style={inputStyle} value={form.nationalId} onChange={(e) => setForm({ ...form, nationalId: e.target.value })} />
          </Field>
          <Field label={t("الجنسية", "Nationality")}>
            <select style={inputStyle} value={form.nationality} onChange={(e) => setForm({ ...form, nationality: e.target.value })}>
              <option value="سعودي">{t("سعودي", "Saudi")}</option>
              <option value="غير سعودي">{t("غير سعودي", "Non-Saudi")}</option>
            </select>
          </Field>
          <Field label={t("الفرع الأساسي", "Primary Branch")} required>
            <select style={inputStyle} value={form.branchId} onChange={(e) => setForm({ ...form, branchId: e.target.value })}>
              <option value="">{t("اختر الفرع", "Select branch")}</option>
              {branches.map((b) => (
                <option key={b.id} value={b.id}>
                  {b.name}
                </option>
              ))}
            </select>
          </Field>
          <Field label={t("المسمى الوظيفي", "Job Title")} required>
            <input style={inputStyle} value={form.position} onChange={(e) => setForm({ ...form, position: e.target.value })} />
          </Field>
          <Field label={t("الراتب الأساسي (﷼)", "Basic Salary (SAR)")} required>
            <input type="number" style={inputStyle} value={form.salary} onChange={(e) => setForm({ ...form, salary: e.target.value })} />
          </Field>
          <Field label={t("تاريخ التعيين", "Hire Date")} required>
            <DateField style={inputStyle} value={form.joinDate} onChange={(v) => setForm({ ...form, joinDate: v })} />
          </Field>
          <Field label={t("رقم الجوال", "Mobile Number")} required>
            <input style={inputStyle} value={form.phone} onChange={(e) => setForm({ ...form, phone: e.target.value })} />
          </Field>
          <Field label={t("الحالة", "Status")}>
            <select style={inputStyle} value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })}>
              <option value="نشط">{t("نشط", "Active")}</option>
              <option value="موقوف">{t("موقوف", "Suspended")}</option>
              <option value="منتهي الخدمة">{t("منتهي الخدمة", "Terminated")}</option>
            </select>
          </Field>
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.coffee, margin: "14px 0 8px" }}>{t("بيانات الإقامة والعقد", "Iqama & Contract Details")}</div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label={t("تاريخ انتهاء الإقامة", "Iqama Expiry Date")}>
            <DateField style={inputStyle} value={form.iqamaExpiry} onChange={(v) => setForm({ ...form, iqamaExpiry: v })} />
          </Field>
          <Field label={t("المهنة على الإقامة", "Profession on Iqama")}>
            <input style={inputStyle} value={form.iqamaProfession} onChange={(e) => setForm({ ...form, iqamaProfession: e.target.value })} />
          </Field>
          {form.nationality !== "سعودي" && (
            <React.Fragment>
              <Field label={t("رقم تأشيرة الخروج والعودة", "Exit/Re-entry Visa No.")}>
                <input
                  style={inputStyle}
                  value={form.exitReentryNumber}
                  onChange={(e) => setForm({ ...form, exitReentryNumber: e.target.value })}
                />
              </Field>
              <Field label={t("تاريخ انتهاء تأشيرة الخروج والعودة", "Exit/Re-entry Visa Expiry")}>
                <DateField style={inputStyle} value={form.exitReentryExpiry} onChange={(v) => setForm({ ...form, exitReentryExpiry: v })} />
              </Field>
            </React.Fragment>
          )}
          <Field label={t("نوع العقد", "Contract Type")}>
            <select style={inputStyle} value={form.contractType} onChange={(e) => setForm({ ...form, contractType: e.target.value })}>
              <option value="محدد المدة">{t("محدد المدة", "Fixed-term")}</option>
              <option value="غير محدد المدة">{t("غير محدد المدة", "Unlimited")}</option>
            </select>
          </Field>
          <Field label={t("بداية العقد", "Contract Start")}>
            <DateField style={inputStyle} value={form.contractStart} onChange={(v) => setForm({ ...form, contractStart: v })} />
          </Field>
          <Field label={t("نهاية العقد", "Contract End")}>
            <DateField style={inputStyle} value={form.contractEnd} onChange={(v) => setForm({ ...form, contractEnd: v })} />
          </Field>
        </div>

        <div style={{ fontSize: 12, fontWeight: 700, color: COLORS.coffee, margin: "14px 0 8px" }}>
          {t("فروع إضافية للحضور", "Additional Branches for Attendance")}
        </div>
        <div style={{ fontSize: 11, color: "#a3927a", marginBottom: 8 }}>
          {t(
            "للموظفين اللي شغالين على أكتر من فرع: حدّد هنا الفروع الإضافية اللي يقدر يسجّل منها حضوره/انصرافه بالموقع الجغرافي، غير الفرع الأساسي أعلاه.",
            "For employees who work across multiple branches: select the additional branches where they can clock in/out by geolocation, besides their primary branch above."
          )}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
          {branches
            .filter((b) => b.id !== form.branchId)
            .map((b) => {
              const active = (form.additionalBranchIds || []).includes(b.id);
              return (
                <button
                  key={b.id}
                  type="button"
                  onClick={() => {
                    const cur = form.additionalBranchIds || [];
                    const next = cur.includes(b.id) ? cur.filter((id) => id !== b.id) : [...cur, b.id];
                    setForm({ ...form, additionalBranchIds: next });
                  }}
                  style={{
                    padding: "6px 11px",
                    borderRadius: 7,
                    fontSize: 12,
                    fontWeight: 700,
                    cursor: "pointer",
                    border: `1px solid ${active ? COLORS.espresso : COLORS.line}`,
                    background: active ? COLORS.espresso : "#fff",
                    color: active ? "#fff" : COLORS.coffee,
                  }}
                >
                  {b.name}
                </button>
              );
            })}
        </div>

        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          <Btn onClick={submit}>{editingId ? t("حفظ التعديل", "Save Changes") : t("إضافة الموظف", "Add Employee")}</Btn>
          {editingId && <Btn tone="secondary" onClick={resetForm}>{t("إلغاء", "Cancel")}</Btn>}
        </div>
        {formErr && <div style={{ marginTop: 10, fontSize: 12, color: COLORS.brick }}>{formErr}</div>}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 10 }} className="no-print">
        <SectionTitle>{t("قائمة الموظفين", "Employee List")} ({fmt(list.length)})</SectionTitle>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          <input
            style={{ ...inputStyle, maxWidth: 220 }}
            placeholder={t("ابحث بالاسم أو رقم الهوية...", "Search by name or ID...")}
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
          />
          <select style={{ ...inputStyle, maxWidth: 220 }} value={filterBranch} onChange={(e) => setFilterBranch(e.target.value)}>
            <option value="">{t("كل الفروع", "All Branches")}</option>
            {branches.map((b) => (
              <option key={b.id} value={b.id}>
                {b.name}
              </option>
            ))}
          </select>
          <Btn onClick={() => window.print()}>{t("🖶 طباعة القائمة", "🖶 Print List")}</Btn>
        </div>
      </div>

      <div className="print-section">
        <div style={{ display: "none" }} className="print-only-title">
          <div className="print-brand">{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          {t("قائمة الموظفين", "Employee List")}
        </div>
        <div style={{ display: "none" }} className="print-only-meta">
          <span>{t(`تاريخ الطباعة: ${new Date().toLocaleDateString("ar-SA-u-nu-latn")}`, `Print Date: ${new Date().toLocaleDateString("en-US")}`)}</span>
          <span>{list.length} {t("موظف", "employees")}</span>
        </div>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "auto" }}>
        {list.length === 0 && <Empty text={t("لا يوجد موظفون مطابقون", "No matching employees")} />}
        {list.length > 0 && (
          <table className="responsive-table" style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, minWidth: 920 }}>
            <thead>
              <tr style={{ background: COLORS.paperDark, textAlign: "right" }}>
                <th style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.coffee }}></th>
                <th
                  style={{
                    padding: "9px 12px",
                    fontWeight: 700,
                    color: COLORS.coffee,
                    position: "sticky",
                    insetInlineStart: 0,
                    background: COLORS.paperDark,
                    zIndex: 2,
                    boxShadow: "2px 0 4px rgba(59,42,29,0.08)",
                  }}
                >
                  {t("الاسم", "Name")}
                </th>
                {[
                  t("الفرع", "Branch"),
                  t("الوظيفة", "Position"),
                  t("الجنسية", "Nationality"),
                  t("الراتب", "Salary"),
                  t("تاريخ التعيين", "Hire Date"),
                  t("الحالة", "Status"),
                  "",
                ].map((h, i) => (
                  <th key={i} style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.coffee }}>
                    {h}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {list.map((e) => (
                <tr key={e.id} style={{ borderTop: `1px dashed ${COLORS.line}` }}>
                  <td style={{ padding: "9px 12px" }}>
                    {e.photo ? (
                      <img src={e.photo} alt="" style={{ width: 30, height: 30, borderRadius: "50%", objectFit: "cover", border: `1px solid ${COLORS.line}` }} />
                    ) : (
                      <div style={{ width: 30, height: 30, borderRadius: "50%", background: COLORS.paperDark, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, fontWeight: 700, color: "#a3927a" }}>
                        {(e.name || "؟").trim().charAt(0)}
                      </div>
                    )}
                  </td>
                  <td
                    data-label={t("الاسم", "Name")}
                    style={{
                      padding: "9px 12px",
                      fontWeight: 700,
                      color: COLORS.brick,
                      cursor: "pointer",
                      textDecoration: "underline dotted",
                      position: "sticky",
                      insetInlineStart: 0,
                      background: "#fff",
                      zIndex: 1,
                      boxShadow: "2px 0 4px rgba(59,42,29,0.08)",
                    }}
                    onClick={() => setProfileEmp(e)}
                    title={t("عرض الملف الكامل", "View full profile")}
                  >
                    {e.name}
                  </td>
                  <td data-label={t("الفرع", "Branch")} style={{ padding: "9px 12px" }}>
                    {branches.find((b) => b.id === e.branchId)?.name || "—"}
                    {Array.isArray(e.additionalBranchIds) && e.additionalBranchIds.length > 0 && (
                      <span style={{ color: "#a3927a", fontSize: 11 }}> (+{e.additionalBranchIds.length})</span>
                    )}
                  </td>
                  <td data-label={t("الوظيفة", "Position")} style={{ padding: "9px 12px" }}>{e.position}</td>
                  <td data-label={t("الجنسية", "Nationality")} style={{ padding: "9px 12px" }}>{trLabel(t, NATIONALITY_LABELS_EN, e.nationality)}</td>
                  <td data-label={t("الراتب", "Salary")} style={{ padding: "9px 12px", fontFamily: "Consolas, monospace" }}>{fmt(e.salary)} ﷼</td>
                  <td data-label={t("تاريخ التعيين", "Hire Date")} style={{ padding: "9px 12px" }}>{e.joinDate || "—"}</td>
                  <td data-label={t("الحالة", "Status")} style={{ padding: "9px 12px" }}>
                    <Stamp tone={e.status === "نشط" ? "green" : e.status === "موقوف" ? "gold" : "brick"}>{trLabel(t, STATUS_LABELS_EN, e.status)}</Stamp>
                  </td>
                  <td style={{ padding: "9px 12px", display: "flex", gap: 6 }} className="no-print">
                    <Btn small tone="secondary" onClick={() => edit(e)}>{t("تعديل", "Edit")}</Btn>
                    <Btn small tone="danger" onClick={() => remove(e.id)}>{t("حذف", "Delete")}</Btn>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      </div>

      {profileEmp && (
        <EmployeeProfileModal
          emp={employees.find((e) => e.id === profileEmp.id) || profileEmp}
          branches={branches}
          leaves={leaves || []}
          onAddCareerEntry={addCareerEntry}
          onRemoveCareerEntry={removeCareerEntry}
          onUpdateGovFees={updateGovFees}
          onToggleWeeklyOffDay={toggleWeeklyOffDay}
          onUpdateWorkShift={updateWorkShift}
          canEditWeeklyOff={canEditWeeklyOff}
          onClose={() => setProfileEmp(null)}
        />
      )}
    </div>
  );
}

/* ============ الملف الشخصي الكامل للموظف ============ */
function EmployeeProfileModal({ emp, branches, leaves, onAddCareerEntry, onRemoveCareerEntry, onUpdateGovFees, onToggleWeeklyOffDay, onUpdateWorkShift, canEditWeeklyOff = true, onClose }) {
  const { t } = useLang();
  const [careerForm, setCareerForm] = useState({ date: new Date().toISOString().slice(0, 10), title: "", note: "" });
  const feesRefs = {
    iqamaRenewal: useRef(null),
    workPermit: useRef(null),
    dependentsLevy: useRef(null),
    other: useRef(null),
  };
  const [feesTotal, setFeesTotal] = useState(
    Number(emp.govFees?.iqamaRenewal || 0) +
      Number(emp.govFees?.workPermit ?? 100) +
      Number(emp.govFees?.dependentsLevy ?? 800) +
      Number(emp.govFees?.other || 0)
  );

  const isSaudi = emp.nationality === "سعودي";
  const branchName = branches.find((b) => b.id === emp.branchId)?.name || "—";
  const iqamaSt = expiryStatus(emp.iqamaExpiry, t);
  const contractSt = expiryStatus(emp.contractEnd, t);
  const empLeaves = (leaves || []).filter((l) => l.employeeId === emp.id);
  const leaveDays = (l) => {
    if (!l.from || !l.to) return 0;
    const d = Math.round((new Date(l.to) - new Date(l.from)) / 86400000) + 1;
    return d > 0 ? d : 0;
  };
  const totalLeaveDays = empLeaves.reduce((s, l) => s + leaveDays(l), 0);
  const leaveBal = leaveBalanceInfo(emp, leaves);
  const career = [...(emp.careerHistory || [])].sort((a, b) => (a.date < b.date ? 1 : -1));

  const addCareer = () => {
    if (!careerForm.title || !careerForm.date) return;
    onAddCareerEntry(emp.id, careerForm);
    setCareerForm({ date: new Date().toISOString().slice(0, 10), title: "", note: "" });
  };

  const recomputeFeesTotal = () => {
    const total =
      Number(feesRefs.iqamaRenewal.current?.value || 0) +
      Number(feesRefs.workPermit.current?.value || 0) +
      Number(feesRefs.dependentsLevy.current?.value || 0) +
      Number(feesRefs.other.current?.value || 0);
    setFeesTotal(total);
  };

  const saveFees = () => {
    onUpdateGovFees &&
      onUpdateGovFees(emp.id, {
        iqamaRenewal: Number(feesRefs.iqamaRenewal.current?.value || 0),
        workPermit: Number(feesRefs.workPermit.current?.value || 0),
        dependentsLevy: Number(feesRefs.dependentsLevy.current?.value || 0),
        other: Number(feesRefs.other.current?.value || 0),
      });
    recomputeFeesTotal();
  };

  const Section = ({ title, children }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.coffee, marginBottom: 10, borderBottom: `1px dashed ${COLORS.line}`, paddingBottom: 6 }}>
        {title}
      </div>
      {children}
    </div>
  );

  const InfoRow = ({ label, value }) => (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "5px 0" }}>
      <span style={{ color: "#a3927a" }}>{label}</span>
      <span style={{ fontWeight: 700, color: COLORS.espresso }}>{value || "—"}</span>
    </div>
  );

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(36,24,17,0.55)",
        zIndex: 60,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 20,
      }}
      onClick={onClose}
    >

                          fontWeight: 700,

                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontWeight: 700, fontSize: 12.5 }}>{emp.exitReentryExpiry || "—"}</span>

            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0" }}>
              <span style={{ fontSize: 12.5, color: "#a3927a" }}>{t("نهاية العقد", "Contract End")}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 700, fontSize: 12.5 }}>{emp.contractEnd || "—"}</span>
                <Stamp tone={contractSt.tone}>
                  {emp.contractType === "غير محدد المدة" && !emp.contractEnd ? t("عقد مفتوح", "Open-ended") : contractSt.label}

          </Section>

          {!isSaudi && (

            <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 10 }}>
              <Field label={t("رسوم تجديد الإقامة (﷼)", "Iqama Renewal Fee (SAR)")}>
                <input
                  ref={feesRefs.iqamaRenewal}
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  defaultValue={emp.govFees?.iqamaRenewal ?? ""}
                  onInput={(e) => {
                    e.target.value = e.target.value.replace(/[^0-9.]/g, "");
                  }}
                />
              </Field>
              <Field label={t("رسوم رخصة العمل (﷼)", "Work Permit Fee (SAR)")}>
                <input
                  ref={feesRefs.workPermit}
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  defaultValue={emp.govFees?.workPermit ?? 100}
                  onInput={(e) => {
                    e.target.value = e.target.value.replace(/[^0-9.]/g, "");
                  }}
                />
              </Field>
              <Field label={t("المقابل المالي للعمالة (﷼)", "Expat Levy (SAR)")}>
                <input
                  ref={feesRefs.dependentsLevy}
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  defaultValue={emp.govFees?.dependentsLevy ?? 800}
                  onInput={(e) => {
                    e.target.value = e.target.value.replace(/[^0-9.]/g, "");
                  }}
                />
              </Field>
              <Field label={t("رسوم أخرى (﷼)", "Other Fees (SAR)")}>
                <input
                  ref={feesRefs.other}
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  defaultValue={emp.govFees?.other ?? ""}
                  onInput={(e) => {
                    e.target.value = e.target.value.replace(/[^0-9.]/g, "");
                  }}
                />
              </Field>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
              <Btn small onClick={saveFees}>{t("💾 حفظ الرسوم", "💾 Save Fees")}</Btn>
              <div style={{ background: COLORS.paperDark, borderRadius: 8, padding: "10px 12px", display: "flex", gap: 10, alignItems: "center" }}>
                <span style={{ fontSize: 12.5, color: "#a3927a" }}>{t("إجمالي الرسوم الحكومية", "Total Government Fees")}</span>
                <span style={{ fontWeight: 800, fontSize: 14, color: COLORS.brick }}>{fmt(feesTotal)} ﷼</span>
              </div>
            </div>
            <div style={{ fontSize: 10.5, color: "#a3927a", marginTop: 6 }}>
              {t("اكتب القيم ثم اضغط \"حفظ الرسوم\" لحفظها وتحديث الإجمالي.", "Enter the values then press \"Save Fees\" to save them and update the total.")}
            </div>
          </Section>
          )}

          <Section title={`${t("المسار الوظيفي", "Career Path")} (${career.length})`}>
            <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
              <DateField style={{ ...inputStyle, maxWidth: 140 }} value={careerForm.date} onChange={(v) => setCareerForm({ ...careerForm, date: v })} />
              <input
                style={{ ...inputStyle, maxWidth: 200 }}
                placeholder={t("مثال: ترقية إلى مشرف فرع", "e.g. Promoted to Branch Supervisor")}
                value={careerForm.title}
                onChange={(e) => setCareerForm({ ...careerForm, title: e.target.value })}
              />
              <input
                style={{ ...inputStyle, maxWidth: 200 }}
                placeholder={t("ملاحظة (اختياري)", "Note (optional)")}
                value={careerForm.note}
                onChange={(e) => setCareerForm({ ...careerForm, note: e.target.value })}
              />
              <Btn small onClick={addCareer}>{t("إضافة", "Add")}</Btn>
            </div>
            {career.length === 0 && <Empty text={t("لا يوجد سجل مسار وظيفي بعد", "No career history recorded yet")} />}
            {career.map((h) => (
              <div key={h.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderTop: `1px dashed ${COLORS.line}` }}>
                <div>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.espresso }}>{h.title}</div>
                  {h.note && <div style={{ fontSize: 11, color: "#a3927a" }}>{h.note}</div>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 11, color: "#a3927a" }}>{h.date}</span>
                  <Btn small tone="danger" onClick={() => onRemoveCareerEntry(emp.id, h.id)}>{t("حذف", "Delete")}</Btn>
                </div>
              </div>
            ))}
          </Section>

          <Section title={`${t("الإجازات", "Leaves")} — ${t(`إجمالي ${totalLeaveDays} يوم`, `Total ${totalLeaveDays} days`)}`}>
            {leaveBal && (
              <div style={{ background: COLORS.paperDark, borderRadius: 8, padding: "10px 12px", marginBottom: 10, display: "flex", flexWrap: "wrap", gap: "4px 18px" }}>
                <span style={{ fontSize: 12 }}>{t("الاستحقاق السنوي", "Annual Entitlement")}: <b>{fmt(leaveBal.perYear)} {t("يوم", "days")}</b></span>
                <span style={{ fontSize: 12 }}>{t("الرصيد المتراكم", "Accrued to Date")}: <b>{fmt(leaveBal.accrued)} {t("يوم", "days")}</b></span>
                <span style={{ fontSize: 12 }}>{t("المستخدم (سنة الخدمة الحالية)", "Used (Current Service Year)")}: <b>{fmt(leaveBal.usedDays)} {t("يوم", "days")}</b></span>
                {leaveBal.adjustment !== 0 && (
                  <span style={{ fontSize: 12 }}>
                    {t("تسوية يدوية", "Manual Adjustment")}: <b>{leaveBal.adjustment > 0 ? "+" : ""}{fmt(leaveBal.adjustment)} {t("يوم", "days")}</b>
                  </span>
                )}
                <span style={{ fontSize: 12, color: leaveBal.balance < 0 ? COLORS.brick : COLORS.green }}>
                  {t("الرصيد المتبقي", "Remaining Balance")}: <b>{fmt(leaveBal.balance)} {t("يوم", "days")}</b>
                </span>
                <span style={{ fontSize: 10.5, color: "#a3927a", width: "100%" }}>
                  {t(`محسوب منذ ذكرى التعيين ${leaveBal.anniversaryDate} (${leaveBal.monthsCompleted} شهر مكتمل)`, `Calculated since anniversary ${leaveBal.anniversaryDate} (${leaveBal.monthsCompleted} completed months)`)}
                </span>
              </div>
            )}
            {empLeaves.length === 0 && <Empty text={t("لا توجد إجازات مسجّلة لهذا الموظف", "No leaves recorded for this employee")} />}
            {empLeaves.map((l, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderTop: `1px dashed ${COLORS.line}` }}>
                <Stamp tone="gold">{trLabel(t, LEAVE_TYPE_LABELS_EN, l.type)}</Stamp>
                <span style={{ fontSize: 12.5 }}>{l.from} → {l.to}</span>
                <span style={{ fontSize: 11.5, color: "#a3927a" }}>{t(`${leaveDays(l)} يوم`, `${leaveDays(l)} days`)}</span>
              </div>
            ))}
          </Section>
        </div>
      </div>
    </div>
  );
}

/* ============ الإقامات والعقود ============ */
function IqamasContractsTab({ employees, setEmployees, branches }) {
  const { t } = useLang();
  const [filterUrgency, setFilterUrgency] = useState("");

  const update = (id, field, value) => {
    setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  };

  const nonSaudi = employees.filter((e) => e.status === "نشط");

  const rows = nonSaudi.map((e) => ({
    ...e,
    iqamaStatus: expiryStatus(e.iqamaExpiry, t),
    contractStatus: expiryStatus(e.contractEnd, t),
    exitReentryStatus: expiryStatus(e.exitReentryExpiry, t),
  }));

  const filtered = rows.filter((r) => {
    if (!filterUrgency) return true;
    if (filterUrgency === "iqama") return r.iqamaStatus.days !== null && r.iqamaStatus.days <= 90;
    if (filterUrgency === "contract") return r.contractStatus.days !== null && r.contractStatus.days <= 90;
    if (filterUrgency === "exitReentry") return r.exitReentryStatus.days !== null && r.exitReentryStatus.days <= 90;
    return true;
  });

  const iqamaAlerts = rows.filter((r) => r.iqamaStatus.days !== null && r.iqamaStatus.days <= 30).length;
  const contractAlerts = rows.filter((r) => r.contractStatus.days !== null && r.contractStatus.days <= 30).length;
  const exitReentryAlerts = rows.filter((r) => r.nationality !== "سعودي" && r.exitReentryStatus.days !== null && r.exitReentryStatus.days <= 30).length;

  return (
    <div>
      <Header title={t("الإقامات والعقود", "Iqamas & Contracts")} subtitle={t("متابعة تواريخ انتهاء الإقامات وعقود العمل لتفادي الغرامات وتجديد العقود في وقتها", "Track iqama and contract expiry dates to avoid fines and renew on time")} />

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
        <ReceiptCard label={t("إقامات تنتهي خلال 30 يوم", "Iqamas expiring within 30 days")} value={fmt(iqamaAlerts)} tone={iqamaAlerts > 0 ? COLORS.brick : COLORS.green} />
        <ReceiptCard label={t("عقود تنتهي خلال 30 يوم", "Contracts expiring within 30 days")} value={fmt(contractAlerts)} tone={contractAlerts > 0 ? COLORS.brick : COLORS.green} />
        <ReceiptCard label={t("تأشيرات خروج وعودة تنتهي خلال 30 يوم", "Exit/re-entry visas expiring within 30 days")} value={fmt(exitReentryAlerts)} tone={exitReentryAlerts > 0 ? COLORS.brick : COLORS.green} />
        <ReceiptCard label={t("إجمالي الموظفين النشطين", "Total Active Employees")} value={fmt(rows.length)} />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 10 }} className="no-print">
        <SectionTitle>{t("جدول المتابعة", "Tracking Table")}</SectionTitle>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <select style={{ ...inputStyle, maxWidth: 260 }} value={filterUrgency} onChange={(e) => setFilterUrgency(e.target.value)}>
            <option value="">{t("عرض الكل", "Show All")}</option>
            <option value="iqama">{t("إقامات مقتربة من الانتهاء (90 يوم)", "Iqamas nearing expiry (90 days)")}</option>
            <option value="contract">{t("عقود مقتربة من الانتهاء (90 يوم)", "Contracts nearing expiry (90 days)")}</option>
            <option value="exitReentry">{t("تأشيرات خروج وعودة مقتربة من الانتهاء (90 يوم)", "Exit/re-entry visas nearing expiry (90 days)")}</option>
          </select>
          <Btn onClick={() => window.print()}>{t("🖶 طباعة الجدول", "🖶 Print Table")}</Btn>
        </div>
      </div>

      <div className="print-section">
        <div style={{ display: "none" }} className="print-only-title">
          <div className="print-brand">{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          {t("الإقامات والعقود", "Iqamas & Contracts")}
        </div>
        <div style={{ display: "none" }} className="print-only-meta">
          <span>{t(`تاريخ الطباعة: ${new Date().toLocaleDateString("ar-SA-u-nu-latn")}`, `Print Date: ${new Date().toLocaleDateString("en-US")}`)}</span>
          <span>{filtered.length} {t("سجل", "records")}</span>
        </div>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "auto" }}>
        {filtered.length === 0 && <Empty text={t("لا توجد بيانات مطابقة", "No matching data")} />}
        {filtered.length > 0 && (
          <table className="responsive-table" style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, minWidth: 1560 }}>
            <thead>
              <tr style={{ background: COLORS.paperDark, textAlign: "right" }}>
                <th
                  style={{
                    padding: "9px 12px",
                    fontWeight: 700,
                    color: COLORS.coffee,
                    position: "sticky",
                    insetInlineStart: 0,
                    background: COLORS.paperDark,
                    zIndex: 2,
                    boxShadow: "2px 0 4px rgba(59,42,29,0.08)",
                  }}
                >
                  {t("الاسم", "Name")}
                </th>
                {[
                  t("الفرع", "Branch"),
                  t("الجنسية", "Nationality"),
                  t("رقم الهوية/الإقامة", "National ID/Iqama No."),
                  t("انتهاء الإقامة", "Iqama Expiry"),
                  t("حالة الإقامة", "Iqama Status"),
                  t("رقم تأشيرة الخروج والعودة", "Exit/Re-entry Visa No."),
                  t("انتهاء تأشيرة الخروج والعودة", "Exit/Re-entry Visa Expiry"),
                  t("حالة تأشيرة الخروج والعودة", "Exit/Re-entry Visa Status"),
                  t("نوع العقد", "Contract Type"),
                  t("نهاية العقد", "Contract End"),
                  t("حالة العقد", "Contract Status"),
                ].map((h, i) => (
                  <th key={i} style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.coffee }}>{h}</th>

            <tbody>
              {filtered.map((r) => (

                    style={{
                      padding: "9px 12px",
                      fontWeight: 700,
                      position: "sticky",
                      insetInlineStart: 0,
                      background: "#fff",
                      zIndex: 1,
                      boxShadow: "2px 0 4px rgba(59,42,29,0.08)",
                    }}

                    {r.name}

                  <td data-label={t("الفرع", "Branch")} style={{ padding: "9px 12px" }}>{branches.find((b) => b.id === r.branchId)?.name || "—"}</td>
                  <td data-label={t("الجنسية", "Nationality")} style={{ padding: "9px 12px" }}>{trLabel(t, NATIONALITY_LABELS_EN, r.nationality)}</td>
                  <td data-label={t("رقم الهوية/الإقامة", "National ID/Iqama No.")} style={{ padding: "9px 12px", fontFamily: "Consolas, monospace" }}>{r.nationalId || "—"}</td>
                  <td data-label={t("انتهاء الإقامة", "Iqama Expiry")} style={{ padding: "9px 12px" }}>
                    <DateField

                    <Stamp tone={r.iqamaStatus.tone}>{r.iqamaStatus.label}</Stamp>
                  </td>
                  <td data-label={t("رقم تأشيرة الخروج والعودة", "Exit/Re-entry Visa No.")} style={{ padding: "9px 12px" }}>
                    {r.nationality === "سعودي" ? (

                      <input

  crNumber: "",
  crExpiry: "",
  civilDefenseNumber: "",
  civilDefenseExpiry: "",
  municipalityNumber: "",
  municipalityExpiry: "",
};

const EMPTY_VEHICLE = {
  branchId: "",
  plateNumber: "",
  make: "",
  istimaraExpiry: "",
  periodicInspectionExpiry: "",
  insuranceCompany: "",
  insurancePolicyNumber: "",
  insuranceExpiry: "",
};

  const { t } = useLang();
  const [filterUrgency, setFilterUrgency] = useState("");
  const [healthSearch, setHealthSearch] = useState("");
  const [vehicleForm, setVehicleForm] = useState(EMPTY_VEHICLE);
  const [editingVehicleId, setEditingVehicleId] = useState(null);

  const updateBranch = (id, field, value) => {
    setBranches((prev) => prev.map((b) => (b.id === id ? { ...b, [field]: value } : b)));
  };

  const updateEmployee = (id, field, value) => {
    setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  };

  const resetVehicleForm = () => {
    setVehicleForm(EMPTY_VEHICLE);
    setEditingVehicleId(null);
  };

  const submitVehicle = () => {
    if (!vehicleForm.plateNumber || !vehicleForm.branchId) return;
    if (editingVehicleId) {
      setVehicles((prev) => prev.map((v) => (v.id === editingVehicleId ? { ...vehicleForm, id: editingVehicleId } : v)));
    } else {
      setVehicles((prev) => [...prev, { ...vehicleForm, id: uid() }]);
    }
    resetVehicleForm();
  };

  const editVehicle = (v) => {
    setVehicleForm(v);
    setEditingVehicleId(v.id);
  };

  const removeVehicle = (id) => {
    setVehicles((prev) => prev.filter((v) => v.id !== id));
    if (editingVehicleId === id) resetVehicleForm();
  };

  const updateVehicle = (id, field, value) => {
    setVehicles((prev) => prev.map((v) => (v.id === id ? { ...v, [field]: value } : v)));

    ...b,
    crStatus: expiryStatus(b.crExpiry, t),

    const groups = branches

/* ============ الكيانات والفروع ============ */
function BranchesTab({ entities, setEntities, branches, setBranches, employees, canManageEntities = true, canManageGeofence = false }) {
  const { t } = useLang();
  const [entityName, setEntityName] = useState("");
  const [branchForm, setBranchForm] = useState({ entityId: entities.length === 1 ? entities[0].id : "", name: "", city: "" });
  const [locatingId, setLocatingId] = useState(null);
  const [locError, setLocError] = useState("");
  const [editingEntityId, setEditingEntityId] = useState(null);
  const [editEntityName, setEditEntityName] = useState("");
  const [editingBranchId, setEditingBranchId] = useState(null);
  const [editBranchForm, setEditBranchForm] = useState({ name: "", city: "" });
  const [mapPickerBranchId, setMapPickerBranchId] = useState(null);

  const addEntity = () => {
    if (!entityName.trim()) return;
    setEntities((prev) => [...prev, { id: uid(), name: entityName.trim() }]);
    setEntityName("");
  };
  const removeEntity = (id) => {
    setEntities((prev) => prev.filter((e) => e.id !== id));
    setBranches((prev) => prev.filter((b) => b.entityId !== id));
  };
  const startEditEntity = (en) => {
    setEditingEntityId(en.id);
    setEditEntityName(en.name);
  };
  const cancelEditEntity = () => {
    setEditingEntityId(null);
    setEditEntityName("");
  };
  /* تعديل اسم الكيان فقط — بقية بياناته (الفروع التابعة له وكل تفاصيلها) تفضل زي ما هي بدون أي تغيير */
  const saveEditEntity = () => {
    if (!editEntityName.trim()) return;
    setEntities((prev) => prev.map((en) => (en.id === editingEntityId ? { ...en, name: editEntityName.trim() } : en)));
    cancelEditEntity();
  };
  const startEditBranch = (b) => {
    setEditingBranchId(b.id);
    setEditBranchForm({ name: b.name || "", city: b.city || "" });
  };
  const cancelEditBranch = () => {
    setEditingBranchId(null);
    setEditBranchForm({ name: "", city: "" });
  };
  /* تعديل اسم الفرع/المدينة فقط — الإحداثيات الجغرافية (lat/lng) والنطاق ومركز الجيوفنس وبقية بيانات الفرع تفضل زي ما هي بدون أي تغيير */
  const saveEditBranch = () => {
    if (!editBranchForm.name.trim()) return;
    setBranches((prev) =>
      prev.map((b) => (b.id === editingBranchId ? { ...b, name: editBranchForm.name.trim(), city: editBranchForm.city.trim() } : b))
    );
    cancelEditBranch();
  };
  const addBranch = () => {
    if (!branchForm.name.trim() || !branchForm.entityId) return;
    setBranches((prev) => [...prev, { id: uid(), radius: 150, lat: null, lng: null, ...branchForm }]);
    setBranchForm({ entityId: "", name: "", city: "" });
  };
  const removeBranch = (id) => setBranches((prev) => prev.filter((b) => b.id !== id));

  const captureLocation = async (branchId) => {
    setLocError("");
    setLocatingId(branchId);
    try {
      const pos = await getCurrentPosition();
      const { latitude, longitude } = pos.coords;
      setBranches((prev) => prev.map((b) => (b.id === branchId ? { ...b, lat: latitude, lng: longitude } : b)));
    } catch (err) {
      if (err && err.code === 1) setLocError(t("تم رفض إذن الوصول للموقع — فعّله من إعدادات المتصفح.", "Location permission denied — enable it in browser settings."));
      else if (err && err.message === "NOT_SUPPORTED") setLocError(t("المتصفح لا يدعم خدمة تحديد الموقع.", "This browser doesn't support geolocation."));
      else setLocError(t("تعذّر تحديد الموقع — تأكد من تفعيل GPS وحاول مرة أخرى.", "Couldn't get location — make sure GPS is enabled and try again."));
    } finally {
      setLocatingId(null);
    }
  };

  const updateRadius = (branchId, val) => {
    const radius = Math.max(20, Number(val) || 150);
    setBranches((prev) => prev.map((b) => (b.id === branchId ? { ...b, radius } : b)));
  };

  const clearLocation = (branchId) => {
    setBranches((prev) => prev.map((b) => (b.id === branchId ? { ...b, lat: null, lng: null } : b)));
  };

  /* تأكيد الموقع المُختار من نافذة الخريطة وربطه بالفرع */
  const confirmMapLocation = (branchId, picked) => {
    setBranches((prev) => prev.map((b) => (b.id === branchId ? { ...b, lat: picked.lat, lng: picked.lng } : b)));
    setMapPickerBranchId(null);
  };

  return (
    <div>
      <Header title={t("الكيانات والفروع", "Entities & Branches")} subtitle={t("الهيكل التنظيمي للمجموعة", "The group's organizational structure")} />

      <SectionTitle>{t("الكيانات (المؤسسات / الشركات)", "Entities (Establishments / Companies)")}</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 16, marginBottom: 20 }}>
        {canManageEntities && (
          <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
            <input
              style={{ ...inputStyle, flex: 1 }}
              placeholder={t("اسم الكيان الجديد", "New entity name")}
              value={entityName}
              onChange={(e) => setEntityName(e.target.value)}
            />
            <Btn onClick={addEntity}>{t("إضافة كيان", "Add Entity")}</Btn>
          </div>
        )}
        {entities.map((en) => (
          <div
            key={en.id}
            style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 4px", borderTop: `1px dashed ${COLORS.line}`, flexWrap: "wrap", gap: 8 }}
          >
            {editingEntityId === en.id ? (
              <React.Fragment>
                <input
                  style={{ ...inputStyle, flex: 1, minWidth: 160 }}
                  value={editEntityName}
                  onChange={(e) => setEditEntityName(e.target.value)}
                  autoFocus
                />
                <div style={{ display: "flex", gap: 8 }}>
                  <Btn small onClick={saveEditEntity}>{t("حفظ", "Save")}</Btn>
                  <Btn small tone="secondary" onClick={cancelEditEntity}>{t("إلغاء", "Cancel")}</Btn>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div style={{ fontSize: 13, fontWeight: 600 }}>{en.name}</div>
                <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
                  <Stamp>{branches.filter((b) => b.entityId === en.id).length} {t("فرع", "branches")}</Stamp>
                  {canManageEntities && (
                    <React.Fragment>
                      <Btn small tone="secondary" onClick={() => startEditEntity(en)}>{t("تعديل", "Edit")}</Btn>
                      <Btn small tone="danger" onClick={() => removeEntity(en.id)}>{t("حذف", "Delete")}</Btn>
                    </React.Fragment>
                  )}
                </div>
              </React.Fragment>
            )}
          </div>
        ))}
      </div>

      <SectionTitle>{t("الفروع", "Branches")}</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 16 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10, marginBottom: 14 }}>
          <Field label={t("الكيان التابع له", "Parent Entity")}>
            <select style={inputStyle} value={branchForm.entityId} onChange={(e) => setBranchForm({ ...branchForm, entityId: e.target.value })}>
              <option value="">{t("اختر الكيان", "Select entity")}</option>
              {entities.map((en) => (
                <option key={en.id} value={en.id}>
                  {en.name}
                </option>
              ))}
            </select>
          </Field>
          <Field label={t("اسم الفرع", "Branch Name")}>
            <input style={inputStyle} value={branchForm.name} onChange={(e) => setBranchForm({ ...branchForm, name: e.target.value })} />
          </Field>
          <Field label={t("المدينة", "City")}>
            <input style={inputStyle} value={branchForm.city} onChange={(e) => setBranchForm({ ...branchForm, city: e.target.value })} />
          </Field>
          <div style={{ display: "flex", alignItems: "flex-end" }}>
            <Btn onClick={addBranch}>{t("إضافة فرع", "Add Branch")}</Btn>
          </div>
        </div>

        {canManageGeofence && locError && (
          <div style={{ fontSize: 12, color: COLORS.brick, marginBottom: 10, padding: "8px 10px", background: "#FBEAEA", borderRadius: 8 }}>
            {locError}
          </div>
        )}

        {canManageGeofence && (
          <div style={{ fontSize: 11.5, color: "#8a7a63", marginBottom: 10, padding: "8px 10px", background: "#FAF6EC", borderRadius: 8 }}>
            {t(
              "📍 لتفعيل تسجيل الحضور بالموقع الجغرافي: قف داخل الفرع فعليًا ثم اضغط \"التقط الموقع الحالي\" — هيتم استخدامه كمركز نطاق الفرع. (هذا الإعداد خاص بالأدمن ومدير الكيان فقط)",
              "📍 To enable location-based attendance: stand physically inside the branch, then tap \"Capture current location\" — it will be used as the branch's geofence center. (Admin and Entity Manager only)"
            )}
          </div>
        )}

        {branches
          .slice()
          .sort((a, b) => {
            const entA = entities.find((en) => en.id === a.entityId)?.name || "";
            const entB = entities.find((en) => en.id === b.entityId)?.name || "";
            if (entA !== entB) return entA.localeCompare(entB, "ar");
            return (a.name || "").localeCompare(b.name || "", "ar");
          })
          .map((b) => (
          <div
            key={b.id}
            style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 4px", borderTop: `1px dashed ${COLORS.line}`, flexWrap: "wrap", gap: 8 }}
          >
            {editingBranchId === b.id ? (
              <React.Fragment>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, flex: 1, minWidth: 220 }}>
                  <Field label={t("اسم الفرع", "Branch Name")}>
                    <input
                      style={inputStyle}
                      value={editBranchForm.name}
                      onChange={(e) => setEditBranchForm({ ...editBranchForm, name: e.target.value })}
                      autoFocus
                    />
                  </Field>
                  <Field label={t("المدينة", "City")}>
                    <input
                      style={inputStyle}
                      value={editBranchForm.city}
                      onChange={(e) => setEditBranchForm({ ...editBranchForm, city: e.target.value })}
                    />
                  </Field>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
                  <Btn small onClick={saveEditBranch}>{t("حفظ", "Save")}</Btn>
                  <Btn small tone="secondary" onClick={cancelEditBranch}>{t("إلغاء", "Cancel")}</Btn>
                </div>
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div>
                  <div style={{ fontSize: 13, fontWeight: 700 }}>{b.name}</div>
                  <div style={{ fontSize: 11, color: "#8a7a63" }}>{entities.find((en) => en.id === b.entityId)?.name || "—"} · {b.city}</div>
                  <div style={{ fontSize: 11, marginTop: 4 }}>
                    {b.lat != null && b.lng != null ? (
                      <span style={{ color: COLORS.green, fontWeight: 700 }}>
                        ✅ {t("الموقع محدد", "Location set")} ({b.lat.toFixed(5)}, {b.lng.toFixed(5)})
                      </span>
                    ) : (
                      <span style={{ color: COLORS.brick, fontWeight: 700 }}>⚠️ {t("الموقع غير محدد — الحضور بالموقع معطّل لهذا الفرع", "Location not set — location-based attendance is disabled for this branch")}</span>
                    )}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  {canManageGeofence ? (
                    <>
                      {b.lat != null && (
                        <Field label={t("النطاق (متر)", "Radius (m)")}>
                          <input
                            type="number"
                            style={{ ...inputStyle, width: 90 }}
                            value={b.radius || 150}
                            onChange={(e) => updateRadius(b.id, e.target.value)}
                          />
                        </Field>
                      )}
                      <Btn small onClick={() => captureLocation(b.id)} disabled={locatingId === b.id}>
                        {locatingId === b.id ? t("⏳ جارِ التحديد...", "⏳ Locating...") : t("📍 التقط الموقع الحالي", "📍 Capture current location")}
                      </Btn>
                      <Btn small tone="secondary" onClick={() => setMapPickerBranchId(b.id)}>
                        {t("🗺️ تحديد من الخريطة", "🗺️ Pick on map")}
                      </Btn>
                      {b.lat != null && (
                        <Btn small tone="secondary" onClick={() => clearLocation(b.id)}>{t("إلغاء الموقع", "Clear location")}</Btn>
                      )}
                    </>
                  ) : (
                    b.lat != null && <Stamp>{t("النطاق", "Radius")}: {b.radius || 150}{t("م", "m")}</Stamp>
                  )}
                  <Stamp>{employees.filter((e) => e.branchId === b.id).length} {t("موظف", "employees")}</Stamp>
                  <Btn small tone="secondary" onClick={() => startEditBranch(b)}>{t("تعديل", "Edit")}</Btn>
                  <Btn small tone="danger" onClick={() => removeBranch(b.id)}>{t("حذف", "Delete")}</Btn>
                </div>
              </React.Fragment>
            )}
          </div>
        ))}
      </div>

      {mapPickerBranchId && (
        <MapPickerModal
          initialLat={branches.find((b) => b.id === mapPickerBranchId)?.lat}
          initialLng={branches.find((b) => b.id === mapPickerBranchId)?.lng}
          onConfirm={(picked) => confirmMapLocation(mapPickerBranchId, picked)}
          onClose={() => setMapPickerBranchId(null)}
        />
      )}
    </div>
  );
}

/* ============ الحضور والإجازات ============ */
function AttendanceTab({ employees, setEmployees, leaves, setLeaves, attendance, setAttendance, logActivity, entities, branches }) {

  const leaveEmployees = leaveForm.branchId
    ? employees.filter((e) => e.branchId === leaveForm.branchId)
    : leaveForm.entityId
    ? employees.filter((e) => leaveBranches.some((b) => b.id === e.branchId))
    : employees;

  const attBranches = attForm.entityId ? branches.filter((b) => b.entityId === attForm.entityId) : branches;

/* ============ الرواتب و GOSI ============ */
function PayrollTab({ employees, branches, entities, entityOfBranch, gosiRates, attendance, leaves, payrollItems, setPayrollItems, logActivity }) {
  const { t } = useLang();
  const [branchFilter, setBranchFilter] = useState("");
  const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
  const [searchQuery, setSearchQuery] = useState("");
  const [itemForm, setItemForm] = useState({ employeeId: "", type: "سلفة", amount: "", month: new Date().toISOString().slice(0, 7), note: "", repayment: "دفعة واحدة", installments: 2 });
  const [payslip, setPayslip] = useState(null);

  const addItem = () => {
    if (!itemForm.employeeId || !itemForm.amount || Number(itemForm.amount) <= 0) return;
    const totalAmount = Number(itemForm.amount);

    /* السلفة على دفعات: تُقسَّم على عدة أشهر متتالية بدءًا من شهر الاستحقاق المحدد */
    if (itemForm.type === "سلفة" && itemForm.repayment === "أقساط" && Number(itemForm.installments) > 1) {
      const n = Math.floor(Number(itemForm.installments));
      const baseShare = Math.floor((totalAmount / n) * 100) / 100;
      const lastShare = Math.round((totalAmount - baseShare * (n - 1)) * 100) / 100;
      const loanGroupId = uid();
      const installmentItems = Array.from({ length: n }, (_, i) => ({
        employeeId: itemForm.employeeId,
        type: "سلفة",
        amount: i === n - 1 ? lastShare : baseShare,
        month: addMonthsToStr(itemForm.month, i),
        note: `${itemForm.note ? itemForm.note + " — " : ""}قسط ${i + 1} من ${n}`,
        loanGroupId,
        id: uid(),
      }));
      setPayrollItems((prev) => [...prev, ...installmentItems]);
      logActivity && logActivity(`تسجيل سلفة على ${n} دفعات`, "payroll", `${empName(itemForm.employeeId)} — إجمالي ${fmt(totalAmount)} ﷼`);
    } else {
      setPayrollItems((prev) => [...prev, { ...itemForm, amount: totalAmount, id: uid() }]);
      logActivity && logActivity(`تسجيل ${itemForm.type}`, "payroll", `${empName(itemForm.employeeId)} — ${fmt(totalAmount)} ﷼`);
    }
    setItemForm({ employeeId: "", type: itemForm.type, amount: "", month: itemForm.month, note: "", repayment: "دفعة واحدة", installments: 2 });
  };
  const removeItem = (id) => setPayrollItems((prev) => prev.filter((p) => p.id !== id));
  const empName = (id) => employees.find((e) => e.id === id)?.name || "—";

  const q = searchQuery.trim().toLowerCase();
  const rows = employees
    .filter((e) => e.status === "نشط")
    .filter((e) => !branchFilter || e.branchId === branchFilter)
    .filter((e) => !q || (e.name || "").toLowerCase().includes(q) || (e.nationalId || "").toLowerCase().includes(q))
    .map((e) => {
      const salary = Number(e.salary || 0);
      const isSaudi = e.nationality === "سعودي";
      const empShare = isSaudi ? (salary * gosiRates.saudiEmployee) / 100 : 0;
      const employerShare = isSaudi ? (salary * gosiRates.saudiEmployer) / 100 : (salary * gosiRates.nonSaudiEmployer) / 100;

      /* احتساب الغياب والتأخير والإجازة بدون راتب لهذا الموظف خلال الشهر المختار */
      const dailyRate = salary / 30;
      const perMinuteRate = dailyRate / (8 * 60); /* على أساس 8 ساعات عمل فعلية يوميًا */

      const monthAttendance = attendance.filter((a) => a.employeeId === e.id && (a.date || "").startsWith(month));
      const absentDays = monthAttendance.filter((a) => a.status === "غائب").length;
      const lateMinutesTotal = monthAttendance
        .filter((a) => a.status === "متأخر")
        .reduce((s, a) => s + Number(a.lateMinutes || 0), 0);

      const unpaidLeaveDays = leaves
        .filter((l) => l.employeeId === e.id && l.type === "بدون راتب")
        .reduce((s, l) => s + daysOverlapInMonth(l.from, l.to, month), 0);

      const absentDeduction = absentDays * dailyRate;
      const lateDeduction = lateMinutesTotal * perMinuteRate;
      const unpaidLeaveDeduction = unpaidLeaveDays * dailyRate;
      const attendanceDeduction = absentDeduction + lateDeduction + unpaidLeaveDeduction;

      /* الوقت الإضافي: ساعات الإضافي المسجّلة هذا الشهر × سعر الساعة × 1٫5 (وفق نظام العمل السعودي) */
      const hourlyRate = dailyRate / 8;
      const overtimeHours = monthAttendance.reduce((s, a) => s + Number(a.overtimeHours || 0), 0);
      const overtimePay = overtimeHours * hourlyRate * 1.5;

      /* السلف والخصومات والحوافز المسجّلة لهذا الموظف في الشهر المختار */
      const monthItems = payrollItems.filter((p) => p.employeeId === e.id && p.month === month);
      const advances = monthItems.filter((p) => p.type === "سلفة").reduce((s, p) => s + Number(p.amount || 0), 0);

      const incentives = monthItems.filter((p) => p.type === "حافز").reduce((s, p) => s + Number(p.amount || 0), 0);

      const net = salary - empShare - attendanceDeduction - advances - extraDeductions + incentives + overtimePay;
      return {
        ...e,
        salary,
        empShare,
        employerShare,
        dailyRate,
        absentDays,
        absentDeduction,
        lateMinutesTotal,
        lateDeduction,
        unpaidLeaveDays,
        unpaidLeaveDeduction,
        attendanceDeduction,
        overtimeHours,
        overtimePay,
        advances,
        extraDeductions,
        incentives,
        net,
        totalCost: salary + employerShare + overtimePay,
      };
    });

/* ============ نهاية الخدمة ============ */
function EOSTab({ employees }) {
  const { t } = useLang();
  const [empId, setEmpId] = useState("");
  const [endDate, setEndDate] = useState(new Date().toISOString().slice(0, 10));
  const [reason, setReason] = useState("استقالة");

  const emp = employees.find((e) => e.id === empId);
  const years = emp ? yearsBetween(emp.joinDate, endDate) : 0;
  const salary = Number(emp?.salary || 0);

  const calc = () => {
    if (!emp || years <= 0) return { full: 0, adjusted: 0, ratio: 0 };
    const first5 = Math.min(years, 5) * 0.5 * salary;
    const after5 = Math.max(years - 5, 0) * 1 * salary;
    const full = first5 + after5;

    let ratio = 1;
    let note = "";
    if (reason === "استقالة") {
      if (years < 2) { ratio = 0; note = t("لا يستحق مكافأة (أقل من سنتين خدمة)", "Not entitled to a bonus (less than 2 years of service)"); }
      else if (years < 5) { ratio = 1 / 3; note = t("يستحق ثلث المكافأة (خدمة من 2 إلى 5 سنوات)", "Entitled to one-third of the bonus (2 to 5 years of service)"); }
      else if (years < 10) { ratio = 2 / 3; note = t("يستحق ثلثي المكافأة (خدمة من 5 إلى 10 سنوات)", "Entitled to two-thirds of the bonus (5 to 10 years of service)"); }
      else { ratio = 1; note = t("يستحق المكافأة كاملة (خدمة 10 سنوات فأكثر)", "Entitled to the full bonus (10+ years of service)"); }
    } else {
      note = reason === "فصل من صاحب العمل" ? t("يستحق المكافأة كاملة (إنهاء من صاحب العمل)", "Entitled to the full bonus (terminated by employer)") : t("يستحق المكافأة كاملة", "Entitled to the full bonus");
    }
    return { full, adjusted: full * ratio, note };
  };

  const result = calc();

  return (
    <div>
      <Header title={t("حاسبة مكافأة نهاية الخدمة", "End of Service Benefit Calculator")} subtitle={t("وفق نظام العمل السعودي (المادتان 84–87) — نصف شهر عن كل سنة من أول 5 سنوات، وشهر كامل عمّا زاد", "Per Saudi Labor Law (Articles 84–87) — half a month per year for the first 5 years, and a full month for each year after")} />

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label={t("الموظف", "Employee")}>
            <EmployeeSelect employees={employees} value={empId} onChange={(id) => setEmpId(id)} />
          </Field>
          <Field label={t("تاريخ انتهاء الخدمة", "Service End Date")}>
            <DateField style={inputStyle} value={endDate} onChange={(v) => setEndDate(v)} />
          </Field>
          <Field label={t("سبب انتهاء الخدمة", "Reason for Termination")}>
            <select style={inputStyle} value={reason} onChange={(e) => setReason(e.target.value)}>
              <option value="استقالة">{t("استقالة", "Resignation")}</option>
              <option value="فصل من صاحب العمل">{t("فصل من صاحب العمل", "Termination by Employer")}</option>
              <option value="انتهاء عقد محدد المدة">{t("انتهاء عقد محدد المدة", "Fixed-term Contract End")}</option>
            </select>
          </Field>
        </div>
        {emp && (
          <div style={{ marginTop: 10, fontSize: 12, color: "#8a7a63" }}>
            {t("تاريخ التعيين", "Hire date")}: {emp.joinDate || "—"} · {t("الراتب الأساسي", "Basic salary")}: {fmt(salary)} ﷼ · {t("مدة الخدمة التقريبية", "Approx. length of service")}: {years.toFixed(2)} {t("سنة", "years")}
          </div>
        )}
      </div>

      {emp && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4, marginBottom: 4 }} className="no-print">
          <div />
          <Btn onClick={() => window.print()}>{t("🖶 طباعة مستند التسوية", "🖶 Print Settlement Document")}</Btn>
        </div>
      )}

      <div className="print-section">
        <div style={{ display: "none" }} className="print-only-title">
          <div className="print-brand">{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          {t("مستند تسوية نهاية الخدمة", "End of Service Settlement Document")}
        </div>
        <div style={{ display: "none" }} className="print-only-meta">
          <span>{t(`تاريخ الطباعة: ${new Date().toLocaleDateString("ar-SA-u-nu-latn")}`, `Print Date: ${new Date().toLocaleDateString("en-US")}`)}</span>
          <span>{emp ? (emp.name || "") : ""}</span>
        </div>
        {emp && (
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <ReceiptCard label={t("المكافأة الكاملة (نظريًا)", "Full Bonus (Theoretical)")} value={`${fmt(result.full)} ﷼`} />
            <ReceiptCard label={t("المكافأة المستحقة فعليًا", "Actual Bonus Due")} value={`${fmt(result.adjusted)} ﷼`} tone={COLORS.green} sub={result.note} />
          </div>
        )}
        {emp && (
          <div style={{ marginTop: 16, background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, fontSize: 12.5 }}>
            <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.espresso }}>{t("بيانات الموظف", "Employee Details")}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 20px" }}>
              <div><b>{t("الاسم", "Name")}:</b> {emp.name}</div>
              <div><b>{t("رقم الهوية/الإقامة", "National ID/Iqama No.")}:</b> {emp.nationalId || "—"}</div>
              <div><b>{t("تاريخ التعيين", "Hire Date")}:</b> {emp.joinDate || "—"}</div>
              <div><b>{t("تاريخ انتهاء الخدمة", "Service End Date")}:</b> {endDate}</div>
              <div><b>{t("مدة الخدمة", "Length of Service")}:</b> {years.toFixed(2)} {t("سنة", "years")}</div>
              <div><b>{t("سبب انتهاء الخدمة", "Reason")}:</b> {trLabel(t, EOS_REASON_LABELS_EN, reason)}</div>
              <div><b>{t("الراتب الأساسي", "Basic Salary")}:</b> {fmt(salary)} ﷼</div>
              <div><b>{t("المكافأة المستحقة", "Bonus Due")}:</b> {fmt(result.adjusted)} ﷼</div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 40 }}>
              <div style={{ textAlign: "center", width: "45%" }}>
                <div style={{ borderTop: `1px solid ${COLORS.ink}`, paddingTop: 6 }}>{t("توقيع الموظف", "Employee Signature")}</div>
              </div>
              <div style={{ textAlign: "center", width: "45%" }}>
                <div style={{ borderTop: `1px solid ${COLORS.ink}`, paddingTop: 6 }}>{t("توقيع الإدارة", "Management Signature")}</div>
              </div>
            </div>
          </div>
        )}
        {!emp && <Empty text={t("اختر موظفًا لعرض احتساب المكافأة", "Select an employee to see the bonus calculation")} />}
      </div>

      <div style={{ marginTop: 22, fontSize: 11.5, color: "#a3927a", background: "#fff", border: `1px dashed ${COLORS.line}`, borderRadius: 10, padding: 14 }} className="no-print">
        {t(
          "ملاحظة: هذا احتساب تقريبي يعتمد على الراتب الأساسي المسجَّل فقط. الاحتساب الرسمي وفق نظام العمل يشمل أحيانًا بنودًا إضافية من الأجر الشامل، وقد تختلف التفاصيل حسب نوع العقد ولائحة المنشأة — يُنصح بمراجعة مختص أو مكتب عمل قبل الاعتماد النهائي.",
          "Note: this is an approximate calculation based only on the recorded basic salary. The official calculation under labor law sometimes includes additional items from total wages, and details may vary by contract type and company policy — consult a specialist or labor office before final approval."
        )}
      </div>
    </div>
  );
}

/* ============ نافذة تغيير كلمة المرور (لكل مستخدم لحسابه الخاص) ============
   forced=true: تُستخدم لإجبار المستخدم على تغيير كلمة المرور الافتراضية (admin@123) أول ما يسجّل دخول —
   بدون زر إغلاق أو إلغاء، لحد ما يغيّرها فعليًا */
function ChangePasswordModal({ currentUser, setUsers, onClose, logActivity, forced = false }) {
  const { t } = useLang();
  const [oldPassword, setOldPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);

  const submit = () => {
    setError("");
    if (!oldPassword.trim() || !newPassword.trim() || !confirmPassword.trim()) {
      setError(t("الرجاء تعبئة جميع الحقول", "Please fill in all fields"));
      return;
    }
    if (oldPassword !== currentUser.password) {
      setError(t("كلمة المرور الحالية غير صحيحة", "Current password is incorrect"));
      return;
    }
    if (!/^[A-Za-z]{2}\d+$/.test(newPassword)) {
      setError(t("كلمة المرور يجب أن تبدأ بحرفين إنجليزيين ثم أرقام فقط (مثال: ab1234)", "Password must start with 2 English letters followed by numbers only (e.g. ab1234)"));
      return;
    }
    if (newPassword !== confirmPassword) {
      setError(t("كلمة المرور الجديدة وتأكيدها غير متطابقين", "New password and confirmation do not match"));
      return;
    }
    if (newPassword === oldPassword) {
      setError(t("كلمة المرور الجديدة يجب أن تختلف عن الحالية", "New password must be different from the current one"));
      return;
    }
    setUsers((prev) => prev.map((u) => (u.username === currentUser.username ? { ...u, password: newPassword, mustChangePassword: false } : u)));
    logActivity && logActivity("تغيير كلمة المرور", "users", currentUser.username);
    setSuccess(true);
    setOldPassword("");
    setNewPassword("");
    setConfirmPassword("");
  };

  return (
    <div
      className="no-print"
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(36,24,17,0.55)",
        zIndex: 70,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 20,
      }}
    >
      <div
        style={{
          background: "#fff",
          borderRadius: 12,
          maxWidth: 380,
          width: "100%",
          boxShadow: "0 20px 60px rgba(0,0,0,0.35)",
          padding: 22,
        }}

/* ============ شاشة إدخال كود التأكيد المُرسَل بالإيميل (تحقق ثنائي عند الدخول) ============ */
function VerifyCodeScreen({ user, code, setCode, onSubmit, onResend, onCancel, error, sending, resendCooldown }) {
  const { t } = useLang();
  const maskedEmail = (() => {
    const parts = (user.email || "").split("@");
    if (parts.length !== 2) return user.email || "";
    const name = parts[0];
    const visible = name.slice(0, Math.min(2, name.length));
    return `${visible}${"•".repeat(Math.max(name.length - 2, 2))}@${parts[1]}`;
  })();

  return (
    <div
      dir="rtl"
      style={{
        fontFamily: "'Segoe UI', Tahoma, Arial, sans-serif",
        background: `linear-gradient(180deg, ${COLORS.paper} 0%, #EFE6D2 60%, #E7DAC0 100%)`,
        minHeight: "100vh",
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 16,
        position: "relative",
        overflow: "hidden",
      }}
    >
      <NYSkyline />
      <form
        onSubmit={(e) => {
          e.preventDefault();
          onSubmit();
        }}
        style={{
          background: "#fff",
          border: `1px solid ${COLORS.line}`,
          borderRadius: 14,
          padding: "34px 30px",
          width: 340,
          maxWidth: "100%",
          boxShadow: "0 10px 34px rgba(59,42,29,0.16)",
          position: "relative",
          zIndex: 1,
        }}
      >
        <div style={{ textAlign: "center", marginBottom: 20 }}>
          <div style={{ fontSize: 30, marginBottom: 6 }}>✉️</div>
          <div style={{ fontSize: 17, fontWeight: 800, color: COLORS.espresso }}>{t("تأكيد الدخول", "Verify Sign-in")}</div>
          <div style={{ fontSize: 12, color: COLORS.coffee, marginTop: 6, lineHeight: 1.6 }}>
            {sending
              ? t("جارِ إرسال كود التأكيد...", "Sending verification code...")
              : t(`أرسلنا كود مكوّن من 6 أرقام إلى ${maskedEmail}`, `We sent a 6-digit code to ${maskedEmail}`)}
          </div>
        </div>
        <Field label={t("كود التأكيد", "Verification Code")}>
          <input
            style={{ ...inputStyle, textAlign: "center", fontSize: 20, letterSpacing: 6, fontFamily: "Consolas, monospace" }}
            value={code}
            maxLength={6}
            inputMode="numeric"
            onChange={(e) => setCode(e.target.value.replace(/\D/g, ""))}
            autoFocus
          />
        </Field>
        {error && <div style={{ color: COLORS.brick, fontSize: 12, marginTop: 10, textAlign: "center" }}>{error}</div>}
        <div style={{ marginTop: 18 }}>
          <button
            type="submit"
            disabled={sending}
            style={{
              width: "100%",
              background: COLORS.espresso,
              color: "#fff",
              border: "none",
              borderRadius: 8,
              padding: "10px 16px",
              fontSize: 13.5,
              fontWeight: 700,
              cursor: sending ? "default" : "pointer",
              opacity: sending ? 0.6 : 1,
            }}
          >
            {t("تأكيد الدخول", "Confirm")}
          </button>
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 14 }}>
          <button
            type="button"
            onClick={onCancel}
            style={{ background: "transparent", border: "none", color: "#8a7a63", fontSize: 12, cursor: "pointer", padding: 4 }}
          >
            {t("رجوع", "Back")}
          </button>
          <button
            type="button"
            onClick={onResend}
            disabled={resendCooldown > 0 || sending}
            style={{
              background: "transparent",
              border: "none",
              color: resendCooldown > 0 ? "#c9bda3" : COLORS.brick,
              fontSize: 12,
              fontWeight: 700,
              cursor: resendCooldown > 0 ? "default" : "pointer",
              padding: 4,
            }}
          >
            {resendCooldown > 0 ? t(`إعادة الإرسال (${resendCooldown})`, `Resend (${resendCooldown})`) : t("إعادة إرسال الكود", "Resend Code")}
          </button>
        </div>
      </form>
    </div>
  );
}

function fmt(n) {
  if (n === "" || n === null || n === undefined || isNaN(n)) return "٠";
  return Number(n).toLocaleString("ar-SA", { maximumFractionDigits: 2 });
}

function yearsBetween(start, end) {
  const s = new Date(start);
  const e = new Date(end);
  if (isNaN(s) || isNaN(e) || e < s) return 0;
  return (e - s) / (1000 * 60 * 60 * 24 * 365.25);
}

/* عدد أيام إجازة (from→to) الواقعة داخل شهر معيّن بصيغة "YYYY-MM" */
function daysOverlapInMonth(from, to, monthStr) {
  if (!from || !to || !monthStr) return 0;
  const [y, m] = monthStr.split("-").map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0); // آخر يوم في الشهر
  const s = new Date(from);
  const e = new Date(to);
  if (isNaN(s) || isNaN(e)) return 0;
  const start = s > monthStart ? s : monthStart;
  const end = e < monthEnd ? e : monthEnd;
  if (end < start) return 0;
  return Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
}

/* ============ التطبيق الرئيسي ============ */
function HRApp({ currentUser, users, setUsers, onLogout }) {
  const role = currentUser.role;
  const isAdmin = role === "admin";
  const isBranchManager = role === "branch_manager";
  const navItems = navForRole(role);
  const [tab, setTab] = useState(navItems[0]?.key || "dash");
  const [entities, setEntities] = useState(ENTITIES_SEED);
  const [branches, setBranches] = useState(BRANCHES_SEED);
  const [employees, setEmployees] = useState([]);
  const [leaves, setLeaves] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [gosiRates, setGosiRates] = useState({
    saudiEmployee: 9.75,
    saudiEmployer: 11.75,
    nonSaudiEmployer: 2,
  });
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");
  const [syncError, setSyncError] = useState("");
  const lastSyncedRef = useRef("");

  /* الاستماع لحظيًا لبيانات النظام من Firestore — أي تعديل من أي جهاز يوصل هنا فورًا */
  useEffect(() => {
    const unsub = DATA_DOC.onSnapshot(
      (snap) => {
        /* نتجاهل النسخة المحلية غير المؤكدة من الخادم بعد (كتابتنا إحنا) لتفادي قطع الكتابة أثناء الكتابة */
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        if (d) {
          const next = {
            entities: d.entities || ENTITIES_SEED,
            branches: d.branches || BRANCHES_SEED,
            employees: d.employees || [],
            leaves: d.leaves || [],
            attendance: d.attendance || [],
            gosiRates: d.gosiRates || { saudiEmployee: 9.75, saudiEmployer: 11.75, nonSaudiEmployer: 2 },
            vehicles: d.vehicles || [],
          };
          setEntities(next.entities);
          setBranches(next.branches);
          setEmployees(next.employees);
          setLeaves(next.leaves);
          setAttendance(next.attendance);
          setVehicles(next.vehicles);
          setGosiRates(next.gosiRates);
          lastSyncedRef.current = JSON.stringify(next);
        } else {
          /* أول مرة يتشغّل فيها النظام: أنشئ المستند بالبيانات الافتراضية */
          DATA_DOC.set({ entities: ENTITIES_SEED, branches: BRANCHES_SEED, employees: [], leaves: [], attendance: [], vehicles: [], gosiRates }).catch(() => {});
        }
        setSyncError("");
        setLoaded(true);
      },
      (err) => {
        setSyncError("تعذر الاتصال بقاعدة البيانات المشتركة — تحقّق من اتصال الإنترنت");
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  /* حفظ ومزامنة تلقائية إلى Firestore — تنعكس فورًا على كل الأجهزة المتصلة */
  useEffect(() => {
    if (!loaded) return;
    const payload = { entities, branches, employees, leaves, attendance, gosiRates, vehicles };
    const json = JSON.stringify(payload);
    if (json === lastSyncedRef.current) return;
    const t = setTimeout(() => {
      DATA_DOC.set(payload)
        .then(() => {
          lastSyncedRef.current = json;
          setSaveMsg("تمت المزامنة ✓");
          setTimeout(() => setSaveMsg(""), 1500);
        })
        .catch(() => setSaveMsg("تعذر الحفظ — تحقّق من الإنترنت"));
    }, 400);
    return () => clearTimeout(t);
  }, [entities, branches, employees, leaves, attendance, gosiRates, vehicles, loaded]);

  const branchName = (id) => branches.find((b) => b.id === id)?.name || "—";
  const entityName = (id) => entities.find((e) => e.id === id)?.name || "—";
  const entityOfBranch = (branchId) => branches.find((b) => b.id === branchId)?.entityId;

  /* نطاق البيانات حسب الصلاحية: مسؤول الفرع يشوف فرعه فقط */
  const scopedBranches = isBranchManager ? branches.filter((b) => b.id === currentUser.branchId) : branches;
  const scopedEmployees = isBranchManager ? employees.filter((e) => e.branchId === currentUser.branchId) : employees;
  const scopedLeaves = isBranchManager
    ? leaves.filter((l) => scopedEmployees.some((e) => e.id === l.employeeId))
    : leaves;
  const scopedAttendance = isBranchManager
    ? attendance.filter((a) => scopedEmployees.some((e) => e.id === a.employeeId))
    : attendance;
  const scopedVehicles = isBranchManager ? vehicles.filter((v) => v.branchId === currentUser.branchId) : vehicles;

  /* حساب موظف عادي: يشوف بياناته الشخصية فقط، بدون قائمة تنقّل */
  if (role === "employee") {
    const myEmployee = employees.find((e) => e.id === currentUser.employeeId);
    return (
      <EmployeeSelfView
        user={currentUser}
        employee={myEmployee}
        leaves={leaves}
        attendance={attendance}
        branchName={branchName}
        onLogout={onLogout}
      />
    );
  }

  return (
    <div
      dir="rtl"
      style={{
        fontFamily: "'Segoe UI', Tahoma, Arial, sans-serif",
        background: COLORS.paper,
        minHeight: "100vh",
        color: COLORS.ink,
        display: "flex",
      }}
    >
      {/* الشريط الجانبي */}
      <aside
        style={{
          width: 230,
          background: COLORS.espresso,
          color: "#F5EBDC",
          padding: "22px 14px",
          flexShrink: 0,
          minHeight: "100vh",
        }}
      >
        <div style={{ marginBottom: 26 }}>
          <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: 0.3 }}>نظام الموارد البشرية</div>
          <div style={{ fontSize: 11, color: COLORS.goldLight, marginTop: 3 }}>مجموعة ينبع للمقاهي · السعودية</div>
        </div>
        <nav style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {navItems.map((n) => (
            <button
              key={n.key}
              onClick={() => setTab(n.key)}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                textAlign: "right",
                background: tab === n.key ? "rgba(216,168,90,0.18)" : "transparent",
                border: "none",
                borderRight: tab === n.key ? `3px solid ${COLORS.gold}` : "3px solid transparent",
                color: tab === n.key ? "#fff" : "#D9CBB2",
                padding: "10px 10px",
                borderRadius: 6,
                fontSize: 13.5,
                fontWeight: tab === n.key ? 700 : 500,
                cursor: "pointer",
              }}
            >
              <span style={{ fontSize: 15, color: COLORS.goldLight }}>{n.icon}</span>
              {n.label}
            </button>
          ))}
        </nav>
        <div style={{ marginTop: 30, fontSize: 10.5, color: syncError ? "#E8A9A0" : "#B8A78A", minHeight: 14 }}>{syncError || saveMsg}</div>
        <div
          style={{
            marginTop: 18,
            paddingTop: 14,
            borderTop: "1px solid rgba(216,168,90,0.25)",
          }}
        >
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "#fff" }}>{currentUser.name}</div>
          <div style={{ fontSize: 10.5, color: COLORS.goldLight, marginTop: 2, marginBottom: 10 }}>
            {ROLE_LABELS[role]}
            {isBranchManager && ` · ${branchName(currentUser.branchId)}`}
          </div>
          <button
            onClick={onLogout}
            style={{
              width: "100%",
              background: "transparent",
              border: "1px solid rgba(216,168,90,0.4)",
              color: "#D9CBB2",
              borderRadius: 6,
              padding: "7px 10px",
              fontSize: 12,
              cursor: "pointer",
            }}
          >
            تسجيل الخروج
          </button>
        </div>
      </aside>

      {/* المحتوى */}
      <main style={{ flex: 1, padding: "26px 30px", maxWidth: 1180 }}>
        {tab === "dash" && (
          <Dashboard
            entities={entities}
            branches={scopedBranches}
            employees={scopedEmployees}
            leaves={scopedLeaves}
            branchName={branchName}
            entityName={entityName}
          />
        )}
        {tab === "employees" && (
          <EmployeesTab
            employees={scopedEmployees}
            setEmployees={setEmployees}
            branches={scopedBranches}
            entities={entities}
            entityOfBranch={entityOfBranch}
          />
        )}
        {tab === "iqamas" && (
          <IqamasContractsTab employees={scopedEmployees} setEmployees={setEmployees} branches={scopedBranches} />
        )}
        {tab === "licenses" && (
          <BranchLicensesTab
            branches={scopedBranches}
            setBranches={setBranches}
            employees={scopedEmployees}
            setEmployees={setEmployees}
            vehicles={scopedVehicles}
            setVehicles={setVehicles}
          />
        )}
        {isAdmin && tab === "branches" && (
          <BranchesTab entities={entities} setEntities={setEntities} branches={branches} setBranches={setBranches} employees={employees} />
        )}
        {tab === "attendance" && (
          <AttendanceTab
            employees={scopedEmployees}
            leaves={scopedLeaves}
            setLeaves={setLeaves}
            attendance={scopedAttendance}
            setAttendance={setAttendance}
            branchName={(id) => branchName(employees.find((e) => e.id === id)?.branchId)}
          />
        )}
        {tab === "payroll" && (
          <PayrollTab
            employees={scopedEmployees}
            branches={scopedBranches}
            entities={entities}
            gosiRates={gosiRates}
            attendance={scopedAttendance}
            leaves={scopedLeaves}
          />
        )}
        {tab === "eos" && <EOSTab employees={scopedEmployees} />}
        {isAdmin && tab === "settings" && <SettingsTab gosiRates={gosiRates} setGosiRates={setGosiRates} />}
        {isAdmin && tab === "users" && (
          <UsersTab users={users} setUsers={setUsers} employees={employees} branches={branches} />
        )}
      </main>
    </div>
  );
}

/* ============ لوحة التحكم ============ */
function Dashboard({ entities, branches, employees, leaves, branchName, entityName }) {
  const activeCount = employees.filter((e) => e.status === "نشط").length;
  const totalSalaries = employees.filter((e) => e.status === "نشط").reduce((s, e) => s + Number(e.salary || 0), 0);
  const today = new Date().toISOString().slice(0, 10);
  const onLeaveToday = leaves.filter((l) => l.from <= today && l.to >= today).length;

  const byBranch = branches.map((b) => ({
    ...b,
    count: employees.filter((e) => e.branchId === b.id && e.status === "نشط").length,
  }));

  return (
    <div>
      <Header title="لوحة التحكم" subtitle="نظرة عامة على الكيانات والفروع والموظفين" />
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 24 }}>
        <ReceiptCard label="إجمالي الموظفين النشطين" value={fmt(activeCount)} sub={`من أصل ${fmt(employees.length)} مسجّل`} />
        <ReceiptCard label="إجمالي الرواتب الشهرية" value={`${fmt(totalSalaries)} ﷼`} tone={COLORS.coffee} />
        <ReceiptCard label="عدد الفروع" value={fmt(branches.length)} sub={`عبر ${fmt(entities.length)} كيانات`} />
        <ReceiptCard label="في إجازة اليوم" value={fmt(onLeaveToday)} tone={onLeaveToday > 0 ? COLORS.brick : COLORS.green} />
      </div>

      <SectionTitle>توزيع الموظفين حسب الفرع</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
        {byBranch.length === 0 && <Empty text="لا توجد فروع بعد — أضف فرعًا من تبويب الكيانات والفروع" />}
        {byBranch.map((b, i) => (
          <div
            key={b.id}
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              padding: "12px 16px",
              borderBottom: i < byBranch.length - 1 ? `1px dashed ${COLORS.line}` : "none",
            }}
          >
            <div>
              <div style={{ fontWeight: 700, fontSize: 13.5 }}>{b.name}</div>
              <div style={{ fontSize: 11.5, color: "#8a7a63" }}>{entityName(b.entityId)} · {b.city}</div>
            </div>
            <Stamp>{fmt(b.count)} موظف</Stamp>
          </div>
        ))}
      </div>
    </div>
  );
}

function Header({ title, subtitle, action }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 20 }}>
      <div>
        <h1 style={{ margin: 0, fontSize: 22, fontWeight: 800, color: COLORS.espresso }}>{title}</h1>
        {subtitle && <div style={{ fontSize: 12.5, color: "#8a7a63", marginTop: 4 }}>{subtitle}</div>}
      </div>
      {action}
    </div>
  );
}
function SectionTitle({ children }) {
  return <div style={{ fontSize: 13.5, fontWeight: 700, color: COLORS.coffee, margin: "18px 0 8px" }}>{children}</div>;
}
function Empty({ text }) {
  return <div style={{ padding: 26, textAlign: "center", color: "#a3927a", fontSize: 13 }}>{text}</div>;
}

/* تحويل تاريخ ميلادي إلى هجري للعرض جنب حقل التاريخ (بدون اتصال إنترنت، عبر Intl المدمجة في المتصفح) */
function toHijri(dateStr) {
  if (!dateStr) return "";
  try {
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d)) return "";
    const parts = new Intl.DateTimeFormat("en-u-ca-islamic", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(d);
    const get = (t) => parts.find((p) => p.type === t)?.value || "";
    return `${get("year")}/${get("month")}/${get("day")} هـ`;
  } catch (e) {
    return "";
  }
}

function HijriNote({ dateStr }) {
  const h = toHijri(dateStr);
  if (!h) return null;
  return <div style={{ fontSize: 10, color: "#a3927a", marginTop: 2 }}>{h}</div>;
}

/* حالة تاريخ (إقامة/عقد) حسب الأيام المتبقية */
function expiryStatus(dateStr) {
  if (!dateStr) return { label: "غير محدد", tone: "gold", days: null };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(dateStr);
  const days = Math.round((d - today) / (1000 * 60 * 60 * 24));
  if (days < 0) return { label: `منتهية منذ ${Math.abs(days)} يوم`, tone: "brick", days };
  if (days <= 30) return { label: `تنتهي خلال ${days} يوم`, tone: "brick", days };
  if (days <= 90) return { label: `تنتهي خلال ${days} يوم`, tone: "gold", days };
  return { label: `سارية (${days} يوم متبقي)`, tone: "green", days };
}

/* ============ الكيانات والفروع ============ */
function BranchesTab({ entities, setEntities, branches, setBranches, employees }) {
  const [entityName, setEntityName] = useState("");
  const [branchForm, setBranchForm] = useState({ entityId: "", name: "", city: "" });

  const addEntity = () => {
    if (!entityName.trim()) return;
    setEntities((prev) => [...prev, { id: uid(), name: entityName.trim() }]);
    setEntityName("");
  };
  const removeEntity = (id) => {
    setEntities((prev) => prev.filter((e) => e.id !== id));
    setBranches((prev) => prev.filter((b) => b.entityId !== id));
  };
  const addBranch = () => {
    if (!branchForm.name.trim() || !branchForm.entityId) return;
    setBranches((prev) => [...prev, { id: uid(), ...branchForm }]);
    setBranchForm({ entityId: "", name: "", city: "" });
  };
  const removeBranch = (id) => setBranches((prev) => prev.filter((b) => b.id !== id));

  return (
    <div>
      <Header title="الكيانات والفروع" subtitle="الهيكل التنظيمي للمجموعة" />

      <SectionTitle>الكيانات (المؤسسات / الشركات)</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 16, marginBottom: 20 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <input
            style={{ ...inputStyle, flex: 1 }}
            placeholder="اسم الكيان الجديد"
            value={entityName}
            onChange={(e) => setEntityName(e.target.value)}
          />
          <Btn onClick={addEntity}>إضافة كيان</Btn>
        </div>
        {entities.map((en) => (
          <div
            key={en.id}
            style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 4px", borderTop: `1px dashed ${COLORS.line}` }}
          >
            <div style={{ fontSize: 13, fontWeight: 600 }}>{en.name}</div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <Stamp>{branches.filter((b) => b.entityId === en.id).length} فرع</Stamp>
              <Btn small tone="danger" onClick={() => removeEntity(en.id)}>حذف</Btn>
            </div>
          </div>
        ))}
      </div>

      <SectionTitle>الفروع</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 16 }}>

              <option value="">اختر الكيان</option>
              {entities.map((en) => (
                <option key={en.id} value={en.id}>
                  {en.name}
                </option>
              ))}
            </select>
          </Field>
          <Field label="اسم الفرع">
            <input style={inputStyle} value={branchForm.name} onChange={(e) => setBranchForm({ ...branchForm, name: e.target.value })} />
          </Field>
          <Field label="المدينة">
            <input style={inputStyle} value={branchForm.city} onChange={(e) => setBranchForm({ ...branchForm, city: e.target.value })} />
          </Field>
          <div style={{ display: "flex", alignItems: "flex-end" }}>
            <Btn onClick={addBranch}>إضافة فرع</Btn>
          </div>
        </div>

        {branches.map((b) => (
          <div
            key={b.id}
            style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "9px 4px", borderTop: `1px dashed ${COLORS.line}` }}

/* ============ الحضور والإجازات ============ */
function AttendanceTab({ employees, leaves, setLeaves, attendance, setAttendance }) {
  const [leaveForm, setLeaveForm] = useState({ employeeId: "", type: "سنوية", from: "", to: "" });
  const [attForm, setAttForm] = useState({ employeeId: "", date: "", status: "حاضر", lateMinutes: "" });

  const addLeave = () => {
    if (!leaveForm.employeeId || !leaveForm.from || !leaveForm.to) return;
    setLeaves((prev) => [...prev, { ...leaveForm, id: uid() }]);
    setLeaveForm({ employeeId: "", type: "سنوية", from: "", to: "" });
  };
  const removeLeave = (id) => setLeaves((prev) => prev.filter((l) => l.id !== id));

  const addAtt = () => {
    if (!attForm.employeeId || !attForm.date) return;
    const record = { ...attForm, lateMinutes: attForm.status === "متأخر" ? Number(attForm.lateMinutes || 0) : 0 };
    setAttendance((prev) => [...prev, { ...record, id: uid() }]);
    setAttForm({ employeeId: "", date: "", status: "حاضر", lateMinutes: "" });
  };
  const removeAtt = (id) => setAttendance((prev) => prev.filter((a) => a.id !== id));

  const empName = (id) => employees.find((e) => e.id === id)?.name || "—";

  return (
    <div>

          <Field label="الموظف">
            <select style={inputStyle} value={leaveForm.employeeId} onChange={(e) => setLeaveForm({ ...leaveForm, employeeId: e.target.value })}>
              <option value="">اختر الموظف</option>
              {employees.map((e) => (
                <option key={e.id} value={e.id}>{e.name}</option>

            <select style={inputStyle} value={leaveForm.type} onChange={(e) => setLeaveForm({ ...leaveForm, type: e.target.value })}>
              <option>سنوية</option>
              <option>مرضية</option>
              <option>طارئة</option>
              <option>بدون راتب</option>
              <option>أخرى</option>
            </select>
          </Field>
          <Field label="من تاريخ">
            <input type="date" style={inputStyle} value={leaveForm.from} onChange={(e) => setLeaveForm({ ...leaveForm, from: e.target.value })} />
          </Field>
          <Field label="إلى تاريخ">
            <input type="date" style={inputStyle} value={leaveForm.to} onChange={(e) => setLeaveForm({ ...leaveForm, to: e.target.value })} />

          <div key={l.id} style={{ display: "flex", justifyContent: "space-between", padding: "9px 14px", borderTop: i ? `1px dashed ${COLORS.line}` : "none", fontSize: 12.5 }}>

              ))}

          </Field>
          <Field label="التاريخ">
            <input type="date" style={inputStyle} value={attForm.date} onChange={(e) => setAttForm({ ...attForm, date: e.target.value })} />

          <Field label="الحالة">

            <Btn onClick={addAtt}>تسجيل</Btn>

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
        {attendance.length === 0 && <Empty text="لا توجد سجلات حضور" />}

          <div key={a.id} style={{ display: "flex", justifyContent: "space-between", padding: "9px 14px", borderTop: i ? `1px dashed ${COLORS.line}` : "none", fontSize: 12.5 }}>

            <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
              <Stamp tone={a.status === "حاضر" ? "green" : a.status === "متأخر" ? "gold" : "brick"}>
                {a.status}{a.status === "متأخر" && a.lateMinutes ? ` (${a.lateMinutes} د)` : ""}
              </Stamp>
              <Btn small tone="danger" onClick={() => removeAtt(a.id)}>حذف</Btn>
            </div>
          </div>
        ))}
      </div>
    </div>
  );

/* ============ الرواتب و GOSI ============ */
function PayrollTab({ employees, branches, entities, gosiRates, attendance, leaves }) {
  const [branchFilter, setBranchFilter] = useState("");
  const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));

  const rows = employees
    .filter((e) => e.status === "نشط")
    .filter((e) => !branchFilter || e.branchId === branchFilter)
    .map((e) => {
      const salary = Number(e.salary || 0);
      const isSaudi = e.nationality === "سعودي";
      const empShare = isSaudi ? (salary * gosiRates.saudiEmployee) / 100 : 0;
      const employerShare = isSaudi ? (salary * gosiRates.saudiEmployer) / 100 : (salary * gosiRates.nonSaudiEmployer) / 100;

      /* احتساب الغياب والتأخير والإجازة بدون راتب لهذا الموظف خلال الشهر المختار */
      const dailyRate = salary / 30;
      const perMinuteRate = dailyRate / (8 * 60); /* على أساس ٨ ساعات عمل فعلية يوميًا */

      const monthAttendance = attendance.filter((a) => a.employeeId === e.id && (a.date || "").startsWith(month));
      const absentDays = monthAttendance.filter((a) => a.status === "غائب").length;
      const lateMinutesTotal = monthAttendance
        .filter((a) => a.status === "متأخر")
        .reduce((s, a) => s + Number(a.lateMinutes || 0), 0);

      const unpaidLeaveDays = leaves
        .filter((l) => l.employeeId === e.id && l.type === "بدون راتب")
        .reduce((s, l) => s + daysOverlapInMonth(l.from, l.to, month), 0);

      const absentDeduction = absentDays * dailyRate;
      const lateDeduction = lateMinutesTotal * perMinuteRate;
      const unpaidLeaveDeduction = unpaidLeaveDays * dailyRate;
      const attendanceDeduction = absentDeduction + lateDeduction + unpaidLeaveDeduction;

      const net = salary - empShare - attendanceDeduction;
      return {
        ...e,
        salary,
        empShare,
        employerShare,
        dailyRate,
        absentDays,
        absentDeduction,
        lateMinutesTotal,
        lateDeduction,
        unpaidLeaveDays,
        unpaidLeaveDeduction,
        attendanceDeduction,
        net,
        totalCost: salary + employerShare,
      };
    });

  const totals = rows.reduce(
    (acc, r) => ({
      salary: acc.salary + r.salary,
      empShare: acc.empShare + r.empShare,
      employerShare: acc.employerShare + r.employerShare,
      attendanceDeduction: acc.attendanceDeduction + r.attendanceDeduction,
      net: acc.net + r.net,
      totalCost: acc.totalCost + r.totalCost,
    }),
    { salary: 0, empShare: 0, employerShare: 0, attendanceDeduction: 0, net: 0, totalCost: 0 }
  );

  return (
    <div>
      <Header title="الرواتب واشتراكات التأمينات (GOSI)" subtitle="النسب افتراضية وقابلة للتعديل من تبويب الإعدادات — تحقق من النسبة الرسمية المعتمدة وقت الاحتساب" />

      <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end", marginBottom: 16 }}>
        <Field label="شهر احتساب الغياب والتأخير">
          <input type="month" style={inputStyle} value={month} onChange={(e) => setMonth(e.target.value)} />
        </Field>
      </div>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
        <ReceiptCard label="إجمالي الرواتب الأساسية" value={`${fmt(totals.salary)} ﷼`} />
        <ReceiptCard label="حصة الموظفين GOSI (تخصم)" value={`${fmt(totals.empShare)} ﷼`} tone={COLORS.brick} />
        <ReceiptCard label="خصومات الغياب والتأخير" value={`${fmt(totals.attendanceDeduction)} ﷼`} tone={COLORS.brick} />
        <ReceiptCard label="حصة صاحب العمل" value={`${fmt(totals.employerShare)} ﷼`} tone={COLORS.coffee} />
        <ReceiptCard label="إجمالي التكلفة الشهرية" value={`${fmt(totals.totalCost)} ﷼`} tone={COLORS.espresso} />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>

        </select>
      </div>

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "auto" }}>
        {rows.length === 0 && <Empty text="لا يوجد موظفون نشطون مطابقون" />}
        {rows.length > 0 && (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, minWidth: 1240 }}>
            <thead>

/* ============ نهاية الخدمة ============ */
function EOSTab({ employees }) {
  const [empId, setEmpId] = useState("");
  const [endDate, setEndDate] = useState(new Date().toISOString().slice(0, 10));
  const [reason, setReason] = useState("استقالة");

  const emp = employees.find((e) => e.id === empId);
  const years = emp ? yearsBetween(emp.joinDate, endDate) : 0;
  const salary = Number(emp?.salary || 0);

  const calc = () => {
    if (!emp || years <= 0) return { full: 0, adjusted: 0, ratio: 0 };
    const first5 = Math.min(years, 5) * 0.5 * salary;
    const after5 = Math.max(years - 5, 0) * 1 * salary;
    const full = first5 + after5;

    let ratio = 1;
    let note = "";
    if (reason === "استقالة") {
      if (years < 2) { ratio = 0; note = "لا يستحق مكافأة (أقل من سنتين خدمة)"; }
      else if (years < 5) { ratio = 1 / 3; note = "يستحق ثلث المكافأة (خدمة من ٢ إلى ٥ سنوات)"; }
      else if (years < 10) { ratio = 2 / 3; note = "يستحق ثلثي المكافأة (خدمة من ٥ إلى ١٠ سنوات)"; }
      else { ratio = 1; note = "يستحق المكافأة كاملة (خدمة ١٠ سنوات فأكثر)"; }
    } else {
      note = reason === "فصل من صاحب العمل" ? "يستحق المكافأة كاملة (إنهاء من صاحب العمل)" : "يستحق المكافأة كاملة";
    }
    return { full, adjusted: full * ratio, note };
  };

  const result = calc();

  return (
    <div>
      <Header title="حاسبة مكافأة نهاية الخدمة" subtitle="وفق نظام العمل السعودي (المادتان ٨٤–٨٧) — نصف شهر عن كل سنة من أول ٥ سنوات، وشهر كامل عمّا زاد" />

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label="الموظف">
            <select style={inputStyle} value={empId} onChange={(e) => setEmpId(e.target.value)}>
              <option value="">اختر الموظف</option>
              {employees.map((e) => (
                <option key={e.id} value={e.id}>{e.name}</option>
              ))}
            </select>
          </Field>
          <Field label="تاريخ انتهاء الخدمة">
            <input type="date" style={inputStyle} value={endDate} onChange={(e) => setEndDate(e.target.value)} />
          </Field>
          <Field label="سبب انتهاء الخدمة">
            <select style={inputStyle} value={reason} onChange={(e) => setReason(e.target.value)}>
              <option>استقالة</option>
              <option>فصل من صاحب العمل</option>
              <option>انتهاء عقد محدد المدة</option>
            </select>
          </Field>
        </div>
        {emp && (
          <div style={{ marginTop: 10, fontSize: 12, color: "#8a7a63" }}>
            تاريخ التعيين: {emp.joinDate || "—"} · الراتب الأساسي: {fmt(salary)} ﷼ · مدة الخدمة التقريبية: {years.toFixed(2)} سنة
          </div>
        )}
      </div>

      {emp && (
        <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
          <ReceiptCard label="المكافأة الكاملة (نظريًا)" value={`${fmt(result.full)} ﷼`} />
          <ReceiptCard label="المكافأة المستحقة فعليًا" value={`${fmt(result.adjusted)} ﷼`} tone={COLORS.green} sub={result.note} />
        </div>
      )}
      {!emp && <Empty text="اختر موظفًا لعرض احتساب المكافأة" />}

      <div style={{ marginTop: 22, fontSize: 11.5, color: "#a3927a", background: "#fff", border: `1px dashed ${COLORS.line}`, borderRadius: 10, padding: 14 }}>
        ملاحظة: هذا احتساب تقريبي يعتمد على الراتب الأساسي المسجَّل فقط. الاحتساب الرسمي وفق نظام العمل يشمل أحيانًا بنودًا إضافية من الأجر الشامل، وقد تختلف التفاصيل حسب نوع العقد ولائحة المنشأة — يُنصح بمراجعة مختص أو مكتب عمل قبل الاعتماد النهائي.
      </div>
    </div>
  );
}

/* ============ إدارة المستخدمين (أدمن فقط) ============ */
function UsersTab({ users, setUsers, employees, branches }) {
  const [form, setForm] = useState(EMPTY_USER);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState("");

  const resetForm = () => {
    setForm(EMPTY_USER);
    setEditingId(null);
    setErr("");
  };

  const submit = () => {
    if (!form.username.trim() || !form.password.trim() || !form.name.trim()) {
      setErr("الرجاء تعبئة الاسم واسم المستخدم وكلمة المرور");
      return;
    }
    const dup = users.find((u) => u.username === form.username.trim() && u.id !== editingId);
    if (dup) {
      setErr("اسم المستخدم مستخدم بالفعل، اختر اسمًا آخر");
      return;
    }
    if (editingId) {
      setUsers((prev) => prev.map((u) => (u.id === editingId ? { ...form, id: editingId, username: form.username.trim() } : u)));
    } else {
      setUsers((prev) => [...prev, { ...form, username: form.username.trim(), id: uid() }]);
    }
    resetForm();
  };

  const edit = (u) => {
    setForm(u);
    setEditingId(u.id);
    setErr("");
  };

  const remove = (id) => {
    const target = users.find((u) => u.id === id);
    if (target?.role === "admin" && users.filter((u) => u.role === "admin").length <= 1) {
      setErr("لا يمكن حذف آخر حساب أدمن في النظام");
      return;
    }
    setUsers((prev) => prev.filter((u) => u.id !== id));
    if (editingId === id) resetForm();
  };

  return (
    <div>
      <Header title="المستخدمون والصلاحيات" subtitle="إدارة حسابات الدخول: أدمن، مسؤول فرع، موظف — كل حساب بباسورد خاص به" />

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 22 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: COLORS.espresso }}>
          {editingId ? "تعديل حساب" : "إضافة حساب جديد"}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label="الاسم المعروض">
            <input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          </Field>
          <Field label="اسم المستخدم">
            <input style={inputStyle} value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} />
          </Field>
          <Field label="كلمة المرور">
            <input style={inputStyle} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />
          </Field>
          <Field label="الدور">
            <select
              style={inputStyle}
              value={form.role}
              onChange={(e) => setForm({ ...form, role: e.target.value, branchId: "", employeeId: "" })}
            >
              <option value="admin">أدمن (كل الصلاحيات)</option>
              <option value="branch_manager">مسؤول فرع</option>
              <option value="employee">موظف</option>
            </select>
          </Field>
          {form.role === "branch_manager" && (
            <Field label="الفرع">
              <select style={inputStyle} value={form.branchId} onChange={(e) => setForm({ ...form, branchId: e.target.value })}>
                <option value="">اختر الفرع</option>
                {branches.map((b) => (
                  <option key={b.id} value={b.id}>{b.name}</option>
                ))}
              </select>
            </Field>
          )}
          {form.role === "employee" && (
            <Field label="الموظف المرتبط">
              <select style={inputStyle} value={form.employeeId} onChange={(e) => setForm({ ...form, employeeId: e.target.value })}>
                <option value="">اختر الموظف</option>
                {employees.map((e) => (
                  <option key={e.id} value={e.id}>{e.name}</option>
                ))}
              </select>
            </Field>
          )}
        </div>
        {err && <div style={{ color: COLORS.brick, fontSize: 12, marginTop: 10 }}>{err}</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          <Btn onClick={submit}>{editingId ? "حفظ التعديل" : "إضافة الحساب"}</Btn>
          {editingId && <Btn tone="secondary" onClick={resetForm}>إلغاء</Btn>}
        </div>
      </div>

      <SectionTitle>الحسابات الحالية ({fmt(users.length)})</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
        {users.map((u, i) => (
          <div
            key={u.id}
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              padding: "10px 14px",
              borderTop: i ? `1px dashed ${COLORS.line}` : "none",
            }}
          >
            <div>
              <div style={{ fontWeight: 700, fontSize: 13 }}>
                {u.name} <span style={{ fontWeight: 400, color: "#8a7a63" }}>({u.username})</span>
              </div>
              <div style={{ fontSize: 11.5, color: "#8a7a63" }}>
                {ROLE_LABELS[u.role]}
                {u.role === "branch_manager" && ` · ${branches.find((b) => b.id === u.branchId)?.name || "—"}`}
                {u.role === "employee" && ` · ${employees.find((e) => e.id === u.employeeId)?.name || "غير مرتبط"}`}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <Btn small tone="secondary" onClick={() => edit(u)}>تعديل</Btn>
              <Btn small tone="danger" onClick={() => remove(u.id)}>حذف</Btn>
            </div>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 16, fontSize: 11.5, color: "#a3927a", background: "#fff", border: `1px dashed ${COLORS.line}`, borderRadius: 10, padding: 14 }}>
        تنبيه: كلمات المرور هنا وسيلة تقييد وصول بسيطة داخل الفريق وليست تشفيرًا احترافيًا (يمكن لأي شخص يملك صلاحية الأدمن رؤيتها كنص واضح). البيانات الآن تُخزَّن وتُزامَن عبر قاعدة بيانات Firestore المشتركة، فتأكد من ضبط قواعد الأمان (Rules) في مشروع Firebase لمنع الوصول العام غير المصرّح به.
      </div>
    </div>
  );
}

/* ============ بوابة الدخول (تدير المستخدمين والجلسة) ============ */
function Root() {
  const [users, setUsers] = useState(USERS_SEED);
  const [usersLoaded, setUsersLoaded] = useState(false);
  const [currentUsername, setCurrentUsername] = useState(null);
  const [authLoaded, setAuthLoaded] = useState(false);
  const [loginForm, setLoginForm] = useState({ username: "", password: "" });
  const [loginError, setLoginError] = useState("");
  const [authSyncError, setAuthSyncError] = useState("");
  const lastSyncedUsersRef = useRef("");

  /* الجلسة (من هو المسجّل دخوله) تبقى محلية على كل جهاز، ما تتزامنش */
  useEffect(() => {
    try {
      const sess = localStorage.getItem("hr-system-session");
      if (sess) setCurrentUsername(sess);
    } catch (e) {
      /* لا توجد جلسة محفوظة */
    }
    setAuthLoaded(true);
  }, []);

  /* قائمة المستخدمين والصلاحيات تُزامَن لحظيًا عبر Firestore بين كل الأجهزة */
  useEffect(() => {
    const unsub = USERS_DOC.onSnapshot(
      (snap) => {
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        if (d && Array.isArray(d.users) && d.users.length) {
          setUsers(d.users);
          lastSyncedUsersRef.current = JSON.stringify(d.users);
        } else {
          USERS_DOC.set({ users: USERS_SEED }).catch(() => {});
        }
        setAuthSyncError("");
        setUsersLoaded(true);
      },
      (err) => {
        setAuthSyncError("تعذر الاتصال بقاعدة البيانات المشتركة — تحقّق من اتصال الإنترنت");
        setUsersLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!usersLoaded) return;
    const json = JSON.stringify(users);
    if (json === lastSyncedUsersRef.current) return;
    USERS_DOC.set({ users })
      .then(() => {
        lastSyncedUsersRef.current = json;
      })
      .catch(() => setAuthSyncError("تعذر حفظ بيانات المستخدمين — تحقّق من الإنترنت"));
  }, [users, usersLoaded]);

  const currentUser = users.find((u) => u.username === currentUsername) || null;

  const login = () => {
    const match = users.find(
      (u) => u.username === loginForm.username.trim() && u.password === loginForm.password
    );
    if (!match) {
      setLoginError("اسم المستخدم أو كلمة المرور غير صحيحة");
      return;
    }
    setCurrentUsername(match.username);
    try {
      localStorage.setItem("hr-system-session", match.username);
    } catch (e) {}
    setLoginForm({ username: "", password: "" });
    setLoginError("");
  };

  const logout = () => {
    setCurrentUsername(null);
    try {
      localStorage.removeItem("hr-system-session");
    } catch (e) {}
  };

  if (!authLoaded || !usersLoaded) return null;

  if (!currentUser) {
    return (
      <LoginScreen
        form={loginForm}
        setForm={setLoginForm}
        onSubmit={login}
        error={loginError || authSyncError}
      />
    );
  }

  return <HRApp currentUser={currentUser} users={users} setUsers={setUsers} onLogout={logout} />;
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(<Root />);
</script>
</body>
</html>

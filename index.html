/* ============ إعدادات EmailJS — لإرسال كود تأكيد الدخول بالإيميل (تحقق ثنائي) ============

const EMAILJS_SERVICE_ID = "service_0vtqa4e";
const EMAILJS_TEMPLATE_ID = "template_8vsbx3v";
const EMAILJS_PUBLIC_KEY = "y0LzSNUfCdyuenGVL";
const EMAILJS_CONFIGURED = ![EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, EMAILJS_PUBLIC_KEY].some((v) => !v || v.startsWith("YOUR_"));

/* ============ اللغة (عربي/إنجليزي) ============ */
const LangContext = createContext({ lang: "ar", dir: "rtl", t: (ar) => ar, toggleLang: () => {} });
function useLang() {
  return useContext(LangContext);
}

/* هل عرض الشاشة الحالي في نطاق الجوال؟ — يتحدّث تلقائيًا مع تغيير حجم النافذة (تدوير الجوال مثلًا) */
function useIsMobile(breakpoint = 860) {
  const [isMobile, setIsMobile] = useState(() => (typeof window !== "undefined" ? window.innerWidth <= breakpoint : false));
  useEffect(() => {
    const handler = () => setIsMobile(window.innerWidth <= breakpoint);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, [breakpoint]);
  return isMobile;
}

function LangProvider({ children }) {
  const [lang, setLang] = useState(() => {
    try {
      return localStorage.getItem("hr-system-lang") || "ar";
    } catch (e) {
      return "ar";
    }
  });

  /* الواجهة تبقى RTL دايمًا (نفس التخطيط) — بس النصوص تتغيّر بين عربي وإنجليزي */
  useEffect(() => {
    document.documentElement.setAttribute("lang", lang);
    try {
      localStorage.setItem("hr-system-lang", lang);
    } catch (e) {}
  }, [lang]);

  const toggleLang = () => setLang((prev) => (prev === "ar" ? "en" : "ar"));
  /* t(نص عربي, English text) — يرجع النص المناسب حسب اللغة الحالية */
  const t = (ar, en) => (lang === "en" && en !== undefined ? en : ar);

  return <LangContext.Provider value={{ lang, t, toggleLang }}>{children}</LangContext.Provider>;
}
function LangToggle({ style }) {
  const { lang, toggleLang } = useLang();
  return (
    <button
      onClick={toggleLang}
      style={{
        border: `1px solid ${COLORS.line}`,
        background: "#fff",
        color: COLORS.espresso,
        borderRadius: 8,
        padding: "6px 12px",
        fontSize: 12,
        fontWeight: 700,
        cursor: "pointer",
        ...style,
      }}
    >
      {lang === "ar" ? "English" : "العربية"}
    </button>
  );
}

/* أيقونة حالة الحفظ/المزامنة — تعكس أي تعديل يعمله المستخدم:
   💾 تغييرات غير محفوظة (اضغط للحفظ) → ⏳ جارِ الحفظ → ✓ تم الحفظ → ⚠ تعذر الحفظ (مشكلة اتصال)
   الحفظ هنا يدوي بالكامل — البيانات ما بتتزامن مع القاعدة إلا لما المستخدم يضغط الأيقونة بنفسه */
function SaveStatusIcon({ saving, syncError, dirty, onSave, compact = false }) {
  const { t } = useLang();
  let icon = "✓";
  let color = "#5FA875";
  let bg = "rgba(95,168,117,0.15)";
  let label = t("تم الحفظ", "Saved");
  if (syncError) {
    icon = "⚠";
    color = "#E8A9A0";
    bg = "rgba(232,169,160,0.18)";
    label = t("تعذر الحفظ — تحقّق من الإنترنت", "Couldn't save — check your connection");
  } else if (saving) {
    icon = "⏳";
    color = COLORS.gold;
    bg = "rgba(216,168,90,0.18)";
    label = t("جارِ الحفظ...", "Saving...");
  } else if (dirty) {
    icon = "💾";
    color = "#fff";
    bg = COLORS.brick;
    label = t("لديك تغييرات غير محفوظة — اضغط للحفظ", "You have unsaved changes — tap to save");
  }
  const clickable = dirty && !saving && !syncError && typeof onSave === "function";
  return (
    <button
      type="button"
      onClick={clickable ? onSave : undefined}
      disabled={!clickable}
      title={label}
      style={{
        display: "flex",
        alignItems: "center",
        gap: 6,
        padding: compact ? "5px 8px" : "5px 10px",
        borderRadius: 20,
        background: bg,
        color,
        fontSize: compact ? 13 : 11.5,
        fontWeight: 700,
        flexShrink: 0,
        whiteSpace: "nowrap",
        border: "none",
        cursor: clickable ? "pointer" : "default",
        animation: dirty && !saving ? "pulse-save 1.4s ease-in-out infinite" : "none",
      }}
    >
      <span style={{ fontSize: compact ? 14 : 12, lineHeight: 1 }}>{icon}</span>
      {!compact && <span>{label}</span>}
    </button>
  );
}

/* ضغط وتصغير صورة قبل تحويلها لـ base64 وتخزينها في Firestore — لتفادي تضخّم حجم المستند */
function compressImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error);
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("IMAGE_LOAD_FAILED"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* حساب المسافة (بالمتر) بين نقطتين جغرافيتين — معادلة Haversine */
function distanceMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

/* الحصول على الموقع الحالي كـ Promise */
function getCurrentPosition(options) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject(new Error("NOT_SUPPORTED"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(pos),
      (err) => reject(err),
      options || { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

/* ============ نافذة اختيار الموقع من الخريطة (Leaflet / OpenStreetMap — بدون مفتاح API) ============
   تُستخدم لتحديد موقع الفرع إما بالنقر/السحب على الخريطة يدويًا، أو بالتقاط موقع الجوال الحالي مباشرة داخل نفس النافذة */
/* إصلاح مشكلة معروفة: أيقونة العلامة الافتراضية في Leaflet ما بتتحمّلش صح لما المكتبة تتحمّل من CDN */
if (typeof L !== "undefined") {
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({
    iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
    iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
  });
}

function MapPickerModal({ initialLat, initialLng, onConfirm, onClose }) {
  const { t } = useLang();
  const mapRef = useRef(null);
  const mapObjRef = useRef(null);
  const markerRef = useRef(null);
  const streetLayerRef = useRef(null);
  const satelliteLayerRef = useRef(null);
  const [picked, setPicked] = useState(
    initialLat != null && initialLng != null ? { lat: initialLat, lng: initialLng } : null
  );
  const [locBusy, setLocBusy] = useState(false);
  const [locErr, setLocErr] = useState("");
  const [mapMode, setMapMode] = useState("satellite");

  useEffect(() => {
    if (!mapRef.current || mapObjRef.current) return;
    /* مركز افتراضي: السعودية (لو معندناش إحداثيات محفوظة أصلاً) */
    const startLat = initialLat != null ? initialLat : 24.0;
    const startLng = initialLng != null ? initialLng : 45.0;
    const map = L.map(mapRef.current).setView([startLat, startLng], initialLat != null ? 17 : 6);

    /* طبقة الشوارع (OpenStreetMap) وطبقة الأقمار الصناعية (Esri World Imagery) — كلاهما مجاني بدون مفتاح API */
    const streetLayer = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors",
      maxZoom: 19,
    });
    const satelliteLayer = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution: "Tiles © Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community", maxZoom: 19 }
    );
    streetLayerRef.current = streetLayer;
    satelliteLayerRef.current = satelliteLayer;
    (mapMode === "satellite" ? satelliteLayer : streetLayer).addTo(map);
    mapObjRef.current = map;

    const placeMarker = (lat, lng) => {
      setPicked({ lat, lng });
      if (markerRef.current) {
        markerRef.current.setLatLng([lat, lng]);
      } else {
        markerRef.current = L.marker([lat, lng], { draggable: true }).addTo(map);
        markerRef.current.on("dragend", () => {
          const p = markerRef.current.getLatLng();
          setPicked({ lat: p.lat, lng: p.lng });
        });
      }
    };

    if (initialLat != null && initialLng != null) placeMarker(initialLat, initialLng);

    map.on("click", (e) => placeMarker(e.latlng.lat, e.latlng.lng));

    /* بعض المتصفحات محتاجة إعادة حساب مقاس الخريطة أكتر من مرة بعد ما تتحط في المودال عشان تبان بوضوح كامل */
    setTimeout(() => map.invalidateSize(), 150);
    setTimeout(() => map.invalidateSize(), 400);

    return () => {
      map.remove();
      mapObjRef.current = null;
      markerRef.current = null;
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* تبديل الطبقة بين الشوارع والقمر الصناعي بدون إعادة إنشاء الخريطة أو فقدان موقع الدبوس */
  const toggleMapMode = () => {
    const map = mapObjRef.current;
    if (!map) return;
    const next = mapMode === "satellite" ? "street" : "satellite";
    const current = mapMode === "satellite" ? satelliteLayerRef.current : streetLayerRef.current;
    const target = next === "satellite" ? satelliteLayerRef.current : streetLayerRef.current;
    map.removeLayer(current);
    target.addTo(map);
    setMapMode(next);
  };

  const useMyLocation = async () => {
    setLocErr("");
    setLocBusy(true);
    try {
      const pos = await getCurrentPosition();
      const { latitude, longitude } = pos.coords;
      const map = mapObjRef.current;
      if (map) {
        map.setView([latitude, longitude], 17);
        if (markerRef.current) {
          markerRef.current.setLatLng([latitude, longitude]);
        } else {
          markerRef.current = L.marker([latitude, longitude], { draggable: true }).addTo(map);
          markerRef.current.on("dragend", () => {
            const p = markerRef.current.getLatLng();
            setPicked({ lat: p.lat, lng: p.lng });
          });
        }
      }
      setPicked({ lat: latitude, lng: longitude });
    } catch (err) {
      if (err && err.code === 1) setLocErr(t("تم رفض إذن الوصول للموقع — فعّله من إعدادات المتصفح/الجهاز.", "Location permission denied — enable it in browser/device settings."));
      else if (err && err.message === "NOT_SUPPORTED") setLocErr(t("جهازك أو متصفحك لا يدعم تحديد الموقع.", "Your device or browser doesn't support geolocation."));
      else setLocErr(t("تعذّر تحديد موقعك — تأكد من تفعيل GPS وحاول مرة أخرى.", "Couldn't get your location — make sure GPS is enabled and try again."));
    } finally {
      setLocBusy(false);
    }
  };

  return (
    <div
      className="no-print"
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(36,24,17,0.55)",
        zIndex: 80,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 16,
      }}
    >
      <div
        style={{
          background: "#fff",
          borderRadius: 12,
          maxWidth: 720,
          width: "100%",
          boxShadow: "0 20px 60px rgba(0,0,0,0.35)",
          padding: 18,
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
          <div style={{ fontWeight: 700, color: COLORS.espresso, fontSize: 15 }}>{t("تحديد الموقع من الخريطة", "Pick Location on Map")}</div>
          <button onClick={onClose} style={{ background: "transparent", border: "none", fontSize: 18, cursor: "pointer", color: "#8a7a63", lineHeight: 1 }}>
            ✕
          </button>
        </div>
        <div style={{ fontSize: 11.5, color: "#8a7a63", marginBottom: 10 }}>

  );

const SAUDI_HOLIDAYS_NOTE = "21 يوم إجازة سنوية (تزيد لـ 30 يوم بعد 5 سنوات خدمة) وفق نظام العمل السعودي";
const SAUDI_HOLIDAYS_NOTE_EN = "21 days of annual leave (increasing to 30 days after 5 years of service) per Saudi labor law";

function fmt(n) {
  if (n === "" || n === null || n === undefined || isNaN(n)) return "0";
  return Number(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
}

function yearsBetween(start, end) {
  const s = new Date(start);
  const e = new Date(end);
  if (isNaN(s) || isNaN(e) || e < s) return 0;
  return (e - s) / (1000 * 60 * 60 * 24 * 365.25);
}

/* عدد أيام إجازة (from→to) الواقعة داخل شهر معيّن بصيغة "YYYY-MM" */
function daysOverlapInMonth(from, to, monthStr) {
  if (!from || !to || !monthStr) return 0;
  const [y, m] = monthStr.split("-").map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0); // آخر يوم في الشهر
  const s = new Date(from);
  const e = new Date(to);
  if (isNaN(s) || isNaN(e)) return 0;
  const start = s > monthStart ? s : monthStart;
  const end = e < monthEnd ? e : monthEnd;
  if (end < start) return 0;
  return Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
}

/* إضافة عدد شهور لصيغة "YYYY-MM" وإرجاع نفس الصيغة */
function addMonthsToStr(monthStr, n) {
  const [y, m] = monthStr.split("-").map(Number);
  const d = new Date(y, m - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

/* رصيد الإجازة السنوية: تراكم شهري حسب مدة الخدمة الفعلية منذ آخر تاريخ ذكرى تعيين
   21 يوم/سنة (تزيد لـ 30 بعد 5 سنوات خدمة) وفق نظام العمل السعودي، ناقص المستخدم فعليًا من إجازات "سنوية" خلال سنة الخدمة الحالية */
function leaveBalanceInfo(emp, leaves) {
  if (!emp || !emp.joinDate) return null;
  const join = new Date(emp.joinDate + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (isNaN(join) || join > today) return null;

  const serviceYears = yearsBetween(emp.joinDate, today.toISOString().slice(0, 10));
  const perYear = serviceYears >= 5 ? 30 : 21;

  let anniv = new Date(join);
  anniv.setFullYear(today.getFullYear());
  if (anniv > today) anniv.setFullYear(anniv.getFullYear() - 1);

  let months = (today.getFullYear() - anniv.getFullYear()) * 12 + (today.getMonth() - anniv.getMonth());
  if (today.getDate() < anniv.getDate()) months -= 1;
  months = Math.max(0, Math.min(12, months));

  const accrued = (perYear / 12) * months;
  const usedDays = (leaves || [])
    .filter((l) => l.employeeId === emp.id && l.type === "سنوية" && l.from && new Date(l.from) >= anniv && new Date(l.from) <= today)
    .reduce((s, l) => {
      const d = Math.round((new Date(l.to) - new Date(l.from)) / 86400000) + 1;
      return s + (d > 0 ? d : 0);
    }, 0);
  const adjustment = Number(emp.leaveAdjustment || 0);
  const balance = accrued - usedDays + adjustment;

  return {
    perYear,
    anniversaryDate: anniv.toISOString().slice(0, 10),
    monthsCompleted: months,
    accrued: Math.round(accrued * 10) / 10,
    usedDays,
    adjustment,
    balance: Math.round(balance * 10) / 10,
  };
}

/* حقل تاريخ مخصّص: يعرض القيمة كنص عادي (أرقام إنجليزية مضمونة دايمًا) فوق حقل تاريخ أصلي شفاف
   لفتح تقويم الاختيار — بديل عن الاعتماد الكامل على input type="date" لأن بعض المتصفحات (خصوصًا Safari/iOS)
   تتجاهل خاصية lang وتعرض أرقامًا هندية حسب لغة نظام الجهاز، بغض النظر عن أي إعداد في الصفحة نفسها */
function DateField({ value, onChange, style, placeholder = "YYYY-MM-DD" }) {
  const inputRef = useRef(null);
  const openPicker = () => {
    const el = inputRef.current;
    if (!el || el.disabled) return;
    if (typeof el.showPicker === "function") {
      try {
        el.showPicker();
        return;
      } catch (e) {}
    }
    el.focus();
  };
  return (
    <span style={{ position: "relative", display: "inline-flex", flex: style?.flex }} onClick={openPicker}>
      <input
        type="text"
        readOnly
        dir="ltr"
        value={value || ""}
        placeholder={placeholder}
        style={{ ...inputStyle, ...style, cursor: "pointer" }}
      />
      <input
        ref={inputRef}
        type="date"
        lang="en"
        value={value || ""}
        onChange={(e) => onChange(e.target.value)}
        style={{ position: "absolute", inset: 0, opacity: 0, width: "100%", height: "100%", border: 0, padding: 0, margin: 0, cursor: "pointer" }}
        tabIndex={-1}
      />
    </span>
  );
}

/* حقل تاريخ بتقويم منبثق مبني بالكامل بالجافاسكريبت (بدون الاعتماد على منتقي التاريخ الأصلي للمتصفح)
   عشان نضمن عرض الأرقام وأسماء الشهور بالإنجليزية دايمًا، بغض النظر عن لغة نظام تشغيل الجهاز/المتصفح
   (منتقي التاريخ الأصلي <input type="date"> بيتجاهل أحيانًا خاصية lang ويعرض حسب لغة نظام الجهاز) */
function EnDatePicker({ value, onChange, style, placeholder = "YYYY-MM-DD" }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const parsed = value ? new Date(value + "T00:00:00") : null;
  const [viewDate, setViewDate] = useState(parsed && !isNaN(parsed) ? parsed : new Date());

  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open]);

  const toggleOpen = () => {
    if (!open) {
      const p = value ? new Date(value + "T00:00:00") : null;
      setViewDate(p && !isNaN(p) ? p : new Date());
    }
    setOpen((o) => !o);
  };

  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  const WEEKDAYS = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
  const pad = (n) => String(n).padStart(2, "0");

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDay; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selectDay = (d) => {
    onChange(`${year}-${pad(month + 1)}-${pad(d)}`);
    setOpen(false);
  };
  const goToday = () => {
    const now = new Date();
    setViewDate(now);
    onChange(`${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`);
    setOpen(false);
  };
  const clearVal = () => {
    onChange("");
    setOpen(false);
  };
  const prevMonth = () => setViewDate(new Date(year, month - 1, 1));
  const nextMonth = () => setViewDate(new Date(year, month + 1, 1));

  return (
    <span ref={wrapRef} style={{ position: "relative", display: "inline-flex", flex: style?.flex }}>
      <input
        type="text"
        readOnly
        dir="ltr"
        value={value || ""}
        placeholder={placeholder}
        onClick={toggleOpen}
        style={{ ...inputStyle, ...style, cursor: "pointer" }}
      />
      {open && (
        <div
          dir="ltr"
          style={{
            position: "absolute",
            top: "100%",
            insetInlineStart: 0,
            zIndex: 60,
            marginTop: 4,
            width: 220,
            background: "#fff",
            border: `1px solid ${COLORS.line}`,
            borderRadius: 8,
            padding: 10,
            boxShadow: "0 8px 24px rgba(59,42,29,0.18)",
          }}
        >
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <button type="button" onClick={prevMonth} style={{ border: "none", background: "transparent", cursor: "pointer", fontSize: 15, color: COLORS.coffee, padding: "2px 6px" }}>
              ‹
            </button>
            <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.coffee }}>
              {MONTH_NAMES[month]} {year}
            </div>
            <button type="button" onClick={nextMonth} style={{ border: "none", background: "transparent", cursor: "pointer", fontSize: 15, color: COLORS.coffee, padding: "2px 6px" }}>
              ›
            </button>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2, fontSize: 10.5, color: "#a3927a", marginBottom: 4 }}>
            {WEEKDAYS.map((w) => (
              <div key={w} style={{ textAlign: "center" }}>
                {w}
              </div>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 2 }}>
            {cells.map((d, i) => {
              if (d === null) return <div key={i} />;
              const iso = `${year}-${pad(month + 1)}-${pad(d)}`;
              const selected = value === iso;
              return (
                <button
                  type="button"
                  key={i}
                  onClick={() => selectDay(d)}
                  style={{
                    border: "none",
                    borderRadius: 6,
                    padding: "5px 0",
                    fontSize: 11.5,
                    cursor: "pointer",
                    background: selected ? COLORS.gold : "transparent",
                    color: selected ? "#fff" : COLORS.coffee,
                    fontWeight: selected ? 700 : 500,
                  }}
                >
                  {d}
                </button>
              );
            })}
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, paddingTop: 8, borderTop: `1px dashed ${COLORS.line}` }}>
            <button type="button" onClick={clearVal} style={{ border: "none", background: "transparent", color: COLORS.brick, fontSize: 11, cursor: "pointer" }}>
              Clear
            </button>
            <button type="button" onClick={goToday} style={{ border: "none", background: "transparent", color: COLORS.gold, fontSize: 11, cursor: "pointer", fontWeight: 700 }}>
              Today
            </button>
          </div>
        </div>
      )}
    </span>
  );
}

/* حقل وقت مخصّص بنفس منطق DateField أعلاه — لضمان عرض الأرقام إنجليزية دايمًا بغض النظر عن لغة نظام الجهاز */
function TimeField({ value, onChange, style, placeholder = "HH:MM" }) {
  const inputRef = useRef(null);
  const openPicker = () => {
    const el = inputRef.current;
    if (!el || el.disabled) return;
    if (typeof el.showPicker === "function") {
      try {
        el.showPicker();
        return;
      } catch (e) {}
    }
    el.focus();
  };
  return (
    <span style={{ position: "relative", display: "inline-flex", flex: style?.flex }} onClick={openPicker}>
      <input
        type="text"
        readOnly
        dir="ltr"
        value={value || ""}
        placeholder={placeholder}
        style={{ ...inputStyle, ...style, cursor: "pointer" }}
      />
      <input
        ref={inputRef}
        type="time"
        lang="en"
        value={value || ""}
        onChange={(e) => onChange(e.target.value)}
        style={{ position: "absolute", inset: 0, opacity: 0, width: "100%", height: "100%", border: 0, padding: 0, margin: 0, cursor: "pointer" }}
        tabIndex={-1}
      />
    </span>
  );
}

/* قائمة اختيار موظف قابلة للبحث — تفلتر بالاسم أو رقم الهوية أثناء الكتابة */
function EmployeeSelect({ employees, value, onChange, placeholder }) {
  const { t } = useLang();
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState("");
  const wrapRef = useRef(null);

  const selected = employees.find((e) => e.id === value);

  useEffect(() => {
    const handler = (ev) => {
      if (wrapRef.current && !wrapRef.current.contains(ev.target)) setOpen(false);
    };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  const q = query.trim().toLowerCase();
  const filtered = q
    ? employees.filter(
        (e) => (e.name || "").toLowerCase().includes(q) || (e.nationalId || "").toLowerCase().includes(q)
      )
    : employees;

  return (
    <div ref={wrapRef} style={{ position: "relative" }}>
      <input
        style={inputStyle}
        placeholder={placeholder || t("ابحث بالاسم أو رقم الهوية...", "Search by name or ID...")}
        value={open ? query : selected ? selected.name : ""}
        onFocus={() => {
          setOpen(true);
          setQuery("");
        }}
        onChange={(e) => setQuery(e.target.value)}
      />
      {open && (
        <div
          style={{
            position: "absolute",
            zIndex: 30,
            top: "100%",
            insetInlineStart: 0,
            insetInlineEnd: 0,
            background: "#fff",
            border: `1px solid ${COLORS.line}`,
            borderRadius: 8,
            maxHeight: 240,
            overflowY: "auto",
            marginTop: 3,
            boxShadow: "0 6px 16px rgba(36,24,17,0.12)",
          }}
        >
          <div
            onClick={() => {
              onChange("");
              setOpen(false);
              setQuery("");
            }}
            style={{ padding: "8px 12px", fontSize: 12, color: "#a3927a", cursor: "pointer", borderBottom: `1px dashed ${COLORS.line}` }}
          >
            {t("بدون اختيار", "Clear selection")}
          </div>
          {filtered.length === 0 && (
            <div style={{ padding: "10px 12px", fontSize: 12.5, color: "#a3927a" }}>{t("لا يوجد نتائج", "No results")}</div>
          )}
          {filtered.map((e) => (
            <div
              key={e.id}
              onClick={() => {
                onChange(e.id);
                setOpen(false);
                setQuery("");
              }}
              style={{
                padding: "8px 12px",
                fontSize: 13,
                cursor: "pointer",
                borderTop: `1px dashed ${COLORS.line}`,
                background: e.id === value ? COLORS.paperDark : "transparent",
              }}
            >
              <div style={{ fontWeight: 600 }}>{e.name}</div>
              {e.nationalId && <div style={{ fontSize: 11, color: "#8a7a63" }}>{e.nationalId}</div>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Btn({ children, onClick, tone = "primary", small, type = "button", disabled = false }) {
  const base =
    tone === "primary"
      ? { background: COLORS.espresso, color: "#fff" }
      : tone === "danger"
      ? { background: COLORS.brickBg, color: COLORS.brick, border: `1px solid ${COLORS.brick}55` }
      : { background: "#fff", color: COLORS.coffee, border: `1px solid ${COLORS.line}` };
  return (
    <button
      type={type}
      onClick={onClick}
      disabled={disabled}
      style={{
        ...base,
        borderRadius: 8,
        padding: small ? "6px 10px" : "9px 16px",
        fontSize: 13,
        fontWeight: 700,
        cursor: disabled ? "not-allowed" : "pointer",
        opacity: disabled ? 0.5 : 1,
      }}
    >
      {children}
    </button>
  );
}

/* ============ التطبيق الرئيسي ============ */
function HRApp({ currentUser, users, setUsers, onLogout, activityLog, logActivity }) {
  const { t } = useLang();
  const role = currentUser.role;
  const isAdmin = role === "admin";
  const isManager = role === "manager";
  const isEntityManager = role === "entity_manager";
  const isBranchManager = role === "branch_manager";
  const navItems =
    !isAdmin && Array.isArray(currentUser.customTabs)
      ? NAV.filter((n) => currentUser.customTabs.includes(n.key))
      : navForRole(role);
  const hasTab = (key) => navItems.some((n) => n.key === key);
  const [tab, setTab] = useState(navItems[0]?.key || "dash");
  /* أي قسم فرعي معروض حاليًا داخل تبويب "تراخيص الفروع" (السجل التجاري / باقي الرخص / الشهادات الصحية والتأمين الطبي / السيارات) */
  const [licenseSubTab, setLicenseSubTab] = useState("cr");
  /* أي الأقسام الرئيسية في القائمة الجانبية مفتوحة حاليًا — يُفتح تلقائيًا القسم الذي يحوي البند النشط */
  const [expandedGroups, setExpandedGroups] = useState(() => {
    const g = NAV_GROUPS.find((gr) => !gr.standalone && ((gr.items && gr.items.includes(tab)) || gr.targetTab === tab));
    return g ? { [g.key]: true } : {};
  });
  const toggleGroup = (key) => setExpandedGroups((prev) => ({ ...prev, [key]: !prev[key] }));
  const [entities, setEntities] = useState(ENTITIES_SEED);
  const [branches, setBranches] = useState(BRANCHES_SEED);
  const [employees, setEmployees] = useState([]);
  const [leaves, setLeaves] = useState([]);
  const [leaveRequests, setLeaveRequests] = useState([]);
  const [advanceRequests, setAdvanceRequests] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [payrollItems, setPayrollItems] = useState([]);
  const [tasks, setTasks] = useState([]);
  const [messages, setMessages] = useState([]);
  const [gosiRates, setGosiRates] = useState({
    saudiEmployee: 9.75,
    saudiEmployer: 11.75,
    nonSaudiEmployer: 2,
  });
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");
  const [saving, setSaving] = useState(false);
  const [dirty, setDirty] = useState(false);
  const [syncError, setSyncError] = useState("");
  const [showChangePassword, setShowChangePassword] = useState(false);
  const isMobile = useIsMobile();
  const [navOpen, setNavOpen] = useState(false);
  const lastSyncedRef = useRef("");
  const dirtyRef = useRef(false);
  useEffect(() => {
    dirtyRef.current = dirty;
  }, [dirty]);

  /* تحذير المستخدم لو حاول يغلق الصفحة أو يخرج منها وفيه تعديلات لسه ما اتحفظتش */
  useEffect(() => {
    const handler = (e) => {
      if (dirtyRef.current) {
        e.preventDefault();
        e.returnValue = "";
      }
    };
    window.addEventListener("beforeunload", handler);
    return () => window.removeEventListener("beforeunload", handler);
  }, []);

  /* الاستماع لحظيًا لبيانات النظام من Firestore — أي تعديل من أي جهاز يوصل هنا فورًا */
  useEffect(() => {
    const unsub = DATA_DOC.onSnapshot(
      (snap) => {
        /* نتجاهل النسخة المحلية غير المؤكدة من الخادم بعد (كتابتنا إحنا) لتفادي قطع الكتابة أثناء الكتابة */
        if (snap.metadata.hasPendingWrites) return;
        /* لو فيه تعديلات محلية لسه ما اتحفظتش، نتجاهل التحديث الوارد من جهاز تاني مؤقتًا
           عشان ما نمسحش تعديلات المستخدم قبل ما يحفظها بنفسه */
        if (dirtyRef.current) return;
        const d = snap.data();
        if (d) {
          const next = {
            entities: d.entities || ENTITIES_SEED,
            branches: d.branches || BRANCHES_SEED,
            employees: d.employees || [],
            leaves: d.leaves || [],
            leaveRequests: d.leaveRequests || [],
            advanceRequests: d.advanceRequests || [],
            attendance: d.attendance || [],
            gosiRates: d.gosiRates || { saudiEmployee: 9.75, saudiEmployer: 11.75, nonSaudiEmployer: 2 },
            vehicles: d.vehicles || [],
            payrollItems: d.payrollItems || [],
            tasks: d.tasks || [],
            messages: d.messages || [],
          };
          setEntities(next.entities);
          setBranches(next.branches);
          setEmployees(next.employees);
          setLeaves(next.leaves);
          setLeaveRequests(next.leaveRequests);
          setAdvanceRequests(next.advanceRequests);
          setAttendance(next.attendance);
          setVehicles(next.vehicles);
          setGosiRates(next.gosiRates);
          setPayrollItems(next.payrollItems);
          setTasks(next.tasks);
          setMessages(next.messages);
          lastSyncedRef.current = JSON.stringify(next);
        } else {
          /* أول مرة يتشغّل فيها النظام: أنشئ المستند بالبيانات الافتراضية */
          DATA_DOC.set({ entities: ENTITIES_SEED, branches: BRANCHES_SEED, employees: [], leaves: [], leaveRequests: [], advanceRequests: [], attendance: [], vehicles: [], gosiRates, payrollItems: [], tasks: [], messages: [] }).catch(() => {});
        }
        setSyncError("");
        setLoaded(true);
      },
      (err) => {
        setSyncError("تعذر الاتصال بقاعدة البيانات المشتركة — تحقّق من اتصال الإنترنت");
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  /* تعقّب التعديلات: بمجرد أي تغيير في البيانات (موظف، حضور، راتب...) نعلّمه "غير محفوظ".
     لصفحة الموظف الذاتية (دور "employee"): الحفظ تلقائي زي الأول — التعديل بيتزامن مع القاعدة
     بدون تدخل (تسجيل حضور/انصراف، طلب إجازة، إلخ).
     لباقي الأدوار (أدمن، مدير كيان، مسؤول فرع...): الحفظ يدوي فقط عند ضغط أيقونة الحفظ. */
  useEffect(() => {
    if (!loaded) return;
    const payload = { entities, branches, employees, leaves, leaveRequests, advanceRequests, attendance, gosiRates, vehicles, payrollItems, tasks, messages };
    const json = JSON.stringify(payload);
    if (json === lastSyncedRef.current) {
      setDirty(false);
      return;
    }
    if (role === "employee") {
      setSaving(true);
      const t = setTimeout(() => {
        DATA_DOC.set(payload)
          .then(() => {
            lastSyncedRef.current = json;
            setDirty(false);
            setSaving(false);
            setSaveMsg("تم الحفظ ✓");
            setTimeout(() => setSaveMsg(""), 1500);
          })
          .catch(() => {
            setSaving(false);
            setDirty(true);
            setSaveMsg("تعذر الحفظ — تحقّق من الإنترنت");
          });
      }, 400);
      return () => clearTimeout(t);
    }
    setDirty(true);
  }, [entities, branches, employees, leaves, leaveRequests, advanceRequests, attendance, gosiRates, vehicles, payrollItems, tasks, loaded, role]);

  /* حفظ يدوي — يُستدعى عند ضغط المستخدم على أيقونة الحفظ (للأدوار غير الموظف الذاتي) */
  const saveNow = () => {
    const payload = { entities, branches, employees, leaves, leaveRequests, advanceRequests, attendance, gosiRates, vehicles, payrollItems, tasks, messages };
    const json = JSON.stringify(payload);
    if (json === lastSyncedRef.current) {
      setDirty(false);
      return;
    }
    setSaving(true);
    DATA_DOC.set(payload)
      .then(() => {
        lastSyncedRef.current = json;
        setDirty(false);
        setSaving(false);
        setSaveMsg("تم الحفظ ✓");
        setTimeout(() => setSaveMsg(""), 1500);
      })
      .catch(() => {
        setSaving(false);
        setSaveMsg("تعذر الحفظ — تحقّق من الإنترنت");
      });
  };

  const branchName = (id) => branches.find((b) => b.id === id)?.name || "—";
  const entityName = (id) => entities.find((e) => e.id === id)?.name || "—";
  const entityOfBranch = (branchId) => branches.find((b) => b.id === branchId)?.entityId;

  /* نطاق البيانات حسب الصلاحية: مسؤول الفرع يشوف فرعه فقط، مدير الكيان يشوف كل فروع كيانه فقط */
  const scopedEntities = isEntityManager ? entities.filter((e) => e.id === currentUser.entityId) : entities;
  const scopedBranches = isBranchManager
    ? branches.filter((b) => b.id === currentUser.branchId)
    : isEntityManager
    ? branches.filter((b) => b.entityId === currentUser.entityId)
    : branches;
  const scopedEmployees = isBranchManager
    ? employees.filter((e) => e.branchId === currentUser.branchId)
    : isEntityManager
    ? employees.filter((e) => scopedBranches.some((b) => b.id === e.branchId))
    : employees;
  const scopedLeaves = isBranchManager || isEntityManager
    ? leaves.filter((l) => scopedEmployees.some((e) => e.id === l.employeeId))
    : leaves;
  const scopedLeaveRequests = isEntityManager
    ? leaveRequests.filter((r) => scopedEmployees.some((e) => e.id === r.employeeId))
    : leaveRequests;
  const scopedAdvanceRequests = isBranchManager || isEntityManager
    ? advanceRequests.filter((r) => scopedEmployees.some((e) => e.id === r.employeeId))
    : advanceRequests;
  const scopedAttendance = isBranchManager || isEntityManager
    ? attendance.filter((a) => scopedEmployees.some((e) => e.id === a.employeeId))
    : attendance;
  const scopedVehicles = isBranchManager
    ? vehicles.filter((v) => v.branchId === currentUser.branchId)
    : isEntityManager
    ? vehicles.filter((v) => scopedBranches.some((b) => b.id === v.branchId))
    : vehicles;
  const scopedPayrollItems = isBranchManager || isEntityManager
    ? payrollItems.filter((p) => scopedEmployees.some((e) => e.id === p.employeeId))
    : payrollItems;
  const scopedTasks = isBranchManager || isEntityManager
    ? tasks.filter((ts) => scopedEmployees.some((e) => e.id === ts.employeeId))
    : tasks;
  const scopedMessages = isBranchManager || isEntityManager
    ? messages.filter(
        (m) =>
          (m.scope === "employee" && scopedEmployees.some((e) => e.id === m.employeeId)) ||
          (m.scope === "branch" && scopedBranches.some((b) => b.id === m.branchId)) ||
          (m.scope === "all" && !isBranchManager)
      )
    : messages;

  /* إدارة مهام الموظفين: تسجيل مهمة جديدة، تحديث حالتها، حذفها */
  const addTask = (task) => {
    const newTask = { ...task, id: uid(), status: "قيد التنفيذ", assignedBy: currentUser.name, assignedAt: new Date().toISOString() };
    setTasks((prev) => [newTask, ...prev]);
    logActivity && logActivity("تسجيل مهمة جديدة", "tasks", `${employees.find((e) => e.id === task.employeeId)?.name || ""} — ${task.title}`);
  };
  const updateTaskStatus = (taskId, status) => {
    setTasks((prev) => prev.map((ts) => (ts.id === taskId ? { ...ts, status } : ts)));
    const ts = tasks.find((x) => x.id === taskId);
    logActivity && logActivity(status === "مكتملة" ? "إنهاء مهمة" : "إعادة فتح مهمة", "tasks", `${employees.find((e) => e.id === ts?.employeeId)?.name || ""} — ${ts?.title || ""}`);
  };
  const removeTask = (taskId) => {
    const ts = tasks.find((x) => x.id === taskId);
    setTasks((prev) => prev.filter((x) => x.id !== taskId));
    logActivity && logActivity("حذف مهمة", "tasks", `${employees.find((e) => e.id === ts?.employeeId)?.name || ""} — ${ts?.title || ""}`);
  };
  const addTaskComment = (taskId, text) => {
    if (!text || !text.trim()) return;
    const comment = { id: uid(), text: text.trim(), author: currentUser.name, at: new Date().toISOString() };
    setTasks((prev) => prev.map((ts) => (ts.id === taskId ? { ...ts, comments: [...(ts.comments || []), comment] } : ts)));
    const ts = tasks.find((x) => x.id === taskId);
    logActivity && logActivity("تعليق على مهمة", "tasks", `${employees.find((e) => e.id === ts?.employeeId)?.name || ""} — ${ts?.title || ""}`);
  };
  /* توثيق إتمام المهمة بالصور */
  const addTaskPhotos = (taskId, dataUrls) => {
    setTasks((prev) => prev.map((ts) => (ts.id === taskId ? { ...ts, completionPhotos: [...(ts.completionPhotos || []), ...dataUrls] } : ts)));
    const ts = tasks.find((x) => x.id === taskId);
    logActivity && logActivity("توثيق مهمة بصور", "tasks", `${employees.find((e) => e.id === ts?.employeeId)?.name || ""} — ${ts?.title || ""}`);
  };
  const removeTaskPhoto = (taskId, photoIndex) => {
    setTasks((prev) =>
      prev.map((ts) => (ts.id === taskId ? { ...ts, completionPhotos: (ts.completionPhotos || []).filter((_, i) => i !== photoIndex) } : ts))
    );
  };

  /* ============ رسائل للموظفين ============
     scope: "employee" (موظف واحد) / "branch" (كل موظفي فرع) / "all" (كل الموظفين النشطين)
     كل رسالة بتتسجل مرة واحدة بغض النظر عن عدد المستلمين، وكل موظف بيشوفها في صفحته الذاتية
     ويقدر يعلّمها "مقروءة" — والإدارة تقدر تشوف مين قراها ومين لسه */
  const sendMessage = (msg) => {
    const newMsg = {
      ...msg,
      id: uid(),
      sentBy: currentUser.name,
      sentAt: new Date().toISOString(),
      readBy: [],
    };
    setMessages((prev) => [newMsg, ...prev]);
    const scopeLabel =
      msg.scope === "employee"
        ? employees.find((e) => e.id === msg.employeeId)?.name || ""
        : msg.scope === "branch"
        ? branches.find((b) => b.id === msg.branchId)?.name || ""
        : t("كل الموظفين", "All Employees");
    logActivity && logActivity("إرسال رسالة للموظفين", "messages", scopeLabel);
  };
  const removeMessage = (msgId) => {
    setMessages((prev) => prev.filter((m) => m.id !== msgId));
  };
  const markMessageRead = (msgId, employeeId) => {
    setMessages((prev) =>
      prev.map((m) => (m.id === msgId && !(m.readBy || []).includes(employeeId) ? { ...m, readBy: [...(m.readBy || []), employeeId] } : m))
    );
  };

  /* دورة اعتماد طلبات الإجازة: موافقة مبدئية من مدير الكيان، ثم موافقة نهائية من الأدمن/المسؤول العام */
  const preliminaryApproveLeaveRequest = (reqId) => {
    setLeaveRequests((prev) => prev.map((r) => (r.id === reqId ? { ...r, status: "موافقة مبدئية", entityApprovedBy: currentUser.name, entityApprovedAt: new Date().toISOString() } : r)));
    logActivity && logActivity("موافقة مبدئية على طلب إجازة", "leaveRequests", employees.find((e) => e.id === leaveRequests.find((r) => r.id === reqId)?.employeeId)?.name || "");
  };
  const preliminaryRejectLeaveRequest = (reqId) => {
    setLeaveRequests((prev) => prev.map((r) => (r.id === reqId ? { ...r, status: "مرفوضة من مدير الكيان", entityApprovedBy: currentUser.name, entityApprovedAt: new Date().toISOString() } : r)));
    logActivity && logActivity("رفض مبدئي لطلب إجازة", "leaveRequests", employees.find((e) => e.id === leaveRequests.find((r) => r.id === reqId)?.employeeId)?.name || "");
  };
  const finalApproveLeaveRequest = (reqId) => {
    const req = leaveRequests.find((r) => r.id === reqId);
    if (!req) return;
    setLeaveRequests((prev) => prev.map((r) => (r.id === reqId ? { ...r, status: "موافقة نهائية", finalApprovedBy: currentUser.name, finalApprovedAt: new Date().toISOString() } : r)));
    setLeaves((prev) => [...prev, { id: uid(), employeeId: req.employeeId, type: req.type, from: req.from, to: req.to, note: req.note || "", leaveRequestId: req.id }]);
    logActivity && logActivity("موافقة نهائية على طلب إجازة", "leaveRequests", employees.find((e) => e.id === req.employeeId)?.name || "");
  };
  const finalRejectLeaveRequest = (reqId) => {
    setLeaveRequests((prev) => prev.map((r) => (r.id === reqId ? { ...r, status: "مرفوضة نهائيًا", finalApprovedBy: currentUser.name, finalApprovedAt: new Date().toISOString() } : r)));
    logActivity && logActivity("رفض نهائي لطلب إجازة", "leaveRequests", employees.find((e) => e.id === leaveRequests.find((r) => r.id === reqId)?.employeeId)?.name || "");
  };

  /* دورة اعتماد طلبات السلف: خطوة واحدة — موافقة أو رفض من الأدمن/المسؤول العام/مدير الكيان.
     عند الموافقة، بيتسجّل تلقائيًا كقيد "سلفة" في كشف رواتب الشهر الحالي فيتخصم من صافي الموظف */
  const approveAdvanceRequest = (reqId) => {
    const req = advanceRequests.find((r) => r.id === reqId);
    if (!req) return;
    setAdvanceRequests((prev) =>
      prev.map((r) => (r.id === reqId ? { ...r, status: "موافقة", decidedBy: currentUser.name, decidedAt: new Date().toISOString() } : r))
    );
    const month = new Date().toISOString().slice(0, 7);
    setPayrollItems((prev) => [
      ...prev,
      { id: uid(), employeeId: req.employeeId, type: "سلفة", amount: req.amount, month, note: req.reason || "", advanceRequestId: req.id },
    ]);
    logActivity && logActivity("موافقة على طلب سلفة", "advanceRequests", `${employees.find((e) => e.id === req.employeeId)?.name || ""}: ${fmt(req.amount)} ﷼`);
  };
  const rejectAdvanceRequest = (reqId) => {
    setAdvanceRequests((prev) =>
      prev.map((r) => (r.id === reqId ? { ...r, status: "مرفوض", decidedBy: currentUser.name, decidedAt: new Date().toISOString() } : r))
    );
    logActivity && logActivity("رفض طلب سلفة", "advanceRequests", employees.find((e) => e.id === advanceRequests.find((r) => r.id === reqId)?.employeeId)?.name || "");
  };

  /* حساب موظف عادي: يشوف بياناته الشخصية فقط، بدون قائمة تنقّل */
  if (role === "employee") {
    const myEmployee = employees.find((e) => e.id === currentUser.employeeId);
    const submitLeaveRequest = (req) => {
      const newReq = {
        ...req,
        id: uid(),
        employeeId: myEmployee?.id,
        status: "قيد المراجعة",
        requestedAt: new Date().toISOString(),
      };
      setLeaveRequests((prev) => [newReq, ...prev]);
      logActivity && logActivity("تقديم طلب إجازة", "leaveRequests", myEmployee?.name || "");
    };
    const submitAdvanceRequest = (req) => {
      const newReq = {
        ...req,
        id: uid(),
        employeeId: myEmployee?.id,
        status: "قيد المراجعة",
        requestedAt: new Date().toISOString(),
      };
      setAdvanceRequests((prev) => [newReq, ...prev]);
      logActivity && logActivity("تقديم طلب سلفة", "advanceRequests", `${myEmployee?.name || ""}: ${fmt(req.amount)} ﷼`);
    };

    const todayISO = new Date().toISOString().slice(0, 10);
    const nowTimeStr = () => {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
    };
    const minutesOf = (hhmm) => {
      const [h, m] = (hhmm || "00:00").split(":").map(Number);
      return h * 60 + m;
    };

    const [geoBusy, setGeoBusy] = useState(false);
    const [geoError, setGeoError] = useState("");

    /* لموظفين يشتغلوا على أكتر من فرع: بيتفحص موقعهم مقابل كل فروعهم (الأساسي + الإضافية)،
       وبينجح التسجيل لو كانوا داخل نطاق أي فرع منهم — مع تسجيل الفرع الفعلي اللي سجّلوا منه */
    const verifyAtAnyBranch = async (branchIds) => {
      const validBranches = branchIds.map((id) => branches.find((b) => b.id === id)).filter((b) => b && b.lat != null && b.lng != null);
      if (validBranches.length === 0) {
        return {
          ok: false,
          message: t(
            "لم يتم تحديد موقع أي من فروعك بعد — تواصل مع الإدارة لضبط مواقع الفروع من تبويب \"الكيانات والفروع\".",
            "None of your branches have a location set yet — contact management to set them from the \"Entities & Branches\" tab."
          ),
        };
      }
      let pos;
      try {
        pos = await getCurrentPosition();
      } catch (err) {
        if (err && err.code === 1) {
          return { ok: false, message: t("تم رفض إذن الوصول للموقع. فعّل خدمة الموقع للمتصفح من إعدادات جهازك وحاول مرة أخرى.", "Location permission was denied. Enable location access for the browser in your device settings and try again.") };
        }
        if (err && err.message === "NOT_SUPPORTED") {
          return { ok: false, message: t("جهازك أو متصفحك لا يدعم تحديد الموقع.", "Your device or browser doesn't support geolocation.") };
        }
        return { ok: false, message: t("تعذّر تحديد موقعك. تأكد من تفعيل GPS ووجود اتصال، ثم حاول مرة أخرى.", "Couldn't get your location. Make sure GPS is enabled and you have a connection, then try again.") };
      }
      let closest = null;
      for (const branch of validBranches) {
        const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, branch.lat, branch.lng);
        const radius = branch.radius || 150;
        if (dist <= radius) {
          return { ok: true, branchId: branch.id, lat: pos.coords.latitude, lng: pos.coords.longitude, distance: Math.round(dist), accuracy: pos.coords.accuracy };
        }
        if (!closest || dist < closest.dist) closest = { dist, branch, radius };
      }
      return {
        ok: false,
        message: t(
          `أنت لست داخل نطاق أي من فروعك — أقرب فرع لك هو "${closest.branch.name}" وتبعد عنه ${Math.round(closest.dist)} متر تقريبًا (النطاق المسموح ${closest.radius} متر).`,
          `You're not within range of any of your branches — the closest is "${closest.branch.name}", about ${Math.round(closest.dist)}m away (allowed range ${closest.radius}m).`
        ),
      };
    };

    const clockIn = async () => {
      if (!myEmployee) return;
      const already = attendance.find((a) => a.employeeId === myEmployee.id && a.date === todayISO);
      if (already) return;
      setGeoError("");
      setGeoBusy(true);
      const myBranchIds = [myEmployee.branchId, ...(myEmployee.additionalBranchIds || [])].filter(Boolean);
      const check = await verifyAtAnyBranch(myBranchIds);
      setGeoBusy(false);
      if (!check.ok) {
        setGeoError(check.message);
        return;
      }
      const timeStr = nowTimeStr();
      const shiftStart = myEmployee.workShift?.start || "08:00";
      const diff = minutesOf(timeStr) - minutesOf(shiftStart);
      const lateMinutes = diff > 0 ? diff : 0;
      const rec = {
        id: uid(),
        employeeId: myEmployee.id,
        date: todayISO,
        status: lateMinutes > 0 ? "متأخر" : "حاضر",
        lateMinutes,
        overtimeHours: 0,
        checkInTime: timeStr,
        checkOutTime: "",
        branchId: check.branchId,
        checkInLocation: { lat: check.lat, lng: check.lng, distance: check.distance, accuracy: check.accuracy },
      };
      setAttendance((prev) => [...prev, rec]);
      const checkInBranchName = branches.find((b) => b.id === check.branchId)?.name || "";
      logActivity && logActivity("تسجيل حضور (ذاتي)", "attendance", `${myEmployee.name}: ${timeStr}${checkInBranchName ? " — " + checkInBranchName : ""}`);
    };

    const clockOut = async () => {
      if (!myEmployee) return;
      const rec = attendance.find((a) => a.employeeId === myEmployee.id && a.date === todayISO);
      if (!rec || rec.checkOutTime) return;
      setGeoError("");
      setGeoBusy(true);
      const myBranchIds = [myEmployee.branchId, ...(myEmployee.additionalBranchIds || [])].filter(Boolean);
      const check = await verifyAtAnyBranch(myBranchIds);
      setGeoBusy(false);
      if (!check.ok) {
        setGeoError(check.message);
        return;
      }
      const timeStr = nowTimeStr();
      const shiftEnd = myEmployee.workShift?.end || "17:00";
      const diff = minutesOf(timeStr) - minutesOf(shiftEnd);
      const overtimeHours = diff > 0 ? Math.round((diff / 60) * 2) / 2 : 0;
      setAttendance((prev) =>
        prev.map((a) =>
          a.id === rec.id
            ? { ...a, checkOutTime: timeStr, overtimeHours, checkOutLocation: { lat: check.lat, lng: check.lng, distance: check.distance, accuracy: check.accuracy } }
            : a
        )
      );
      logActivity && logActivity("تسجيل انصراف (ذاتي)", "attendance", `${myEmployee.name}: ${timeStr}`);
    };

    return (
      <EmployeeSelfView
        user={currentUser}
        employee={myEmployee}
        leaves={leaves}
        leaveRequests={leaveRequests.filter((r) => r.employeeId === myEmployee?.id)}
        onSubmitLeaveRequest={submitLeaveRequest}
        advanceRequests={advanceRequests.filter((r) => r.employeeId === myEmployee?.id)}
        onSubmitAdvanceRequest={submitAdvanceRequest}
        attendance={attendance}
        onClockIn={clockIn}
        onClockOut={clockOut}
        geoBusy={geoBusy}
        geoError={geoError}
        branchName={branchName}
        onLogout={onLogout}
        setUsers={setUsers}
        logActivity={logActivity}
        tasks={tasks.filter((ts) => ts.employeeId === myEmployee?.id)}
        onUpdateTaskStatus={updateTaskStatus}
        onAddTaskComment={addTaskComment}
        onAddTaskPhotos={addTaskPhotos}
        onRemoveTaskPhoto={removeTaskPhoto}
        messages={messages.filter(
          (m) => m.scope === "all" || (m.scope === "employee" && m.employeeId === myEmployee?.id) || (m.scope === "branch" && m.branchId === myEmployee?.branchId)
        )}
        onMarkMessageRead={(msgId) => markMessageRead(msgId, myEmployee?.id)}
        dirty={dirty}
        saving={saving}
        syncError={syncError}
        onSave={saveNow}
      />
    );
  }

  return (
    <div
      dir="rtl"
      style={{
        fontFamily: "'Segoe UI', Tahoma, Arial, sans-serif",
        background: COLORS.paper,
        minHeight: "100vh",
        color: COLORS.ink,
        display: "flex",
      }}
    >
      {/* شريط علوي خاص بالجوال فقط: زر فتح القائمة + عنوان الصفحة الحالية */}
      {isMobile && (
        <div
          className="no-print"
          style={{
            position: "fixed",
            top: 0,
            insetInlineStart: 0,
            insetInlineEnd: 0,
            zIndex: 35,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
            background: COLORS.espresso,
            color: "#F5EBDC",
            padding: "12px 14px",
            boxShadow: "0 2px 8px rgba(0,0,0,0.15)",
          }}
        >
          <button
            onClick={() => setNavOpen(true)}
            aria-label={t("فتح القائمة", "Open menu")}
            style={{ background: "transparent", border: "none", color: "#F5EBDC", fontSize: 22, cursor: "pointer", padding: 4, lineHeight: 1 }}
          >
            ☰
          </button>
          <div style={{ fontSize: 14, fontWeight: 700 }}>
            {t(navItems.find((n) => n.key === tab)?.label || "نظام الموارد البشرية", navItems.find((n) => n.key === tab)?.labelEn || "HR System")}
          </div>
          <SaveStatusIcon saving={saving} syncError={syncError} dirty={dirty} onSave={saveNow} compact />
        </div>
      )}

      {/* خلفية معتمة خلف القائمة المنزلقة على الجوال — الضغط عليها يغلق القائمة */}
      {isMobile && navOpen && (
        <div
          onClick={() => setNavOpen(false)}
          style={{ position: "fixed", inset: 0, background: "rgba(20,14,10,0.45)", zIndex: 44 }}
        />
      )}

      {/* الشريط الجانبي — قائمة ثابتة على سطح المكتب، وقائمة منزلقة (درج) على الجوال */}
      <aside
        style={{
          width: 230,
          background: COLORS.espresso,
          color: "#F5EBDC",
          padding: "22px 14px",
          flexShrink: 0,
          minHeight: "100vh",
          ...(isMobile
            ? {
                position: "fixed",
                top: 0,
                bottom: 0,
                insetInlineStart: 0,
                width: "min(250px, 82vw)",
                zIndex: 45,
                overflowY: "auto",
                transform: navOpen ? "translateX(0)" : "translateX(100%)",
                transition: "transform 0.25s ease",
                boxShadow: navOpen ? "-8px 0 24px rgba(0,0,0,0.25)" : "none",
              }
            : {}),
        }}
      >
        <div style={{ marginBottom: 26, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 800, letterSpacing: 0.3 }}>{t("نظام الموارد البشرية", "HR System")}</div>
            <div style={{ fontSize: 11, color: COLORS.goldLight, marginTop: 3 }}>{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          </div>
          {isMobile ? (
            <button
              onClick={() => setNavOpen(false)}
              aria-label={t("إغلاق القائمة", "Close menu")}
              style={{ background: "transparent", border: "none", color: "#F5EBDC", fontSize: 20, cursor: "pointer", padding: 2, lineHeight: 1, flexShrink: 0 }}
            >
              ✕
            </button>
          ) : (
            <LangToggle style={{ background: "rgba(255,255,255,0.08)", borderColor: "rgba(255,255,255,0.25)", color: "#F5EBDC", flexShrink: 0 }} />
          )}
        </div>
        {isMobile && (
          <div style={{ marginBottom: 14 }}>
            <LangToggle style={{ background: "rgba(255,255,255,0.08)", borderColor: "rgba(255,255,255,0.25)", color: "#F5EBDC" }} />
          </div>
        )}
        <nav style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {NAV_GROUPS.map((grp) => {
            if (grp.standalone) {
              const n = navItems.find((it) => it.key === grp.key);
              if (!n) return null;
              return (
                <button
                  key={n.key}
                  onClick={() => {
                    setTab(n.key);
                    if (isMobile) setNavOpen(false);
                  }}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    textAlign: "right",
                    background: tab === n.key ? "rgba(216,168,90,0.18)" : "transparent",
                    border: "none",
                    borderRight: tab === n.key ? `3px solid ${COLORS.gold}` : "3px solid transparent",
                    color: tab === n.key ? "#fff" : "#D9CBB2",
                    padding: "12px 10px",
                    borderRadius: 6,
                    fontSize: 14,
                    fontWeight: tab === n.key ? 700 : 500,
                    cursor: "pointer",
                  }}
                >
                  <span style={{ fontSize: 15, color: COLORS.goldLight }}>{n.icon}</span>
                  {t(n.label, n.labelEn)}
                </button>
              );
            }
            /* قسم رئيسي له بنود فرعية داخلية (subTabs) — كلها تفتح نفس تبويب NAV (targetTab) وتُغيّر العرض داخله فقط */
            if (grp.subTabs) {
              if (!hasTab(grp.targetTab)) return null;
              const isOpenSub = !!expandedGroups[grp.key] || tab === grp.targetTab;
              return (
                <div key={grp.key}>
                  <button
                    onClick={() => toggleGroup(grp.key)}
                    style={{
                      width: "100%",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      gap: 10,
                      textAlign: "right",
                      background: "transparent",
                      border: "none",
                      borderRight: "3px solid transparent",
                      color: "#D9CBB2",
                      padding: "12px 10px",
                      borderRadius: 6,
                      fontSize: 14,
                      fontWeight: 600,
                      cursor: "pointer",
                    }}
                  >
                    <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 15, color: COLORS.goldLight }}>{grp.icon}</span>
                      {t(grp.label, grp.labelEn)}
                    </span>
                    <span
                      style={{
                        fontSize: 11,
                        color: COLORS.goldLight,
                        transition: "transform 0.15s ease",
                        transform: isOpenSub ? "rotate(90deg)" : "rotate(0deg)",
                      }}
                    >
                      ◂
                    </span>
                  </button>
                  {isOpenSub && (
                    <div
                      style={{
                        display: "flex",
                        flexDirection: "column",
                        gap: 2,
                        paddingInlineEnd: 14,
                        marginBottom: 2,
                      }}
                    >
                      {grp.subTabs.map((s) => {
                        const active = tab === grp.targetTab && licenseSubTab === s.key;
                        return (
                          <button
                            key={s.key}
                            onClick={() => {
                              setTab(grp.targetTab);
                              setLicenseSubTab(s.key);
                              if (isMobile) setNavOpen(false);
                            }}
                            style={{
                              display: "flex",
                              alignItems: "center",
                              gap: 8,
                              textAlign: "right",
                              background: active ? "rgba(216,168,90,0.18)" : "transparent",
                              border: "none",
                              borderRight: active ? `3px solid ${COLORS.gold}` : "3px solid transparent",
                              color: active ? "#fff" : "#C9BB9E",
                              padding: "10px 10px",
                              borderRadius: 6,
                              fontSize: 13,
                              fontWeight: active ? 700 : 500,
                              cursor: "pointer",
                            }}
                          >
                            {t(s.label, s.labelEn)}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            }
            /* قسم رئيسي: نعرضه فقط لو فيه بند واحد على الأقل ظاهر ضمن navItems (حسب الصلاحيات) */
            const groupItems = grp.items
              .map((key) => navItems.find((it) => it.key === key))
              .filter(Boolean);
            if (!groupItems.length) return null;
            const isOpen = !!expandedGroups[grp.key] || groupItems.some((n) => n.key === tab);
            return (
              <div key={grp.key}>
                <button
                  onClick={() => toggleGroup(grp.key)}
                  style={{
                    width: "100%",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "space-between",
                    gap: 10,
                    textAlign: "right",
                    background: "transparent",
                    border: "none",
                    borderRight: "3px solid transparent",
                    color: "#D9CBB2",
                    padding: "12px 10px",
                    borderRadius: 6,
                    fontSize: 14,
                    fontWeight: 600,
                    cursor: "pointer",
                  }}
                >
                  <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <span style={{ fontSize: 15, color: COLORS.goldLight }}>{grp.icon}</span>
                    {t(grp.label, grp.labelEn)}
                  </span>
                  <span
                    style={{
                      fontSize: 11,
                      color: COLORS.goldLight,
                      transition: "transform 0.15s ease",
                      transform: isOpen ? "rotate(90deg)" : "rotate(0deg)",
                    }}
                  >
                    ◂
                  </span>
                </button>
                {isOpen && (
                  <div
                    style={{
                      display: "flex",
                      flexDirection: "column",
                      gap: 2,
                      paddingInlineEnd: 14,
                      marginBottom: 2,
                    }}
                  >
                    {groupItems.map((n) => (
                      <button
                        key={n.key}
                        onClick={() => {
                          setTab(n.key);
                          if (isMobile) setNavOpen(false);
                        }}
                        style={{
                          display: "flex",
                          alignItems: "center",
                          gap: 8,
                          textAlign: "right",
                          background: tab === n.key ? "rgba(216,168,90,0.18)" : "transparent",
                          border: "none",
                          borderRight: tab === n.key ? `3px solid ${COLORS.gold}` : "3px solid transparent",
                          color: tab === n.key ? "#fff" : "#C9BB9E",
                          padding: "10px 10px",
                          borderRadius: 6,
                          fontSize: 13,
                          fontWeight: tab === n.key ? 700 : 500,
                          cursor: "pointer",
                        }}
                      >
                        <span style={{ fontSize: 13, color: COLORS.goldLight }}>{n.icon}</span>
                        {t(n.label, n.labelEn)}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
        </nav>
        <div style={{ marginTop: 30 }}>
          <SaveStatusIcon saving={saving} syncError={syncError} dirty={dirty} onSave={saveNow} />
        </div>
        <div
          style={{
            marginTop: 18,
            paddingTop: 14,
            borderTop: "1px solid rgba(216,168,90,0.25)",
          }}
        >
          <div style={{ fontSize: 12.5, fontWeight: 700, color: "#fff" }}>{currentUser.name}</div>
          <div style={{ fontSize: 10.5, color: COLORS.goldLight, marginTop: 2, marginBottom: 10 }}>
            {roleLabel(currentUser, t)}
            {isBranchManager && ` · ${branchName(currentUser.branchId)}`}
            {isEntityManager && ` · ${entityName(currentUser.entityId)}`}
          </div>
          <button
            onClick={() => setShowChangePassword(true)}
            style={{
              width: "100%",
              background: "transparent",
              border: "1px solid rgba(216,168,90,0.4)",
              color: "#D9CBB2",
              borderRadius: 6,
              padding: "7px 10px",
              fontSize: 12,
              cursor: "pointer",
              marginBottom: 8,
            }}
          >
            {t("🔑 تغيير كلمة المرور", "🔑 Change Password")}
          </button>

/* ============ لوحة التحكم ============ */
function Dashboard({ entities, branches, employees, leaves, vehicles, branchName, entityName }) {
  const { t } = useLang();
  const [alertSearch, setAlertSearch] = useState("");
  const activeCount = employees.filter((e) => e.status === "نشط").length;
  const totalSalaries = employees.filter((e) => e.status === "نشط").reduce((s, e) => s + Number(e.salary || 0), 0);
  const today = new Date().toISOString().slice(0, 10);
  const onLeaveToday = leaves.filter((l) => l.from <= today && l.to >= today).length;

  /* تنبيهات عاجلة: أي ترخيص أو إقامة أو تأمين منتهي أو هينتهي خلال 7 أيام — تشمل الموظفين والفروع والسيارات */
  const isUrgent = (dateStr) => {
    if (!dateStr) return false;
    const st = expiryStatus(dateStr, t);
    return st.days !== null && st.days <= 7;
  };
  const urgentAlerts = [];
  employees
    .filter((e) => e.status === "نشط")
    .forEach((e) => {
      if (isUrgent(e.iqamaExpiry)) urgentAlerts.push({ label: t("إقامة", "Iqama"), name: e.name, sub: branchName(e.branchId), status: expiryStatus(e.iqamaExpiry, t) });
      if (e.nationality !== "سعودي" && isUrgent(e.exitReentryExpiry)) urgentAlerts.push({ label: t("تأشيرة خروج وعودة", "Exit/Re-entry Visa"), name: e.name, sub: branchName(e.branchId), status: expiryStatus(e.exitReentryExpiry, t) });
      if (e.contractType !== "غير محدد المدة" && isUrgent(e.contractEnd)) urgentAlerts.push({ label: t("عقد عمل", "Work Contract"), name: e.name, sub: branchName(e.branchId), status: expiryStatus(e.contractEnd, t) });
      if (isUrgent(e.healthCertExpiry)) urgentAlerts.push({ label: t("شهادة صحية", "Health Certificate"), name: e.name, sub: branchName(e.branchId), status: expiryStatus(e.healthCertExpiry, t) });
      if (isUrgent(e.insuranceExpiry)) urgentAlerts.push({ label: t("تأمين طبي", "Medical Insurance"), name: e.name, sub: branchName(e.branchId), status: expiryStatus(e.insuranceExpiry, t) });
    });
  branches.forEach((b) => {
    if (isUrgent(b.crExpiry)) urgentAlerts.push({ label: t("سجل تجاري", "Commercial Register"), name: b.name, sub: entityName(b.entityId), status: expiryStatus(b.crExpiry, t) });
    if (isUrgent(b.civilDefenseExpiry)) urgentAlerts.push({ label: t("رخصة دفاع مدني", "Civil Defense License"), name: b.name, sub: entityName(b.entityId), status: expiryStatus(b.civilDefenseExpiry, t) });
    if (isUrgent(b.municipalityExpiry)) urgentAlerts.push({ label: t("رخصة بلدية", "Municipality License"), name: b.name, sub: entityName(b.entityId), status: expiryStatus(b.municipalityExpiry, t) });
  });
  (vehicles || []).forEach((v) => {
    if (isUrgent(v.istimaraExpiry)) urgentAlerts.push({ label: t("استمارة سيارة", "Vehicle Registration"), name: v.plateNumber, sub: branchName(v.branchId), status: expiryStatus(v.istimaraExpiry, t) });
    if (isUrgent(v.periodicInspectionExpiry)) urgentAlerts.push({ label: t("فحص دوري", "Periodic Inspection"), name: v.plateNumber, sub: branchName(v.branchId), status: expiryStatus(v.periodicInspectionExpiry, t) });
    if (isUrgent(v.insuranceExpiry)) urgentAlerts.push({ label: t("تأمين سيارة", "Vehicle Insurance"), name: v.plateNumber, sub: branchName(v.branchId), status: expiryStatus(v.insuranceExpiry, t) });
  });
  urgentAlerts.sort((a, b) => a.status.days - b.status.days);
  const alertQ = alertSearch.trim().toLowerCase();
  const matchesAlertSearch = (a) =>
    !alertQ ||
    (a.name || "").toLowerCase().includes(alertQ) ||
    (a.sub || "").toLowerCase().includes(alertQ) ||
    (a.label || "").toLowerCase().includes(alertQ);
  const expiredAlerts = urgentAlerts.filter((a) => a.status.days < 0 && matchesAlertSearch(a));
  const expiringAlerts = urgentAlerts.filter((a) => a.status.days >= 0 && matchesAlertSearch(a));
  const totalAlertsCount = urgentAlerts.length;

  /* تجميع الموظفين حسب الكيان، ثم حسب الفروع التابعة لكل كيان */
  const byEntity = entities.map((ent) => {
    const entBranches = branches
      .filter((b) => b.entityId === ent.id)
      .map((b) => ({
        ...b,
        count: employees.filter((e) => e.branchId === b.id && e.status === "نشط").length,
      }));
    const total = entBranches.reduce((s, b) => s + b.count, 0);
    return { ...ent, branches: entBranches, total };
  });

  /* فروع بلا كيان معروف (احتياطًا لبيانات غير مكتملة) */
  const orphanBranches = branches
    .filter((b) => !entities.some((ent) => ent.id === b.entityId))
    .map((b) => ({ ...b, count: employees.filter((e) => e.branchId === b.id && e.status === "نشط").length }));

  return (
    <div>
      <Header title={t("لوحة التحكم", "Dashboard")} subtitle={t("نظرة عامة على الكيانات والفروع والموظفين", "Overview of entities, branches, and employees")} />
      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 24 }}>
        <ReceiptCard label={t("إجمالي الموظفين النشطين", "Total Active Employees")} value={fmt(activeCount)} sub={t(`من أصل ${fmt(employees.length)} مسجّل`, `of ${fmt(employees.length)} registered`)} />
        <ReceiptCard label={t("إجمالي الرواتب الشهرية", "Total Monthly Salaries")} value={`${fmt(totalSalaries)} ﷼`} tone={COLORS.coffee} />
        <ReceiptCard label={t("عدد الفروع", "Number of Branches")} value={fmt(branches.length)} sub={t(`عبر ${fmt(entities.length)} كيانات`, `across ${fmt(entities.length)} entities`)} />
        <ReceiptCard label={t("في إجازة اليوم", "On Leave Today")} value={fmt(onLeaveToday)} tone={onLeaveToday > 0 ? COLORS.brick : COLORS.green} />
      </div>

      {totalAlertsCount > 0 && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10, flexWrap: "wrap", gap: 10 }}>
          <SectionTitle>{t("التنبيهات", "Alerts")} ({fmt(totalAlertsCount)})</SectionTitle>
          <input
            style={{ ...inputStyle, maxWidth: 260 }}
            placeholder={t("ابحث في التنبيهات بالاسم أو الفرع أو النوع...", "Search alerts by name, branch, or type...")}
            value={alertSearch}
            onChange={(e) => setAlertSearch(e.target.value)}
          />
        </div>
      )}
      {totalAlertsCount > 0 && expiredAlerts.length === 0 && expiringAlerts.length === 0 && (
        <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, marginBottom: 24 }}>
          <Empty text={t("لا توجد تنبيهات مطابقة للبحث", "No alerts match your search")} />
        </div>
      )}

      {expiredAlerts.length > 0 && (
        <>
          <SectionTitle>
            {t("🔴 منتهية بالفعل", "🔴 Already Expired")} ({expiredAlerts.length})
          </SectionTitle>
          <div style={{ background: "#fff", border: `2px solid ${COLORS.brick}`, borderRadius: 10, overflow: "hidden", marginBottom: 24 }}>
            {expiredAlerts.map((a, i) => (
              <div
                key={i}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  padding: "11px 16px",
                  background: "rgba(200,90,70,0.06)",
                  borderTop: i > 0 ? `1px dashed ${COLORS.line}` : "none",
                  flexWrap: "wrap",
                  gap: 8,
                }}
              >
                <div>
                  <div style={{ fontWeight: 700, fontSize: 13 }}>
                    {a.label} — {a.name}
                  </div>
                  <div style={{ fontSize: 11, color: "#8a7a63" }}>{a.sub}</div>
                </div>
                <Stamp tone="brick">{a.status.label}</Stamp>
              </div>
            ))}
          </div>
        </>
      )}

      {expiringAlerts.length > 0 && (
        <>
          <SectionTitle>
            {t("⚠ تنتهي خلال 7 أيام", "⚠ Expiring Within 7 Days")} ({expiringAlerts.length})
          </SectionTitle>
          <div style={{ background: "#fff", border: `1px solid ${COLORS.brick}`, borderRadius: 10, overflow: "hidden", marginBottom: 24 }}>
            {expiringAlerts.map((a, i) => (
              <div
                key={i}
                style={{
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                  padding: "11px 16px",
                  borderTop: i > 0 ? `1px dashed ${COLORS.line}` : "none",
                  flexWrap: "wrap",
                  gap: 8,
                }}
              >
                <div>
                  <div style={{ fontWeight: 700, fontSize: 13 }}>
                    {a.label} — {a.name}
                  </div>
                  <div style={{ fontSize: 11, color: "#8a7a63" }}>{a.sub}</div>
                </div>
                <Stamp tone="gold">{a.status.label}</Stamp>
              </div>
            ))}
          </div>
        </>
      )}

      <SectionTitle>{t("تقسيم الموظفين حسب الكيان والفروع", "Employee Breakdown by Entity & Branch")}</SectionTitle>
      {byEntity.length === 0 && orphanBranches.length === 0 && (
        <Empty text={t("لا توجد كيانات أو فروع بعد — أضف من تبويب الكيانات والفروع", "No entities or branches yet — add one from the Entities & Branches tab")} />
      )}
      {byEntity.map((ent) => (
        <div
          key={ent.id}
          style={{
            background: "#fff",
            border: `1px solid ${COLORS.line}`,
            borderRadius: 10,
            overflow: "hidden",
            marginBottom: 14,
          }}
        >
          <div
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              padding: "12px 16px",
              background: COLORS.paperDark,
              borderBottom: `1px solid ${COLORS.line}`,
            }}
          >
            <div style={{ fontWeight: 800, fontSize: 14, color: COLORS.espresso }}>{ent.name}</div>
            <Stamp tone="green">{fmt(ent.total)} {t("موظف", "employees")}</Stamp>
          </div>
          {ent.branches.length === 0 && <Empty text={t("لا توجد فروع مسجّلة لهذا الكيان", "No branches registered for this entity")} />}
          {ent.branches.map((b, i) => (
            <div
              key={b.id}
              style={{
                display: "flex",
                justifyContent: "space-between",

  nationalId: "",

  branchId: "",
  additionalBranchIds: [],
  position: "",
  salary: "",

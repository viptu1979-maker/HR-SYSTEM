     (face-api.js)، الخرائط (Leaflet)، وتصدير الإكسل (SheetJS). تُحمَّل في الخلفية بعد ظهور شاشة الدخول، وأي كود يحتاجها
     ينتظرها عبر window.__hrLoad(اسم_المكتبة) -->
<script>
  (function () {
    var LIBS = {
      emailjs: { js: "https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" },
      face: { js: "https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js" },
      leaflet: {
        css: "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",
        js: "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
        after: function () {
          /* إصلاح أيقونة العلامة الافتراضية في Leaflet عند تحميلها من CDN */
          if (window.L && window.L.Icon && window.L.Icon.Default) {
            delete window.L.Icon.Default.prototype._getIconUrl;
            window.L.Icon.Default.mergeOptions({
              iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
              iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
              shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
            });
          }
        },
      },
      xlsx: { js: "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" },
    };
    var cache = {};
    window.__hrLoad = function (key) {
      if (cache[key]) return cache[key];
      var lib = LIBS[key];
      if (!lib) return Promise.reject(new Error("unknown lib " + key));
      cache[key] = new Promise(function (resolve, reject) {
        if (lib.css) {
          var l = document.createElement("link");
          l.rel = "stylesheet";
          l.href = lib.css;
          document.head.appendChild(l);
        }
        var sc = document.createElement("script");
        sc.src = lib.js;
        sc.async = true;
        sc.onload = function () {
          try { if (lib.after) lib.after(); } catch (e) {}
          resolve();
        };
        sc.onerror = function () {
          delete cache[key];
          reject(new Error("failed to load " + key));
        };
        document.head.appendChild(sc);
      });
      return cache[key];
    };
    /* تحميل مسبق هادئ في الخلفية بعد اكتمال فتح الصفحة: البريد فورًا (لكود التأكيد عند الدخول)، والوجه بعدها بقليل */
    window.addEventListener("load", function () {
      setTimeout(function () { window.__hrLoad("emailjs").catch(function () {}); }, 300);
      setTimeout(function () { window.__hrLoad("face").catch(function () {}); }, 2500);
    });
  })();
</script>
<style>

    /* لو فيه نافذة طباعة منبثقة مفتوحة (قسيمة راتب، إقرار خصم/سلفة، شهادة موظف، تقرير دوامات الفروع...)،
       نطبع هي بس — نخفي أي "قسم طباعة" تاني في نفس الصفحة (زي جدول الموظفين الكامل اللي كان مفتوح
       خلفها) كان ظاهر جواها بالخلفية. الاعتماد على :has() بس مش كافٍ: (أ) بعض المتصفحات ما تدعمهوش،
       و(ب) حتى لو مدعوم، مجرد وجود قسم طباعة تاني طويل في نفس الصفحة (حتى لو مخفي بـ visibility:hidden
       بس لسه واخد مساحته) بيلخبط حساب المتصفح لعدد الصفحات فيطلع تكرار/تراكب غريب بعد أول صفحة أو
       صفحتين. عشان كده لازم نشيله من "تدفّق الصفحة" تمامًا (display:none) مش بس نخفيه — وده بيتم عن
       طريق class بديل (has-print-section-modal) يُضاف على body تلقائيًا بجافاسكريبت بمجرد ما أي نافذة
       طباعة منبثقة تُفتح، بدون أي اعتماد على أي CSS selector حديث — يشتغل في كل المتصفحات بلا استثناء */
    body:has(.print-section-modal) .print-section:not(.print-section-modal),
    body.has-print-section-modal .print-section:not(.print-section-modal) {

    /* إصلاح "تقرير الطباعة ينقطع/يتراكب بعد أول شاشة تقريبًا" — النافذة المنبثقة (مودال) نفسها
       مبنية بـ position:fixed (تغطية الشاشة) + صندوق داخلي عنده overflow:auto وارتفاع محدود (92vh)
       عشان يظهر بشريط تمرير على الشاشة. المشكلة إن position:fixed بالذات بيخلي المتصفح يحسب طول
       صفحة الطباعة على أساس شاشة واحدة بس مهما طال التقرير الفعلي، فبيقص أي محتوى بعدها بدل ما
       يكمله في صفحة تانية — فلازم وقت الطباعة نلغي كل ده ونخلي المحتوى يتدفّق بشكل طبيعي عبر كل
       الصفحات المطلوبة (نفس مبدأ .print-section نفسها أسفل، لكن مطبَّق على العنصرين الأب والجد له).
       هنا برضه :has() مش مضمون في كل المتصفحات، فنفس الجافاسكريبت اللي بيضيف has-print-section-modal
       بيحط كمان class (print-section-modal-ancestor) على العنصرين الأب والجد فعليًا — بديل مضمون. */
    body:has(.print-section-modal) div:has(> .print-section-modal),
    body:has(.print-section-modal) div:has(> div > .print-section-modal),
    .print-section-modal-ancestor {
      position: static !important;
      inset: auto !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .print-section {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      padding: 0;
      background: #fff !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      max-height: none !important;
      overflow: visible !important;
    }
    .print-section table { overflow: visible !important; }
    /* إصلاح "عمود الاسم ينفصل عن الجدول عند الطباعة ويطلع كشريط عائم لوحده": بعض الجداول (زي جدول
       الموظفين) بتخلي عمود الاسم "ثابت" أثناء التمرير على الشاشة (position: sticky) عشان يفضل ظاهر
       وانت تسحب الجدول يمين/شمال. الـ sticky ده مفيد على الشاشة بس، لكن عند الطباعة مفيش "تمرير"
       أصلًا، وبعض المتصفحات بتفشل تحسب مكانه الصحيح فيطلع منفصل تمامًا عن باقي عمود صفه. نلغي أي
       position ثابت/لاصق/عائم على أي خلية جدول جوه قسم الطباعة، ونضمن كل خلية تتطبع في مكانها
       الطبيعي جوه صفها بس */
    .print-section td, .print-section th {
      position: static !important;
      inset: auto !important;
      z-index: auto !important;
      box-shadow: none !important;
    }
    .no-print { display: none !important; }

    /* رأس التقرير المطبوع: يحل محل شريط المتصفح (بدون رابط/تاريخ/رقم صفحة تلقائي) */
    .print-only-title {

    /* الجدول: حدود واضحة، تكرار الترويسة، منع قطع الصفوف بين الصفحات */

    /* تذييل رقم الصفحة داخل محتوى الطباعة نفسه (وليس تذييل المتصفح) */

  /* على الشاشات الضيقة فقط (مش عند الطباعة): تحويل الجداول العريضة (class="responsive-table") إلى كروت

<script>

<script>
const { useState, useEffect, useMemo, useRef, useContext, createContext } = React;
const db = window.__hrDb;
const auth = window.__hrAuth;
const secondaryAuth = window.__hrSecondaryAuth;
const storage = window.__hrStorage;
/* إصلاح "خطأ في صفحة الطباعة" (تقرير دوامات الفروع بيطلع عمود الاسم منفصل/متكرر وملخبط): بنعتمد
   أساسًا على CSS (:has()) عشان (أ) نخفي أي "قسم طباعة" تاني وقت ما نافذة طباعة منبثقة تكون مفتوحة،
   و(ب) نلغي position:fixed/overflow:auto بتاع صندوق النافذة المنبثقة نفسها عشان الطباعة تتدفق بشكل
   طبيعي عبر كل الصفحات. لكن ده مش مضمون في كل المتصفحات/طرق الطباعة. هنا نضيف طريقة بديلة تشتغل في
   أي متصفح: نراقب الصفحة بـ MutationObserver، وبمجرد ما أي نافذة طباعة منبثقة (className تحتوي
   print-section-modal) تظهر في الصفحة: (1) نضيف class اسمه has-print-section-modal على body — الـ
   CSS فوق بيستخدمه كبديل مضمون لإخفاء أي قسم طباعة تاني تمامًا من تدفّق الصفحة (display:none، مش
   بس visibility:hidden) عشان ما يأثرش على حساب عدد صفحات الطباعة أصلًا ويسبب تكرار/تراكب؛
   (2) نحط class اسمه print-section-modal-ancestor على العنصرين الأب والجد الفعليين للنافذة (بدل
   الاعتماد على :has() لايجادهم) عشان نلغي position:fixed/overflow:auto بتاعهم بنفس الطريقة. والعكس
   لما النافذة تتقفل — نشيل الكلاسات دي كلها. */
if (typeof document !== "undefined" && typeof MutationObserver !== "undefined") {
    const PRINT_MODAL_ANCESTOR_CLASS = "print-section-modal-ancestor";
    const syncPrintModalBodyClass = () => {
        document.querySelectorAll("." + PRINT_MODAL_ANCESTOR_CLASS).forEach((el) => el.classList.remove(PRINT_MODAL_ANCESTOR_CLASS));
        const modalEl = document.querySelector(".print-section-modal");
        document.body.classList.toggle("has-print-section-modal", !!modalEl);
        if (modalEl) {
            const parent = modalEl.parentElement;
            const grandparent = parent && parent.parentElement;
            if (parent)
                parent.classList.add(PRINT_MODAL_ANCESTOR_CLASS);
            if (grandparent)
                grandparent.classList.add(PRINT_MODAL_ANCESTOR_CLASS);
        }
    };
    const startPrintModalObserver = () => {
        syncPrintModalBodyClass();
        new MutationObserver(syncPrintModalBodyClass).observe(document.body, { childList: true, subtree: true });
    };
    if (document.body)
        startPrintModalObserver();
    else
        document.addEventListener("DOMContentLoaded", startPrintModalObserver);
}
const DATA_DOC = db.collection("hrSystem").doc("data");
const USERS_DOC = db.collection("hrSystem").doc("users");
const LOG_DOC = db.collection("hrSystem").doc("activityLog");
/* نسخ احتياطية يومية تلقائية لكل بيانات النظام (تشمل الموظفين وحسابات الدخول معًا) — حماية من أي حذف
   أو تعديل بالغلط سواء من داخل النظام أو من Firestore Console مباشرة */
const BACKUPS_COLLECTION = db.collection("hrSystemBackups");
const BACKUP_RETENTION_DAYS = 14;
/* فهرس صغير ومنفصل: مستند لكل حساب دخول مُرحَّل لـ Firebase Authentication (authUid) يخزّن دوره الوظيفي
   بس (admin/manager/employee...) — بدون أي اسم أو كلمة مرور أو بيانات حساسة. الهدف منه: تمكين قواعد
   أمان Firestore من التأكد "هل الشخص اللي بيكتب أدمن فعلاً؟" بسرعة وبأمان، من غير ما تحتاج تفتح ملف
   حسابات الدخول الكامل (اللي فيه كل كلمات المرور) عشان تعرف بس دور شخص واحد. ده الأساس اللازم لتشديد
   صلاحيات حذف النسخ الاحتياطية ومنع أي حساب غير أدمن من ترقية نفسه لأدمن مباشرة عبر الكتابة في
   Firestore. ملاحظة مهمة: هذا وحده ما يمنعش بعد شخص "موظف" من قراءة ملف حسابات الدخول الكامل (بما فيه
   كلمات مرور الكل) — ده يحتاج خطوة تانية أكبر (تقسيم حسابات الدخول لملف منفصل لكل حساب) لسه ما
   اتعملتش، وده موضّح للمستخدمة بشكل صريح */
const USER_ROLES_COLLECTION = db.collection("userRoles");
/* تحديث/إنشاء مستند الدور لحساب معيّن — تُستدعى فورًا كل ما يترحّل حساب لأول مرة لـ Firebase
   Authentication، أو يتغيّر دوره الوظيفي من شاشة "المستخدمون والصلاحيات". فشل صامت (best-effort): لو
   فشلت الكتابة هنا لأي سبب (مثلاً قبل ما تُنشر قواعد الأمان الجديدة أصلًا)، ده ما يأثرش على حفظ
   الحساب نفسه في النظام — بس معناه إن قواعد الأمان الجديدة لسه ما هتعرفش دور هذا الحساب لحد ما تنجح
   هذه الكتابة لاحقًا (تلقائيًا في المرة الجاية، أو لما الأدمن تفتح شاشة المستخدمين تاني).
   accountId (اختياري): معرّف سجل الحساب الداخلي (نفس u.id) — يُخزَّن هنا كمان عشان قواعد الأمان تقدر
   تتأكد "هل هذا المستند في userCredentials ملك هذا الحساب نفسه؟" بدون الحاجة لفحص مصفوفة المستخدمين
   كاملة (CEL ما يدعمش البحث داخل مصفوفة بشرط على حقل فرعي) */
const syncUserRoleDoc = (authUid, role, accountId) => {
    if (!authUid || !role)
        return;
    const payload = { role };
    if (accountId)
        payload.accountId = accountId;
    USER_ROLES_COLLECTION.doc(authUid)
        .set(payload, { merge: true })
        .catch(() => { });
};
/* مسح مستند الدور عند حذف حساب دخول نهائيًا — عشان لو حصل وفضل حساب Firebase Authentication شغّال
   (حذف حساب من هذا النظام ما بيمسحش حساب Firebase Authentication المقابل له تلقائيًا، قيد معروف)،

function compressImage(file, maxDim = 900, quality = 0.72) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error);
        reader.onload = () => {
            const img = new Image();
            img.onerror = () => reject(new Error("IMAGE_LOAD_FAILED"));
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    if (width >= height) {
                        height = Math.round((height * maxDim) / width);
                        width = maxDim;
                    }
                    else {
                        width = Math.round((width * maxDim) / height);
                        height = maxDim;
                    }
                }
                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.src = reader.result;
        };
        reader.readAsDataURL(file);

function LeaveRequestsTab({ employees, leaveRequests, isEntityManager, isFinalApprover, onPreliminaryApprove, onPreliminaryReject, onFinalApprove, onFinalReject, branchName }) {
  const { t } = useLang();
  const empName = (id) => employees.find((e) => e.id === id)?.name || t("موظف محذوف", "Deleted employee");

  const pendingPreliminary = leaveRequests.filter((r) => r.status === "قيد المراجعة");
  const pendingFinal = leaveRequests.filter((r) => r.status === "موافقة مبدئية");
  const history = leaveRequests.filter((r) => ["مرفوضة من مدير الكيان", "موافقة نهائية", "مرفوضة نهائيًا"].includes(r.status));

  const statusTone = (s) =>
    s === "موافقة نهائية" ? "green" : s === "موافقة مبدئية" ? "gold" : s === "قيد المراجعة" ? "gold" : "brick";

  const RequestRow = ({ r, actions }) => (
    <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
        <div>
          <div style={{ fontWeight: 700, color: COLORS.espresso, fontSize: 13.5 }}>{empName(r.employeeId)}</div>
          <div style={{ fontSize: 11.5, color: "#8a7a63", marginTop: 2 }}>{branchName(r.employeeId)}</div>
          <div style={{ fontSize: 12.5, marginTop: 6 }}>
            {trLabel(t, LEAVE_TYPE_LABELS_EN, r.type)} — <span style={{ fontFamily: "Consolas, monospace" }}>{r.from} → {r.to}</span>
          </div>
          {r.note && <div style={{ fontSize: 11.5, color: "#8a7a63", marginTop: 4 }}>{r.note}</div>}
        </div>
        <Stamp tone={statusTone(r.status)}>{trLabel(t, LEAVE_REQUEST_STATUS_LABELS_EN, r.status)}</Stamp>
      </div>
      {actions && <div style={{ display: "flex", gap: 8, marginTop: 10 }}>{actions}</div>}
    </div>
  );

  return (
    <div>
      <Header title={t("طلبات الإجازات", "Leave Requests")} subtitle={t("موافقة مبدئية من مدير الكيان، ثم موافقة نهائية من الأدمن/المسؤول العام", "Preliminary approval by the entity manager, then final approval by the admin/general manager")} />

      {isEntityManager && (
        <>
          <SectionTitle>{t("بانتظار الموافقة المبدئية", "Awaiting Preliminary Approval")} ({pendingPreliminary.length})</SectionTitle>
          {pendingPreliminary.length === 0 && <Empty text={t("لا توجد طلبات بانتظار الموافقة المبدئية", "No requests awaiting preliminary approval")} />}
          {pendingPreliminary.map((r) => (
            <RequestRow
              key={r.id}
              r={r}
              actions={
                <>
                  <Btn small onClick={() => onPreliminaryApprove(r.id)}>{t("✔ موافقة مبدئية", "✔ Preliminary Approve")}</Btn>
                  <Btn small tone="danger" onClick={() => onPreliminaryReject(r.id)}>{t("✕ رفض", "✕ Reject")}</Btn>
                </>
              }
            />
          ))}
        </>
      )}

      {isFinalApprover && (
        <>
          <SectionTitle>{t("بانتظار الموافقة النهائية", "Awaiting Final Approval")} ({pendingFinal.length})</SectionTitle>
          {pendingFinal.length === 0 && <Empty text={t("لا توجد طلبات بانتظار الموافقة النهائية", "No requests awaiting final approval")} />}
          {pendingFinal.map((r) => (
            <RequestRow
              key={r.id}
              r={r}
              actions={
                <>
                  <Btn small onClick={() => onFinalApprove(r.id)}>{t("✔ موافقة نهائية", "✔ Final Approve")}</Btn>
                  <Btn small tone="danger" onClick={() => onFinalReject(r.id)}>{t("✕ رفض", "✕ Reject")}</Btn>
                </>
              }
            />
          ))}
          {!isEntityManager && (
            <>
              <SectionTitle>{t("بانتظار الموافقة المبدئية (لدى مدير الكيان)", "Awaiting Preliminary Approval (with Entity Manager)")} ({pendingPreliminary.length})</SectionTitle>
              {pendingPreliminary.length === 0 && <Empty text={t("لا توجد طلبات", "No requests")} />}
              {pendingPreliminary.map((r) => <RequestRow key={r.id} r={r} />)}
            </>
          )}
        </>
      )}

      <SectionTitle>{t("السجل", "History")} ({history.length})</SectionTitle>
      {history.length === 0 && <Empty text={t("لا يوجد سجل بعد", "No history yet")} />}
      {history.map((r) => <RequestRow key={r.id} r={r} />)}
    </div>
  );
}

function TasksTab({ employees, branches, tasks, onAddTask, onUpdateTaskStatus, onRemoveTask, onAddTaskComment, onAddTaskPhotos, onRemoveTaskPhoto, branchName }) {
  const { t } = useLang();
  const [form, setForm] = useState({ employeeId: "", title: "", description: "", from: new Date().toISOString().slice(0, 10), to: "" });
  const [statusFilter, setStatusFilter] = useState("");
  const [branchFilter, setBranchFilter] = useState("");
  const [commentDrafts, setCommentDrafts] = useState({});
  const [photoBusy, setPhotoBusy] = useState({});
  const [lightbox, setLightbox] = useState(null);
  const empName = (id) => employees.find((e) => e.id === id)?.name || t("موظف محذوف", "Deleted employee");
  const todayISO = new Date().toISOString().slice(0, 10);

  const handlePhotoUpload = async (taskId, files) => {
    if (!files || files.length === 0) return;
    setPhotoBusy((p) => ({ ...p, [taskId]: true }));
    try {
      const dataUrls = await Promise.all(Array.from(files).map((f) => compressImage(f, 900, 0.7)));
      onAddTaskPhotos && onAddTaskPhotos(taskId, dataUrls);
    } catch (err) {
      /* تجاهل الأخطاء الفردية لملفات غير صالحة */
    }
    setPhotoBusy((p) => ({ ...p, [taskId]: false }));
  };

  const submit = () => {
    if (!form.employeeId || !form.title.trim() || !form.to) return;
    onAddTask && onAddTask({ ...form, title: form.title.trim(), description: form.description.trim() });
    setForm({ employeeId: form.employeeId, title: "", description: "", from: new Date().toISOString().slice(0, 10), to: "" });
  };

  const effectiveStatus = (ts) => (ts.status !== "مكتملة" && ts.to && ts.to < todayISO ? "متأخرة" : ts.status);
  const statusTone = (s) => (s === "مكتملة" ? "green" : s === "متأخرة" ? "brick" : "gold");

  const filteredEmployees = branchFilter ? employees.filter((e) => e.branchId === branchFilter) : employees;

  const visibleTasks = tasks
    .filter((ts) => !branchFilter || employees.find((e) => e.id === ts.employeeId)?.branchId === branchFilter)
    .filter((ts) => !statusFilter || effectiveStatus(ts) === statusFilter)
    .slice()
    .sort((a, b) => (a.assignedAt < b.assignedAt ? 1 : -1));

  const openCount = tasks.filter((ts) => effectiveStatus(ts) === "قيد التنفيذ").length;
  const overdueCount = tasks.filter((ts) => effectiveStatus(ts) === "متأخرة").length;
  const doneCount = tasks.filter((ts) => effectiveStatus(ts) === "مكتملة").length;

  return (
    <div>
      <Header title={t("مهام الموظفين", "Employee Tasks")} subtitle={t("إسناد المهام للموظفين وتحديد فترة الإنجاز ومتابعة حالتها", "Assign tasks to employees, set the completion period, and track their status")} />

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
        <ReceiptCard label={t("قيد التنفيذ", "In Progress")} value={fmt(openCount)} tone={COLORS.gold} />
        <ReceiptCard label={t("متأخرة", "Overdue")} value={fmt(overdueCount)} tone={COLORS.brick} />
        <ReceiptCard label={t("مكتملة", "Completed")} value={fmt(doneCount)} tone={COLORS.green} />
      </div>

      <SectionTitle className="no-print">{t("إسناد مهمة جديدة", "Assign a New Task")}</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 16, marginBottom: 10 }} className="no-print">
        <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
          <Field label={t("الموظف", "Employee")}>
            <EmployeeSelect employees={employees} value={form.employeeId} onChange={(id) => setForm({ ...form, employeeId: id })} />
          </Field>
          <Field label={t("عنوان المهمة", "Task Title")}>
            <input type="text" style={inputStyle} value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />
          </Field>
          <Field label={t("من تاريخ", "From")}>
            <DateField style={inputStyle} value={form.from} onChange={(v) => setForm({ ...form, from: v })} />
          </Field>
          <Field label={t("إلى تاريخ (موعد الإنجاز)", "To (Due Date)")}>
            <DateField style={inputStyle} value={form.to} onChange={(v) => setForm({ ...form, to: v })} />
          </Field>
        </div>
        <div style={{ marginTop: 10 }}>
          <Field label={t("وصف المهمة (اختياري)", "Task Description (optional)")}>
            <textarea
              style={{ ...inputStyle, width: "100%", minHeight: 60, resize: "vertical", fontFamily: "inherit" }}

              onChange={(e) => setForm({ ...form, description: e.target.value })}

          </Field>
        </div>
        <div style={{ marginTop: 10, display: "flex", justifyContent: "flex-end" }}>
          <Btn onClick={submit}>{t("📌 إسناد المهمة", "📌 Assign Task")}</Btn>
        </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "flex-end", marginBottom: 10 }} className="no-print">
        <Field label={t("تصفية بالفرع", "Filter by Branch")}>
          <select style={inputStyle} value={branchFilter} onChange={(e) => setBranchFilter(e.target.value)}>

        <Field label={t("تصفية بالحالة", "Filter by Status")}>

            <option value="">{t("كل الحالات", "All Statuses")}</option>
            <option value="قيد التنفيذ">{t("قيد التنفيذ", "In Progress")}</option>
            <option value="متأخرة">{t("متأخرة", "Overdue")}</option>
            <option value="مكتملة">{t("مكتملة", "Completed")}</option>

            <Empty text={t("لا توجد مهام مسجّلة", "No tasks registered")} />
          </div>
        )}

          const st = effectiveStatus(ts);
          return (
            <div key={ts.id} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 14, marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
                <div>
                  <div style={{ fontWeight: 700, color: COLORS.espresso, fontSize: 13.5 }}>{ts.title}</div>
                  <div style={{ fontSize: 11.5, color: "#8a7a63", marginTop: 2 }}>{empName(ts.employeeId)} · {branchName(ts.employeeId)}</div>
                  <div style={{ fontSize: 12.5, marginTop: 6, fontFamily: "Consolas, monospace" }}>{ts.from} → {ts.to}</div>
                  {ts.description && <div style={{ fontSize: 12, color: "#5a4c38", marginTop: 6 }}>{ts.description}</div>}
                  <div style={{ fontSize: 10.5, color: "#a3927a", marginTop: 6 }}>{t("أُسندت بواسطة", "Assigned by")}: {ts.assignedBy || "—"}</div>
                </div>
                <Stamp tone={statusTone(st)}>{trLabel(t, TASK_STATUS_LABELS_EN, st)}</Stamp>
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 10 }} className="no-print">
                {ts.status !== "مكتملة" ? (
                  <Btn small onClick={() => onUpdateTaskStatus(ts.id, "مكتملة")}>{t("✔ تمييز كمكتملة", "✔ Mark Completed")}</Btn>
                ) : (
                  <Btn small tone="secondary" onClick={() => onUpdateTaskStatus(ts.id, "قيد التنفيذ")}>{t("↺ إعادة فتح", "↺ Reopen")}</Btn>
                )}
                <Btn small tone="danger" onClick={() => onRemoveTask(ts.id)}>{t("✕ حذف", "✕ Delete")}</Btn>
              </div>

              <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${COLORS.line}` }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.coffee, marginBottom: 6 }}>
                  {t("توثيق الإنجاز (صور)", "Completion Documentation (Photos)")} {ts.completionPhotos && ts.completionPhotos.length > 0 ? `(${ts.completionPhotos.length})` : ""}
                </div>
                {(ts.completionPhotos || []).length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                    {ts.completionPhotos.map((photo, idx) => (
                      <div key={idx} style={{ position: "relative" }}>
                        <img
                          src={photo}
                          alt=""
                          onClick={() => setLightbox(photo)}
                          style={{ width: 64, height: 64, objectFit: "cover", borderRadius: 8, border: `1px solid ${COLORS.line}`, cursor: "pointer" }}
                        />
                        <button
                          className="no-print"
                          onClick={() => onRemoveTaskPhoto(ts.id, idx)}
                          style={{ position: "absolute", top: -6, right: -6, width: 18, height: 18, borderRadius: "50%", background: COLORS.brick, color: "#fff", border: "none", fontSize: 11, lineHeight: "18px", cursor: "pointer", padding: 0 }}
                          title={t("حذف الصورة", "Delete photo")}
                        >
                          ✕
                        </button>
                      </div>
                    ))}
                  </div>
                )}
                <input
                  type="file"
                  accept="image/*"
                  multiple
                  disabled={!!photoBusy[ts.id]}
                  className="no-print"
                  style={{ ...inputStyle, padding: "6px 8px", fontSize: 11.5, maxWidth: 240 }}
                  onChange={(e) => {
                    handlePhotoUpload(ts.id, e.target.files);
                    e.target.value = "";
                  }}
                />
                {photoBusy[ts.id] && <div style={{ fontSize: 11, color: "#a3927a", marginTop: 4 }}>{t("جارِ رفع الصور...", "Uploading photos...")}</div>}
              </div>

              <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px dashed ${COLORS.line}` }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: COLORS.coffee, marginBottom: 6 }}>
                  {t("التعليقات", "Comments")} {ts.comments && ts.comments.length > 0 ? `(${ts.comments.length})` : ""}
                </div>
                {(ts.comments || []).length === 0 && (
                  <div style={{ fontSize: 11.5, color: "#a3927a", marginBottom: 6 }}>{t("لا توجد تعليقات بعد", "No comments yet")}</div>
                )}
                {(ts.comments || []).map((c) => (
                  <div key={c.id} style={{ fontSize: 12, background: COLORS.paperDark, borderRadius: 8, padding: "6px 10px", marginBottom: 6 }}>
                    <div>{c.text}</div>
                    <div style={{ fontSize: 10, color: "#a3927a", marginTop: 3 }}>{c.author} · {new Date(c.at).toLocaleString(t("ar-SA-u-nu-latn", "en-US"))}</div>
                  </div>
                ))}
                <div style={{ display: "flex", gap: 6 }} className="no-print">
                  <input
                    type="text"
                    style={{ ...inputStyle, flex: 1 }}
                    placeholder={t("أضف تعليقًا...", "Add a comment...")}
                    value={commentDrafts[ts.id] || ""}
                    onChange={(e) => setCommentDrafts({ ...commentDrafts, [ts.id]: e.target.value })}
                    onKeyDown={(e) => {
                      if (e.key === "Enter" && (commentDrafts[ts.id] || "").trim()) {
                        onAddTaskComment(ts.id, commentDrafts[ts.id]);
                        setCommentDrafts({ ...commentDrafts, [ts.id]: "" });
                      }
                    }}
                  />
                  <Btn
                    small
                    onClick={() => {
                      if (!(commentDrafts[ts.id] || "").trim()) return;
                      onAddTaskComment(ts.id, commentDrafts[ts.id]);
                      setCommentDrafts({ ...commentDrafts, [ts.id]: "" });
                    }}
                  >
                    {t("إرسال", "Send")}
                  </Btn>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {lightbox && (
        <div
          onClick={() => setLightbox(null)}
          style={{ position: "fixed", inset: 0, background: "rgba(36,24,17,0.75)", zIndex: 80, display: "flex", alignItems: "center", justifyContent: "center", padding: 20, cursor: "zoom-out" }}
        >
          <img src={lightbox} alt="" style={{ maxWidth: "92vw", maxHeight: "92vh", borderRadius: 8, boxShadow: "0 20px 60px rgba(0,0,0,0.4)" }} />
        </div>
      )}
    </div>
  );
}


/* ============ رسائل للموظفين ============ */
function MessagesTab({ employees, branches, messages, onSendMessage, onRemoveMessage, canBroadcastAll = true }) {
  const { t } = useLang();
  const [scope, setScope] = useState("employee");
  const [employeeId, setEmployeeId] = useState("");
  const [branchId, setBranchId] = useState("");
  const [text, setText] = useState("");
  const [err, setErr] = useState("");
  const [expandedId, setExpandedId] = useState(null);
  const [copiedId, setCopiedId] = useState("");

  const activeEmployees = employees.filter((e) => e.status === "نشط");

  const recipientsOf = (m) => {
    if (m.scope === "employee") return activeEmployees.filter((e) => e.id === m.employeeId);
    if (m.scope === "branch") return activeEmployees.filter((e) => e.branchId === m.branchId);
    return activeEmployees;
  };

  const scopeLabel = (m) => {
    if (m.scope === "employee") return employees.find((e) => e.id === m.employeeId)?.name || t("موظف محذوف", "Deleted employee");
    if (m.scope === "branch") return branches.find((b) => b.id === m.branchId)?.name || "—";
    return t("كل الموظفين", "All Employees");
  };

  const waLink = (phone, body) => {
    const digits = (phone || "").replace(/[^\d]/g, "");
    const withCountry = digits.startsWith("966") ? digits : digits.startsWith("0") ? `966${digits.slice(1)}` : `966${digits}`;
    return `https://wa.me/${withCountry}?text=${encodeURIComponent(body)}`;
  };

  /* واتساب لا يسمح تقنيًا بإرسال جماعي تلقائي من موقع ويب بدون WhatsApp Business API مدفوع من ميتا —
     هذا قيد من واتساب نفسه ضد السبام. البديل العملي: نسخ الرسالة وكل الأرقام دفعة واحدة،
     عشان تنشئ "قائمة بث" (Broadcast List) مرة واحدة في واتساب على جوالك، وبعدها أي رسالة
     تدوس عليها إرسال واحدة بس بتوصل لكل اللي في القائمة، بدل ما تفتح 35 محادثة لوحدها */
  const copyText = async (value, id) => {
    try {
      await navigator.clipboard.writeText(value);
      setCopiedId(id);
      setTimeout(() => setCopiedId(""), 2000);
    } catch (e) {
      /* تجاهل فشل النسخ (مثلاً متصفح قديم) */
    }
  };

  const submit = () => {
    setErr("");
    if (!text.trim()) {
      setErr(t("اكتب نص الرسالة", "Please write the message text"));
      return;
    }
    if (scope === "employee" && !employeeId) {
      setErr(t("اختر الموظف المرسَل إليه", "Please select the employee to send to"));
      return;
    }
    if (scope === "branch" && !branchId) {
      setErr(t("اختر الفرع المرسَل إليه", "Please select the branch to send to"));
      return;
    }
    onSendMessage({ scope, employeeId: scope === "employee" ? employeeId : "", branchId: scope === "branch" ? branchId : "", text: text.trim() });
    setText("");
    setEmployeeId("");
    setBranchId("");
  };

  return (
    <div>
      <Header
        title={t("الرسائل", "Messages")}
        subtitle={t(
          "إرسال رسائل إعلامية للموظفين — تظهر لهم في صفحتهم الذاتية، مع إمكانية إرسالها كمان عبر واتساب",
          "Send notice messages to employees — visible in their self-service page, with a WhatsApp send option too"
        )}
      />

      <div
        style={{
          background: "#FAF6EC",
          border: `1px dashed ${COLORS.line}`,
          borderRadius: 10,
          padding: "10px 14px",
          fontSize: 11.5,
          color: "#8a7a63",
          marginBottom: 18,
        }}
      >
        ℹ️{" "}
        {t(
          "واتساب لا يسمح بإرسال جماعي تلقائي من موقع ويب (قيد من واتساب نفسه ضد السبام) — لازم تدوس \"إرسال\" داخل واتساب لكل شخص بنفسك. لتسهيل إرسال نفس الرسالة لعدد كبير: انسخ نص الرسالة وأرقام الجوال (زر \"نسخ الأرقام\" تحت كل رسالة) وأنشئ \"قائمة بث\" في واتساب على جوالك مرة واحدة — بعدها أي رسالة تبعتها للقائمة توصل للكل بضغطة واحدة.",
          "WhatsApp doesn't allow automated bulk sending from a website (a WhatsApp anti-spam restriction) — you must tap \"Send\" inside WhatsApp for each person yourself. To make sending to many people easier: copy the message text and phone numbers (\"Copy Numbers\" button under each message) and create a WhatsApp \"Broadcast List\" on your phone once — after that, any message you send to the list reaches everyone with a single tap."
        )}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 22 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: COLORS.espresso }}>
          {t("رسالة جديدة", "New Message")}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label={t("المرسَل إليهم", "Recipients")}>
            <select
              style={inputStyle}
              value={scope}
              onChange={(e) => {
                setScope(e.target.value);
                setEmployeeId("");
                setBranchId("");
              }}
            >
              <option value="employee">{t("موظف واحد", "A single employee")}</option>
              <option value="branch">{t("كل موظفي فرع", "All employees of a branch")}</option>
              {canBroadcastAll && <option value="all">{t("كل الموظفين", "All employees")}</option>}
            </select>
          </Field>
          {scope === "employee" && (
            <Field label={t("الموظف", "Employee")}>
              <EmployeeSelect employees={activeEmployees} value={employeeId} onChange={setEmployeeId} />
            </Field>
          )}
          {scope === "branch" && (
            <Field label={t("الفرع", "Branch")}>
              <select style={inputStyle} value={branchId} onChange={(e) => setBranchId(e.target.value)}>
                <option value="">{t("اختر الفرع", "Select branch")}</option>
                {branches.map((b) => (
                  <option key={b.id} value={b.id}>{b.name}</option>
                ))}
              </select>
            </Field>
          )}
        </div>
        <div style={{ marginTop: 12 }}>
          <Field label={t("نص الرسالة", "Message Text")}>
            <textarea
              style={{ ...inputStyle, minHeight: 90, resize: "vertical", fontFamily: "inherit" }}
              value={text}
              onChange={(e) => setText(e.target.value)}
              placeholder={t("اكتب الرسالة هنا...", "Write the message here...")}
            />
          </Field>
        </div>
        {err && <div style={{ color: COLORS.brick, fontSize: 12, marginTop: 10 }}>{err}</div>}
        <div style={{ marginTop: 14 }}>
          <Btn onClick={submit}>{t("إرسال الرسالة", "Send Message")}</Btn>
        </div>
      </div>

      <SectionTitle>{t("الرسائل المرسَلة", "Sent Messages")} ({fmt(messages.length)})</SectionTitle>
      {messages.length === 0 && (
        <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10 }}>
          <Empty text={t("لا توجد رسائل مرسَلة بعد", "No messages sent yet")} />
        </div>
      )}
      <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
        {messages.map((m) => {
          const recipients = recipientsOf(m);
          const readCount = (m.readBy || []).length;
          const expanded = expandedId === m.id;
          return (
            <div key={m.id} style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 14 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10, flexWrap: "wrap" }}>
                <div style={{ flex: 1, minWidth: 200 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
                    <Stamp>{scopeLabel(m)}</Stamp>
                    <span style={{ fontSize: 11, color: "#a3927a" }}>
                      {new Date(m.sentAt).toLocaleString(t("ar-SA-u-nu-latn", "en-US"))} · {t("بواسطة", "by")} {m.sentBy}
                    </span>
                  </div>
                  <div style={{ marginTop: 8, fontSize: 13, color: COLORS.ink, whiteSpace: "pre-wrap" }}>{m.text}</div>
                  <div style={{ marginTop: 6, fontSize: 11.5, color: "#8a7a63" }}>
                    {t(`قرأها ${readCount} من ${recipients.length}`, `Read by ${readCount} of ${recipients.length}`)}
                  </div>
                </div>
                <div style={{ display: "flex", gap: 6, flexShrink: 0, flexWrap: "wrap" }}>
                  <Btn small tone="secondary" onClick={() => copyText(m.text, `text-${m.id}`)}>
                    {copiedId === `text-${m.id}` ? t("✓ اتنسخت", "✓ Copied") : t("نسخ الرسالة", "Copy Message")}
                  </Btn>
                  <Btn
                    small
                    tone="secondary"
                    onClick={() =>
                      copyText(
                        recipients.filter((e) => e.phone).map((e) => e.phone).join("\n"),
                        `nums-${m.id}`
                      )
                    }
                  >
                    {copiedId === `nums-${m.id}` ? t("✓ اتنسخت", "✓ Copied") : t("نسخ الأرقام", "Copy Numbers")}
                  </Btn>
                  <Btn small tone="secondary" onClick={() => setExpandedId(expanded ? null : m.id)}>
                    {t("واتساب", "WhatsApp")}
                  </Btn>
                  <Btn small tone="danger" onClick={() => onRemoveMessage(m.id)}>{t("حذف", "Delete")}</Btn>
                </div>
              </div>
              {expanded && (
                <div style={{ marginTop: 12, paddingTop: 12, borderTop: `1px dashed ${COLORS.line}` }}>
                  <div style={{ fontSize: 11, color: "#a3927a", marginBottom: 8 }}>
                    {t(
                      "كل زر بيفتح واتساب برسالة جاهزة لهذا الموظف — لازم تدوس \"إرسال\" جوه واتساب بنفسك لكل واحد.",
                      "Each button opens WhatsApp with the message pre-filled for that employee — you must tap \"Send\" inside WhatsApp yourself for each one."
                    )}
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {recipients.length === 0 && (
                    <span style={{ fontSize: 11.5, color: "#a3927a" }}>{t("لا يوجد مستلمون", "No recipients")}</span>
                  )}
                  {recipients.map((e) =>
                    e.phone ? (
                      <a
                        key={e.id}
                        href={waLink(e.phone, m.text)}
                        target="_blank"
                        rel="noopener noreferrer"
                        style={{
                          display: "inline-flex",
                          alignItems: "center",
                          gap: 6,
                          padding: "6px 11px",
                          borderRadius: 7,
                          fontSize: 12,
                          fontWeight: 700,
                          textDecoration: "none",
                          border: `1px solid ${COLORS.line}`,
                          color: COLORS.green,
                          background: COLORS.greenBg,
                        }}
                      >
                        📲 {e.name}
                      </a>
                    ) : (
                      <span
                        key={e.id}
                        style={{ padding: "6px 11px", borderRadius: 7, fontSize: 12, color: "#a3927a", border: `1px dashed ${COLORS.line}` }}
                      >
                        {e.name} ({t("بدون جوال", "no phone")})
                      </span>
                    )
                  )}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function LeaveRequestForm({ onSubmit, t }) {
  const [form, setForm] = useState({ type: "سنوية", from: "", to: "", note: "" });
  const [sent, setSent] = useState(false);

  const submit = () => {
    if (!form.from || !form.to) return;
    onSubmit && onSubmit(form);
    setForm({ type: "سنوية", from: "", to: "", note: "" });
    setSent(true);
    setTimeout(() => setSent(false), 2500);
  };

  return (
    <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 16, marginBottom: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
        <Field label={t("نوع الإجازة", "Leave Type")}>
          <select style={inputStyle} value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
            <option value="سنوية">{t("سنوية", "Annual")}</option>
            <option value="مرضية">{t("مرضية", "Sick")}</option>
            <option value="طارئة">{t("طارئة", "Emergency")}</option>
            <option value="بدون راتب">{t("بدون راتب", "Unpaid")}</option>
            <option value="أخرى">{t("أخرى", "Other")}</option>
          </select>
        </Field>
        <Field label={t("من تاريخ", "From")}>
          <DateField style={inputStyle} value={form.from} onChange={(v) => setForm({ ...form, from: v })} />
        </Field>
        <Field label={t("إلى تاريخ", "To")}>
          <DateField style={inputStyle} value={form.to} onChange={(v) => setForm({ ...form, to: v })} />
        </Field>
        <Field label={t("ملاحظة (اختياري)", "Note (optional)")}>
          <input style={inputStyle} value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} />
        </Field>
        <div style={{ display: "flex", alignItems: "flex-end" }}>
          <Btn onClick={submit}>{t("إرسال الطلب", "Submit Request")}</Btn>
        </div>
      </div>
      {sent && (
        <div style={{ marginTop: 10, fontSize: 12, color: COLORS.green }}>
          {t("تم إرسال طلبك — بانتظار الموافقة المبدئية من مدير الكيان ثم الموافقة النهائية.", "Your request has been sent — awaiting preliminary approval from the entity manager, then final approval.")}
        </div>
      )}
    </div>
  );
}

function AdvanceRequestForm({ onSubmit, t }) {
  const [form, setForm] = useState({ amount: "", reason: "" });
  const [sent, setSent] = useState(false);
  const [err, setErr] = useState("");

  const submit = () => {
    const amt = Number(form.amount);
    if (!amt || amt <= 0) {
      setErr(t("الرجاء إدخال مبلغ صحيح", "Please enter a valid amount"));
      return;
    }
    onSubmit && onSubmit({ amount: amt, reason: form.reason.trim() });
    setForm({ amount: "", reason: "" });
    setErr("");
    setSent(true);
    setTimeout(() => setSent(false), 2500);
  };

  return (
    <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 16, marginBottom: 20 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
        <Field label={t("المبلغ المطلوب (﷼)", "Requested Amount (SAR)")}>
          <input
            type="number"
            style={{ ...inputStyle, width: 130 }}
            value={form.amount}
            onChange={(e) => setForm({ ...form, amount: e.target.value })}
          />
        </Field>
        <Field label={t("السبب (اختياري)", "Reason (optional)")}>
          <input style={inputStyle} value={form.reason} onChange={(e) => setForm({ ...form, reason: e.target.value })} />
        </Field>
        <div style={{ display: "flex", alignItems: "flex-end" }}>
          <Btn onClick={submit}>{t("إرسال طلب السلفة", "Submit Advance Request")}</Btn>
        </div>
      </div>
      {err && <div style={{ marginTop: 10, fontSize: 12, color: COLORS.brick }}>{err}</div>}
      {sent && (
        <div style={{ marginTop: 10, fontSize: 12, color: COLORS.green }}>
          {t("تم إرسال طلبك — بانتظار الموافقة.", "Your request has been sent — awaiting approval.")}
        </div>
      )}
    </div>
  );
}

            {employee.photo ? (
              <img src={employee.photo} alt="" style={{ width: 48, height: 48, borderRadius: "50%", objectFit: "cover", border: `1px solid ${COLORS.line}` }} />

              </div>

                    {(ts.comments || []).map((c) => (
                      <div key={c.id} style={{ fontSize: 12, background: COLORS.paperDark, borderRadius: 8, padding: "6px 10px", marginBottom: 6 }}>

                        onKeyDown={(e) => {
                          if (e.key === "Enter" && (taskCommentDrafts[ts.id] || "").trim()) {
                            onAddTaskComment && onAddTaskComment(ts.id, taskCommentDrafts[ts.id]);
                            setTaskCommentDrafts({ ...taskCommentDrafts, [ts.id]: "" });

                          setTaskCommentDrafts({ ...taskCommentDrafts, [ts.id]: "" });

                      >
                        {t("إرسال", "Send")}
                      </Btn>
                    </div>
                  </div>

              key={l.id}
              style={{
                display: "flex",
                justifyContent: "space-between",
                padding: "9px 14px",
                borderTop: i ? `1px dashed ${COLORS.line}` : "none",
                fontSize: 12.5,
              }}
            >
              <div>{trLabel(t, LEAVE_TYPE_LABELS_EN, l.type)}</div>
              <div style={{ fontFamily: "Consolas, monospace" }}>{l.from} → {l.to}</div>
            </div>
          ))}
        </div>

        <SectionTitle>{t("سجل الحضور", "Attendance Record")}</SectionTitle>
        <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
          {myAttendance.length === 0 && <Empty text={t("لا توجد سجلات حضور", "No attendance records")} />}
          {myAttendance.slice(0, 25).map((a, i) => (
            <div
              key={a.id}
              style={{
                display: "flex",
                justifyContent: "space-between",
                padding: "9px 14px",
                borderTop: i ? `1px dashed ${COLORS.line}` : "none",
                fontSize: 12.5,
              }}
            >
              <div>{a.date}</div>
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                {(a.checkInTime || a.checkOutTime) && (
                  <span style={{ fontFamily: "Consolas, monospace", color: "#8a7a63" }}>
                    {a.checkInTime || "—"} → {a.checkOutTime || "—"}
                  </span>
                )}
                <Stamp tone={a.status === "حاضر" ? "green" : a.status === "متأخر" ? "gold" : "brick"}>{trLabel(t, ATTENDANCE_STATUS_LABELS_EN, a.status)}</Stamp>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============ إدارة المستخدمين (أدمن فقط) ============ */
function UsersTab({ users, setUsers, employees, branches, entities, logActivity }) {
  const { t } = useLang();
  const [form, setForm] = useState(EMPTY_USER);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState("");
  const [bulkResult, setBulkResult] = useState(null);

  const resetForm = () => {
    setForm(EMPTY_USER);
    setEditingId(null);
    setErr("");
  };

  /* توليد حسابات دخول لكل الموظفين اللي معندهمش حساب بعد:
     اسم المستخدم = رقم الهوية/الإقامة، كلمة المرور الافتراضية = admin@123،
     ومطلوب من الموظف تغييرها إجباريًا أول ما يدخل بيها (mustChangePassword) */
  const generateAccountsForAllEmployees = () => {
    const linkedEmployeeIds = new Set(users.filter((u) => u.role === "employee" && u.employeeId).map((u) => u.employeeId));
    const existingUsernames = new Set(users.map((u) => u.username));
    const created = [];
    const skippedNoId = [];
    const skippedDup = [];
    employees.forEach((e) => {
      if (linkedEmployeeIds.has(e.id)) return; /* عنده حساب مرتبط بيه بالفعل */
      const uname = (e.nationalId || "").trim();
      if (!uname) {
        skippedNoId.push(e.name || e.id);
        return;
      }
      if (existingUsernames.has(uname)) {
        skippedDup.push(e.name || e.id);
        return;
      }
      created.push({
        id: uid(),
        username: uname,
        password: DEFAULT_BULK_PASSWORD,
        role: "employee",
        name: e.name || uname,
        branchId: "",
        employeeId: e.id,
        entityId: "",
        customTabs: null,
        customRoleLabel: "",
        email: "",
        mustChangePassword: true,
      });
      existingUsernames.add(uname);
    });
    if (created.length) {
      setUsers((prev) => [...prev, ...created]);
      logActivity && logActivity("توليد حسابات جماعي للموظفين", "users", `${created.length} حساب`);
    }
    setBulkResult({ created: created.length, skippedNoId, skippedDup });
  };

  const submit = () => {
    if (!form.username.trim() || !form.password.trim() || !form.name.trim()) {
      setErr(t("الرجاء تعبئة الاسم واسم المستخدم وكلمة المرور", "Please fill in the name, username, and password"));
      return;
    }
    if (form.role === "custom" && !form.customRoleLabel.trim()) {
      setErr(t("الرجاء كتابة اسم الدور المخصص", "Please enter the custom role name"));
      return;
    }
    const dup = users.find((u) => u.username === form.username.trim() && u.id !== editingId);
    if (dup) {
      setErr(t("اسم المستخدم مستخدم بالفعل، اختر اسمًا آخر", "This username is already taken, please choose another"));
      return;
    }
    const customizableRole = ["manager", "entity_manager", "branch_manager", "accountant", "cashier", "custom"].includes(form.role);
    const payload = { ...form, username: form.username.trim(), customRoleLabel: form.role === "custom" ? form.customRoleLabel.trim() : "" };
    if (!customizableRole) {
      payload.customTabs = null;
    } else if (!Array.isArray(payload.customTabs)) {
      payload.customTabs = defaultTabsForRole(form.role);
    }
    if (editingId) {
      setUsers((prev) => prev.map((u) => (u.id === editingId ? { ...payload, id: editingId } : u)));
      logActivity && logActivity("تعديل مستخدم", "users", payload.username);
    } else {
      setUsers((prev) => [...prev, { ...payload, id: uid() }]);
      logActivity && logActivity("إضافة مستخدم", "users", payload.username);
    }
    resetForm();
  };

  const edit = (u) => {
    const defaultTabs = defaultTabsForRole(u.role);
    setForm({ ...u, customTabs: Array.isArray(u.customTabs) ? u.customTabs : defaultTabs });
    setEditingId(u.id);
    setErr("");
  };

  const remove = (id) => {
    const target = users.find((u) => u.id === id);
    if (target?.role === "admin" && users.filter((u) => u.role === "admin").length <= 1) {
      setErr(t("لا يمكن حذف آخر حساب أدمن في النظام", "You cannot delete the last admin account in the system"));
      return;
    }
    setUsers((prev) => prev.filter((u) => u.id !== id));
    if (editingId === id) resetForm();
  };

  return (
    <div>
      <Header title={t("المستخدمون والصلاحيات", "Users & Permissions")} subtitle={t("إدارة حسابات الدخول: أدمن، مسؤول فرع، موظف — كل حساب بباسورد خاص به", "Manage login accounts: admin, branch manager, employee — each with its own password")} />

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 22 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
          <div>
            <div style={{ fontSize: 13, fontWeight: 700, color: COLORS.espresso }}>
              {t("توليد حسابات لكل الموظفين", "Generate accounts for all employees")}
            </div>
            <div style={{ fontSize: 11.5, color: "#8a7a63", marginTop: 3 }}>
              {t(
                "ينشئ حساب دخول لكل موظف معندوش حساب بعد: اسم المستخدم = رقم الهوية/الإقامة، كلمة المرور: admin@123 — وهيُطلب من الموظف تغييرها إجباريًا أول ما يسجّل دخول.",
                "Creates a login account for every employee who doesn't have one yet: username = National ID/Iqama No., password: admin@123 — the employee will be forced to change it on first login."
              )}
            </div>
          </div>
          <Btn
            tone="secondary"
            onClick={() => {
              if (window.confirm(t("توليد حسابات لكل الموظفين اللي معندهمش حساب؟", "Generate accounts for all employees who don't have one yet?"))) {
                generateAccountsForAllEmployees();
              }
            }}
          >
            {t("توليد الحسابات", "Generate Accounts")}
          </Btn>
        </div>
        {bulkResult && (
          <div style={{ marginTop: 12, fontSize: 12, color: COLORS.coffee, background: COLORS.paperDark, borderRadius: 8, padding: "10px 12px" }}>
            {t(
              `تم إنشاء ${bulkResult.created} حساب جديد.`,
              `${bulkResult.created} new account(s) created.`
            )}
            {bulkResult.skippedDup.length > 0 && (
              <div style={{ marginTop: 4 }}>
                {t(
                  `تم تخطي ${bulkResult.skippedDup.length} موظف لتكرار رقم الهوية كاسم مستخدم.`,
                  `Skipped ${bulkResult.skippedDup.length} employee(s) — duplicate National ID used as username.`
                )}
              </div>
            )}
            {bulkResult.skippedNoId.length > 0 && (
              <div style={{ marginTop: 4 }}>
                {t(
                  `تم تخطي ${bulkResult.skippedNoId.length} موظف لعدم وجود رقم هوية مسجَّل: ${bulkResult.skippedNoId.join("، ")}`,
                  `Skipped ${bulkResult.skippedNoId.length} employee(s) with no National ID on file: ${bulkResult.skippedNoId.join(", ")}`
                )}
              </div>
            )}
          </div>
        )}
      </div>

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 22 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: COLORS.espresso }}>
          {editingId ? t("تعديل حساب", "Edit Account") : t("إضافة حساب جديد", "Add New Account")}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label={t("الاسم المعروض", "Display Name")}>
            <input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          </Field>
          <Field label={t("اسم المستخدم", "Username")}>
            <input style={inputStyle} value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} />
          </Field>
          <Field label={t("كلمة المرور", "Password")}>
            <input style={inputStyle} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />
          </Field>
          <Field label={t("البريد الإلكتروني (لتأكيد الدخول)", "Email (for login verification)")}>
            <input
              type="email"
              style={inputStyle}
              placeholder={t("اختياري — بدونه يتخطّى النظام كود التأكيد", "Optional — without it, the system skips the confirmation code")}
              value={form.email || ""}
              onChange={(e) => setForm({ ...form, email: e.target.value })}
            />
          </Field>
          <Field label={t("الدور", "Role")}>
            <select
              style={inputStyle}
              value={form.role}
              onChange={(e) => {
                const newRole = e.target.value;
                const defaultTabs = defaultTabsForRole(newRole);
                setForm({ ...form, role: newRole, branchId: "", employeeId: "", entityId: "", customTabs: defaultTabs });
              }}
            >
              <option value="admin">{t("أدمن (كل الصلاحيات)", "Admin (full access)")}</option>
              <option value="manager">{t("مسؤول عام", "General Manager")}</option>
              <option value="entity_manager">{t("مدير كيان", "Entity Manager")}</option>
              <option value="branch_manager">{t("مسؤول فرع", "Branch Manager")}</option>
              <option value="accountant">{t("محاسب (كل الكيانات)", "Accountant (all entities)")}</option>
              <option value="cashier">{t("أمين صندوق (كل الكيانات)", "Cashier (all entities)")}</option>
              <option value="custom">{t("دور مخصص (اكتب اسمه)", "Custom role (type name)")}</option>
              <option value="employee">{t("موظف", "Employee")}</option>
            </select>
          </Field>
          {form.role === "custom" && (
            <Field label={t("اسم الدور", "Role Name")}>
              <input
                style={inputStyle}
                placeholder={t("مثال: مشرف مبيعات", "e.g. Sales Supervisor")}
                value={form.customRoleLabel}
                onChange={(e) => setForm({ ...form, customRoleLabel: e.target.value })}
              />
            </Field>
          )}
          {form.role === "entity_manager" && (
            <Field label={t("الكيان", "Entity")}>
              <select style={inputStyle} value={form.entityId} onChange={(e) => setForm({ ...form, entityId: e.target.value })}>
                <option value="">{t("اختر الكيان", "Select entity")}</option>
                {entities.map((en) => (
                  <option key={en.id} value={en.id}>{en.name}</option>
                ))}
              </select>
            </Field>
          )}
          {form.role === "branch_manager" && (
            <Field label={t("الفرع", "Branch")}>
              <select style={inputStyle} value={form.branchId} onChange={(e) => setForm({ ...form, branchId: e.target.value })}>
                <option value="">{t("اختر الفرع", "Select branch")}</option>
                {branches.map((b) => (
                  <option key={b.id} value={b.id}>{b.name}</option>
                ))}
              </select>
            </Field>
          )}
          {form.role === "employee" && (
            <Field label={t("الموظف المرتبط", "Linked Employee")}>
              <EmployeeSelect employees={employees} value={form.employeeId} onChange={(id) => setForm({ ...form, employeeId: id })} />
            </Field>
          )}
        </div>

        {["manager", "entity_manager", "branch_manager", "accountant", "cashier", "custom"].includes(form.role) && (
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px dashed ${COLORS.line}` }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 8, color: COLORS.espresso }}>
              {t("التبويبات المسموح بها لهذا الحساب", "Tabs allowed for this account")}
            </div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
              {NAV.filter((n) => CUSTOMIZABLE_TAB_KEYS.includes(n.key)).map((n) => {
                const active = (form.customTabs || []).includes(n.key);
                return (
                  <button
                    key={n.key}
                    type="button"
                    onClick={() => {
                      const cur = form.customTabs || [];
                      const next = cur.includes(n.key) ? cur.filter((k) => k !== n.key) : [...cur, n.key];
                      setForm({ ...form, customTabs: next });
                    }}
                    style={{
                      padding: "6px 11px",
                      borderRadius: 7,
                      fontSize: 12,
                      fontWeight: 700,
                      cursor: "pointer",
                      border: `1px solid ${active ? COLORS.espresso : COLORS.line}`,
                      background: active ? COLORS.espresso : "#fff",
                      color: active ? "#fff" : COLORS.coffee,
                    }}
                  >
                    {t(n.label, n.labelEn)}
                  </button>
                );
              })}
            </div>
            <div style={{ fontSize: 11, color: "#a3927a", marginTop: 8 }}>
              {t(
                "ملاحظة: تبويبَي \"المستخدمون\" و\"التقارير\" مقصوران على حساب الأدمن دائمًا ولا يمكن منحهما لأي دور آخر.",
                "Note: the \"Users\" and \"Reports\" tabs are always admin-only and can't be granted to any other role."
              )}
            </div>
          </div>
        )}
        {err && <div style={{ color: COLORS.brick, fontSize: 12, marginTop: 10 }}>{err}</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          <Btn onClick={submit}>{editingId ? t("حفظ التعديل", "Save Changes") : t("إضافة الحساب", "Add Account")}</Btn>
          {editingId && <Btn tone="secondary" onClick={resetForm}>{t("إلغاء", "Cancel")}</Btn>}
        </div>
      </div>

      <SectionTitle>{t("الحسابات الحالية", "Current Accounts")} ({fmt(users.length)})</SectionTitle>
      {(() => {
        const branchIdOf = (u) => {
          if (u.role === "branch_manager") return u.branchId || null;
          if (u.role === "employee") return employees.find((e) => e.id === u.employeeId)?.branchId || null;
          return null;
        };
        const groups = [];
        const generalUsers = users.filter((u) => !branchIdOf(u));
        if (generalUsers.length) {
          groups.push({ key: "general", label: t("عام / إداريون (بدون فرع محدد)", "General / Admins (no specific branch)"), users: generalUsers });
        }
        branches.forEach((b) => {
          const branchUsers = users.filter((u) => branchIdOf(u) === b.id);
          if (branchUsers.length) {
            groups.push({ key: b.id, label: `${b.name} · ${entities.find((en) => en.id === b.entityId)?.name || "—"}`, users: branchUsers });
          }
        });
        return groups.map((g) => (
          <div key={g.key} style={{ marginBottom: 18 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
              <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.espresso }}>{g.label}</div>
              <Stamp>{g.users.length} {t("حساب", "accounts")}</Stamp>
            </div>
            <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
              {g.users.map((u, i) => (
                <div
                  key={u.id}
                  style={{
                    display: "flex",
                    justifyContent: "space-between",
                    alignItems: "center",
                    padding: "10px 14px",
                    borderTop: i ? `1px dashed ${COLORS.line}` : "none",
                  }}
                >
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 13 }}>
                      {u.name} <span style={{ fontWeight: 400, color: "#8a7a63" }}>({u.username})</span>
                      {u.mustChangePassword && (
                        <span style={{ marginInlineStart: 8 }}>
                          <Stamp tone="gold">{t("لم يغيّر كلمة المرور بعد", "Hasn't changed password yet")}</Stamp>
                        </span>
                      )}
                    </div>
                    <div style={{ fontSize: 11.5, color: "#8a7a63" }}>
                      {roleLabel(u, t)}
                      {u.role === "entity_manager" && ` · ${entities.find((en) => en.id === u.entityId)?.name || "—"}`}
                      {u.role === "branch_manager" && ` · ${branches.find((b) => b.id === u.branchId)?.name || "—"}`}
                      {u.role === "employee" && ` · ${employees.find((e) => e.id === u.employeeId)?.name || t("غير مرتبط", "Not linked")}`}
                      {Array.isArray(u.customTabs) && ` · 🔧 ${t(`صلاحيات مخصصة (${u.customTabs.length} تبويب)`, `Custom access (${u.customTabs.length} tabs)`)}`}
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 6 }}>
                    <Btn small tone="secondary" onClick={() => edit(u)}>{t("تعديل", "Edit")}</Btn>
                    <Btn small tone="danger" onClick={() => remove(u.id)}>{t("حذف", "Delete")}</Btn>
                  </div>
                </div>
              ))}
            </div>
          </div>
        ));
      })()}

      <div style={{ marginTop: 16, fontSize: 11.5, color: "#a3927a", background: "#fff", border: `1px dashed ${COLORS.line}`, borderRadius: 10, padding: 14 }}>
        {t(
          "تنبيه: كلمات المرور هنا وسيلة تقييد وصول بسيطة داخل الفريق وليست تشفيرًا احترافيًا (يمكن لأي شخص يملك صلاحية الأدمن رؤيتها كنص واضح). البيانات الآن تُخزَّن وتُزامَن عبر قاعدة بيانات Firestore المشتركة، فتأكد من ضبط قواعد الأمان (Rules) في مشروع Firebase لمنع الوصول العام غير المصرّح به.",
          "Note: passwords here are a simple team access restriction, not professional-grade encryption (anyone with admin access can see them in plain text). Data is now stored and synced via the shared Firestore database, so make sure to configure the Firebase project's security Rules to prevent unauthorized public access."
        )}
      </div>
    </div>
  );
}

/* ============ التقارير (سجل الدخول والعمليات — أدمن فقط) ============ */
function ACTION_TONE(action) {
  if (action === "دخول") return "green";
  if (action === "خروج") return "gold";
  if (action.startsWith("حذف")) return "brick";
  return "gold";
}

function ReportsTab({ activityLog, users }) {
  const { t } = useLang();
  const [userFilter, setUserFilter] = useState("");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");
  const [searchQuery, setSearchQuery] = useState("");

  const fmtDT = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString(t("ar-SA-u-nu-latn", "en-US"), { dateStyle: "medium", timeStyle: "short" });
  };

  const q = searchQuery.trim().toLowerCase();
  const rows = activityLog
    .filter((e) => !userFilter || e.username === userFilter)
    .filter((e) => !fromDate || (e.timestamp || "").slice(0, 10) >= fromDate)
    .filter((e) => !toDate || (e.timestamp || "").slice(0, 10) <= toDate)
    .filter(
      (e) =>
        !q ||
        (e.userName || "").toLowerCase().includes(q) ||
        (e.username || "").toLowerCase().includes(q) ||
        (e.action || "").toLowerCase().includes(q) ||
        (e.targetLabel || "").toLowerCase().includes(q)
    )
    .slice()
    .reverse();

  const uniqueUsers = Array.from(new Set(activityLog.map((e) => e.username))).map(
    (u) => activityLog.find((e) => e.username === u)
  );

  const loginCount = rows.filter((r) => r.action === "دخول").length;

  return (
    <div>
      <Header title={t("تقرير الدخول والعمليات", "Login & Activity Report")} subtitle={t("سجلّ بمن دخل النظام ومتى وماذا فعل، مبني على آخر 500 عملية", "A log of who accessed the system, when, and what they did — based on the last 500 actions")} />

      <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end", marginBottom: 16 }} className="no-print">
        <Field label={t("بحث", "Search")}>
          <input
            style={inputStyle}
            placeholder={t("ابحث بالاسم أو العملية أو التفاصيل...", "Search by name, action, or details...")}
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
          />
        </Field>
        <Field label={t("المستخدم", "User")}>
          <select style={inputStyle} value={userFilter} onChange={(e) => setUserFilter(e.target.value)}>
            <option value="">{t("كل المستخدمين", "All Users")}</option>
            {uniqueUsers.map((u) => (
              <option key={u.username} value={u.username}>{u.userName} ({u.username})</option>
            ))}
          </select>
        </Field>
        <Field label={t("من تاريخ", "From Date")}>
          <DateField style={inputStyle} value={fromDate} onChange={(v) => setFromDate(v)} />
        </Field>
        <Field label={t("إلى تاريخ", "To Date")}>
          <DateField style={inputStyle} value={toDate} onChange={(v) => setToDate(v)} />
        </Field>
        <Btn onClick={() => window.print()}>{t("🖶 طباعة التقرير", "🖶 Print Report")}</Btn>
      </div>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }} className="no-print">
        <ReceiptCard label={t("عدد عمليات الدخول", "Login Count")} value={fmt(loginCount)} />
        <ReceiptCard label={t("عدد العمليات المعروضة", "Actions Shown")} value={fmt(rows.length)} tone={COLORS.coffee} />
      </div>

      <div className="print-section">
        <div style={{ display: "none" }} className="print-only-title">
          <div className="print-brand">{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          {t("تقرير الدخول والعمليات", "Login & Activity Report")}
        </div>
        <div style={{ display: "none" }} className="print-only-meta">
          <span>{t(`تاريخ الطباعة: ${new Date().toLocaleDateString("ar-SA-u-nu-latn")}`, `Print Date: ${new Date().toLocaleDateString("en-US")}`)}</span>
          <span>{rows.length} {t("عملية", "actions")}</span>
        </div>
        <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "auto" }}>
          {rows.length === 0 && <Empty text={t("لا توجد عمليات مسجّلة مطابقة", "No matching recorded actions")} />}
          {rows.length > 0 && (
            <table className="responsive-table" style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
              <thead>
                <tr style={{ background: COLORS.paperDark, textAlign: "right" }}>
                  {[
                    t("التاريخ والوقت", "Date & Time"),
                    t("المستخدم", "User"),
                    t("الدور", "Role"),
                    t("العملية", "Action"),
                    t("التفاصيل", "Details"),
                  ].map((h, i) => (
                    <th key={i} style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.coffee }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.id} style={{ borderTop: `1px dashed ${COLORS.line}` }}>
                    <td data-label={t("التاريخ والوقت", "Date & Time")} style={{ padding: "9px 12px", fontFamily: "Consolas, monospace" }}>{fmtDT(r.timestamp)}</td>
                    <td data-label={t("المستخدم", "User")} style={{ padding: "9px 12px", fontWeight: 700 }}>{r.userName} <span style={{ color: "#a3927a", fontWeight: 400 }}>({r.username})</span></td>
                    <td data-label={t("الدور", "Role")} style={{ padding: "9px 12px" }}>{roleLabel({ role: r.role, customRoleLabel: r.customRoleLabel }, t)}</td>
                    <td data-label={t("العملية", "Action")} style={{ padding: "9px 12px" }}>
                      <Stamp tone={ACTION_TONE(r.action)}>{r.action}</Stamp>
                    </td>
                    <td data-label={t("التفاصيل", "Details")} style={{ padding: "9px 12px" }}>{r.targetLabel || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============ بوابة الدخول (تدير المستخدمين والجلسة) ============ */
function Root() {
  const [users, setUsers] = useState(USERS_SEED);
  const [usersLoaded, setUsersLoaded] = useState(false);
  const [currentUsername, setCurrentUsername] = useState(null);
  const [authLoaded, setAuthLoaded] = useState(false);
  const [loginForm, setLoginForm] = useState({ username: "", password: "" });
  const [loginError, setLoginError] = useState("");
  const [authSyncError, setAuthSyncError] = useState("");
  const lastSyncedUsersRef = useRef("");
  const [activityLog, setActivityLog] = useState([]);
  const [logLoaded, setLogLoaded] = useState(false);
  const lastSyncedLogRef = useRef("");

  /* الجلسة (من هو المسجّل دخوله) تبقى محلية على كل جهاز، ما تتزامنش */
  useEffect(() => {
    try {
      const sess = localStorage.getItem("hr-system-session");
      if (sess) setCurrentUsername(sess);
    } catch (e) {
      /* لا توجد جلسة محفوظة */
    }
    setAuthLoaded(true);
  }, []);

  /* قائمة المستخدمين والصلاحيات تُزامَن لحظيًا عبر Firestore بين كل الأجهزة */
  useEffect(() => {
    const unsub = USERS_DOC.onSnapshot(
      (snap) => {
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        if (d && Array.isArray(d.users) && d.users.length) {
          setUsers(d.users);
          lastSyncedUsersRef.current = JSON.stringify(d.users);
        } else {
          USERS_DOC.set({ users: USERS_SEED }).catch(() => {});
        }
        setAuthSyncError("");
        setUsersLoaded(true);
      },
      (err) => {
        setAuthSyncError("تعذر الاتصال بقاعدة البيانات المشتركة — تحقّق من اتصال الإنترنت");
        setUsersLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!usersLoaded) return;
    const json = JSON.stringify(users);
    if (json === lastSyncedUsersRef.current) return;
    USERS_DOC.set({ users })
      .then(() => {
        lastSyncedUsersRef.current = json;
      })
      .catch(() => setAuthSyncError("تعذر حفظ بيانات المستخدمين — تحقّق من الإنترنت"));
  }, [users, usersLoaded]);

  /* سجلّ الدخول والعمليات (من دخل البرنامج وماذا فعل) — يتزامن لحظيًا بين كل الأجهزة */
  useEffect(() => {
    const unsub = LOG_DOC.onSnapshot(
      (snap) => {
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        const list = d && Array.isArray(d.entries) ? d.entries : [];
        setActivityLog(list);
        lastSyncedLogRef.current = JSON.stringify(list);
        setLogLoaded(true);
      },
      (err) => {
        setLogLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  /* تسجيل حدث جديد في سجلّ العمليات (نكتب مباشرة على Firestore عشان يشتغل حتى لو الحدث حصل قبل تحميل HRApp، زي الدخول) */
  const logActivity = (user, action, targetType, targetLabel) => {
    const entry = {
      id: uid(),
      username: user?.username || "—",
      userName: user?.name || user?.username || "—",
      role: user?.role || "",
      customRoleLabel: user?.customRoleLabel || "",
      action,
      targetType: targetType || "",
      targetLabel: targetLabel || "",
      timestamp: new Date().toISOString(),
    };
    const next = [...activityLog, entry].slice(-500); /* الاحتفاظ بآخر 500 عملية فقط لتفادي تضخّم القاعدة */
    setActivityLog(next);
    lastSyncedLogRef.current = JSON.stringify(next);
    LOG_DOC.set({ entries: next }).catch(() => {});
  };

  const currentUser = users.find((u) => u.username === currentUsername) || null;

  /* حالة التحقق الثنائي بالإيميل — تُستخدم مؤقتًا فقط أثناء خطوة إدخال الكود، ومحلية على الجهاز */
  const [pendingUser, setPendingUser] = useState(null);
  const [sentCode, setSentCode] = useState("");
  const [codeExpiresAt, setCodeExpiresAt] = useState(0);
  const [codeInput, setCodeInput] = useState("");
  const [verifyError, setVerifyError] = useState("");
  const [sendingCode, setSendingCode] = useState(false);
  const [resendCooldown, setResendCooldown] = useState(0);

  useEffect(() => {
    if (resendCooldown <= 0) return;
    const t = setTimeout(() => setResendCooldown((s) => s - 1), 1000);
    return () => clearTimeout(t);
  }, [resendCooldown]);

  const completeLogin = (user) => {
    setCurrentUsername(user.username);
    try {
      localStorage.setItem("hr-system-session", user.username);
    } catch (e) {}
    setLoginForm({ username: "", password: "" });
    setLoginError("");
    setPendingUser(null);
    setSentCode("");
    setCodeInput("");
    setVerifyError("");
    logActivity(user, "دخول", "", "");
  };

  const dispatchVerificationCode = (user) => {
    const code = String(Math.floor(100000 + Math.random() * 900000));
    setSentCode(code);
    setCodeExpiresAt(Date.now() + 5 * 60 * 1000);
    setSendingCode(true);
    setVerifyError("");
    sendVerificationEmail(user.email, code)
      .then(() => {
        setSendingCode(false);
        setResendCooldown(30);
      })
      .catch(() => {
        setSendingCode(false);
        setVerifyError("تعذّر إرسال كود التأكيد إلى بريدك الإلكتروني — تأكد من إعداد خدمة الإيميل أو تواصل مع الأدمن.");
      });
  };

  const login = () => {
    const match = users.find(
      (u) => u.username === loginForm.username.trim() && u.password === loginForm.password
    );
    if (!match) {
      setLoginError("اسم المستخدم أو كلمة المرور غير صحيحة");
      return;
    }
    setLoginError("");
    if (match.email && EMAILJS_CONFIGURED) {
      setPendingUser(match);
      dispatchVerificationCode(match);
      return;
    }
    /* لا يوجد بريد مسجّل لهذا الحساب أو خدمة الإيميل غير مُفعّلة بعد — يتخطّى النظام كود التأكيد */
    completeLogin(match);
  };

  const verifyCode = () => {
    if (!pendingUser) return;
    if (Date.now() > codeExpiresAt) {
      setVerifyError("انتهت صلاحية الكود — اضغط \"إعادة إرسال الكود\" للحصول على كود جديد");
      return;
    }
    if (codeInput.trim() !== sentCode) {
      setVerifyError("الكود غير صحيح، حاول مرة أخرى");
      return;
    }
    completeLogin(pendingUser);
  };

  const cancelVerification = () => {
    setPendingUser(null);
    setSentCode("");
    setCodeInput("");
    setVerifyError("");
    setResendCooldown(0);
  };

  const logout = () => {
    if (currentUser) logActivity(currentUser, "خروج", "", "");
    setCurrentUsername(null);
    try {
      localStorage.removeItem("hr-system-session");
    } catch (e) {}
  };

  if (!authLoaded || !usersLoaded) return null;

  if (pendingUser) {
    return (
      <VerifyCodeScreen
        user={pendingUser}
        code={codeInput}
        setCode={setCodeInput}
        onSubmit={verifyCode}
        onResend={() => dispatchVerificationCode(pendingUser)}
        onCancel={cancelVerification}
        error={verifyError}
        sending={sendingCode}
        resendCooldown={resendCooldown}
      />
    );
  }

  if (!currentUser) {
    return (
      <LoginScreen
        form={loginForm}
        setForm={setLoginForm}
        onSubmit={login}
        error={loginError || authSyncError}
      />
    );
  }

  /* أول تسجيل دخول بحساب مُولَّد بكلمة مرور افتراضية — لازم يغيّرها قبل ما يدخل النظام */
  if (currentUser.mustChangePassword) {
    return (
      <ChangePasswordModal
        currentUser={currentUser}
        setUsers={setUsers}
        onClose={() => {}}
        logActivity={(action, targetType, targetLabel) => logActivity(currentUser, action, targetType, targetLabel)}
        forced
      />
    );
  }

  return (
    <HRApp
      currentUser={currentUser}
      users={users}
      setUsers={setUsers}
      onLogout={logout}
      activityLog={activityLog}
      logActivity={(action, targetType, targetLabel) => logActivity(currentUser, action, targetType, targetLabel)}
    />
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(
  <LangProvider>
    <Root />
  </LangProvider>
);
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>

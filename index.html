const LangContext = createContext({ lang: "ar", dir: "rtl", t: (ar) => ar, toggleLang: () => {} });
function useLang() {
  return useContext(LangContext);
}
function LangProvider({ children }) {
  const [lang, setLang] = useState(() => {
    try {
      return localStorage.getItem("hr-system-lang") || "ar";
    } catch (e) {
      return "ar";
    }
  });

  /* الواجهة تبقى RTL دايمًا (نفس التخطيط) — بس النصوص تتغيّر بين عربي وإنجليزي */
  useEffect(() => {
    document.documentElement.setAttribute("lang", lang);
    try {
      localStorage.setItem("hr-system-lang", lang);
    } catch (e) {}
  }, [lang]);

  const toggleLang = () => setLang((prev) => (prev === "ar" ? "en" : "ar"));
  /* t(نص عربي, English text) — يرجع النص المناسب حسب اللغة الحالية */
  const t = (ar, en) => (lang === "en" && en !== undefined ? en : ar);

  return <LangContext.Provider value={{ lang, t, toggleLang }}>{children}</LangContext.Provider>;
}
function LangToggle({ style }) {
  const { lang, toggleLang } = useLang();
  return (
    <button
      onClick={toggleLang}

}

function fmt(n) {
  if (n === "" || n === null || n === undefined || isNaN(n)) return "٠";
  return Number(n).toLocaleString("ar-SA", { maximumFractionDigits: 2 });
}

function yearsBetween(start, end) {
  const s = new Date(start);
  const e = new Date(end);
  if (isNaN(s) || isNaN(e) || e < s) return 0;
  return (e - s) / (1000 * 60 * 60 * 24 * 365.25);
}

/* عدد أيام إجازة (from→to) الواقعة داخل شهر معيّن بصيغة "YYYY-MM" */
function daysOverlapInMonth(from, to, monthStr) {
  if (!from || !to || !monthStr) return 0;
  const [y, m] = monthStr.split("-").map(Number);
  const monthStart = new Date(y, m - 1, 1);
  const monthEnd = new Date(y, m, 0); // آخر يوم في الشهر
  const s = new Date(from);
  const e = new Date(to);
  if (isNaN(s) || isNaN(e)) return 0;
  const start = s > monthStart ? s : monthStart;
  const end = e < monthEnd ? e : monthEnd;
  if (end < start) return 0;
  return Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
}

/* رصيد الإجازة السنوية: تراكم شهري حسب مدة الخدمة الفعلية منذ آخر تاريخ ذكرى تعيين
   ٢١ يوم/سنة (تزيد لـ ٣٠ بعد ٥ سنوات خدمة) وفق نظام العمل السعودي، ناقص المستخدم فعليًا من إجازات "سنوية" خلال سنة الخدمة الحالية */
function leaveBalanceInfo(emp, leaves) {
  if (!emp || !emp.joinDate) return null;
  const join = new Date(emp.joinDate + "T00:00:00");
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  if (isNaN(join) || join > today) return null;

  const serviceYears = yearsBetween(emp.joinDate, today.toISOString().slice(0, 10));
  const perYear = serviceYears >= 5 ? 30 : 21;

  let anniv = new Date(join);
  anniv.setFullYear(today.getFullYear());
  if (anniv > today) anniv.setFullYear(anniv.getFullYear() - 1);

  let months = (today.getFullYear() - anniv.getFullYear()) * 12 + (today.getMonth() - anniv.getMonth());
  if (today.getDate() < anniv.getDate()) months -= 1;
  months = Math.max(0, Math.min(12, months));

  const accrued = (perYear / 12) * months;
  const usedDays = (leaves || [])
    .filter((l) => l.employeeId === emp.id && l.type === "سنوية" && l.from && new Date(l.from) >= anniv && new Date(l.from) <= today)
    .reduce((s, l) => {
      const d = Math.round((new Date(l.to) - new Date(l.from)) / 86400000) + 1;
      return s + (d > 0 ? d : 0);
    }, 0);
  const adjustment = Number(emp.leaveAdjustment || 0);
  const balance = accrued - usedDays + adjustment;

  return {
    perYear,
    anniversaryDate: anniv.toISOString().slice(0, 10),
    monthsCompleted: months,
    accrued: Math.round(accrued * 10) / 10,
    usedDays,
    adjustment,
    balance: Math.round(balance * 10) / 10,
  };
}

function HRApp({ currentUser, users, setUsers, onLogout, activityLog, logActivity }) {
  const { t } = useLang();
  const role = currentUser.role;
  const isAdmin = role === "admin";
  const isManager = role === "manager";
  const isEntityManager = role === "entity_manager";
  const isBranchManager = role === "branch_manager";
  const navItems = navForRole(role);
  const [tab, setTab] = useState(navItems[0]?.key || "dash");
  const [entities, setEntities] = useState(ENTITIES_SEED);
  const [branches, setBranches] = useState(BRANCHES_SEED);
  const [employees, setEmployees] = useState([]);
  const [leaves, setLeaves] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [vehicles, setVehicles] = useState([]);
  const [payrollItems, setPayrollItems] = useState([]);
  const [gosiRates, setGosiRates] = useState({
    saudiEmployee: 9.75,
    saudiEmployer: 11.75,
    nonSaudiEmployer: 2,
  });
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState("");
  const [syncError, setSyncError] = useState("");
  const [showChangePassword, setShowChangePassword] = useState(false);
  const lastSyncedRef = useRef("");

  /* الاستماع لحظيًا لبيانات النظام من Firestore — أي تعديل من أي جهاز يوصل هنا فورًا */
  useEffect(() => {
    const unsub = DATA_DOC.onSnapshot(
      (snap) => {
        /* نتجاهل النسخة المحلية غير المؤكدة من الخادم بعد (كتابتنا إحنا) لتفادي قطع الكتابة أثناء الكتابة */
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        if (d) {
          const next = {
            entities: d.entities || ENTITIES_SEED,
            branches: d.branches || BRANCHES_SEED,
            employees: d.employees || [],
            leaves: d.leaves || [],
            attendance: d.attendance || [],
            gosiRates: d.gosiRates || { saudiEmployee: 9.75, saudiEmployer: 11.75, nonSaudiEmployer: 2 },
            vehicles: d.vehicles || [],
            payrollItems: d.payrollItems || [],
          };
          setEntities(next.entities);
          setBranches(next.branches);
          setEmployees(next.employees);
          setLeaves(next.leaves);
          setAttendance(next.attendance);
          setVehicles(next.vehicles);
          setGosiRates(next.gosiRates);
          setPayrollItems(next.payrollItems);
          lastSyncedRef.current = JSON.stringify(next);
        } else {
          /* أول مرة يتشغّل فيها النظام: أنشئ المستند بالبيانات الافتراضية */
          DATA_DOC.set({ entities: ENTITIES_SEED, branches: BRANCHES_SEED, employees: [], leaves: [], attendance: [], vehicles: [], gosiRates, payrollItems: [] }).catch(() => {});
        }
        setSyncError("");
        setLoaded(true);
      },
      (err) => {
        setSyncError("تعذر الاتصال بقاعدة البيانات المشتركة — تحقّق من اتصال الإنترنت");
        setLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  /* حفظ ومزامنة تلقائية إلى Firestore — تنعكس فورًا على كل الأجهزة المتصلة */
  useEffect(() => {
    if (!loaded) return;
    const payload = { entities, branches, employees, leaves, attendance, gosiRates, vehicles, payrollItems };
    const json = JSON.stringify(payload);
    if (json === lastSyncedRef.current) return;
    const t = setTimeout(() => {
      DATA_DOC.set(payload)
        .then(() => {
          lastSyncedRef.current = json;
          setSaveMsg("تمت المزامنة ✓");
          setTimeout(() => setSaveMsg(""), 1500);
        })
        .catch(() => setSaveMsg("تعذر الحفظ — تحقّق من الإنترنت"));
    }, 400);
    return () => clearTimeout(t);
  }, [entities, branches, employees, leaves, attendance, gosiRates, vehicles, payrollItems, loaded]);

  const branchName = (id) => branches.find((b) => b.id === id)?.name || "—";
  const entityName = (id) => entities.find((e) => e.id === id)?.name || "—";
  const entityOfBranch = (branchId) => branches.find((b) => b.id === branchId)?.entityId;

  /* نطاق البيانات حسب الصلاحية: مسؤول الفرع يشوف فرعه فقط، مدير الكيان يشوف كل فروع كيانه فقط */
  const scopedEntities = isEntityManager ? entities.filter((e) => e.id === currentUser.entityId) : entities;
  const scopedBranches = isBranchManager
    ? branches.filter((b) => b.id === currentUser.branchId)
    : isEntityManager
    ? branches.filter((b) => b.entityId === currentUser.entityId)
    : branches;
  const scopedEmployees = isBranchManager
    ? employees.filter((e) => e.branchId === currentUser.branchId)
    : isEntityManager
    ? employees.filter((e) => scopedBranches.some((b) => b.id === e.branchId))
    : employees;
  const scopedLeaves = isBranchManager || isEntityManager
    ? leaves.filter((l) => scopedEmployees.some((e) => e.id === l.employeeId))
    : leaves;
  const scopedAttendance = isBranchManager || isEntityManager
    ? attendance.filter((a) => scopedEmployees.some((e) => e.id === a.employeeId))
    : attendance;
  const scopedVehicles = isBranchManager
    ? vehicles.filter((v) => v.branchId === currentUser.branchId)
    : isEntityManager

/* تحويل تاريخ ميلادي إلى هجري للعرض جنب حقل التاريخ (بدون اتصال إنترنت، عبر Intl المدمجة في المتصفح) */
function toHijri(dateStr) {
  if (!dateStr) return "";
  try {
    const d = new Date(dateStr + "T00:00:00");
    if (isNaN(d)) return "";
    const parts = new Intl.DateTimeFormat("en-u-ca-islamic", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
    }).formatToParts(d);
    const get = (t) => parts.find((p) => p.type === t)?.value || "";
    return `${get("year")}/${get("month")}/${get("day")} هـ`;
  } catch (e) {
    return "";
  }
}

function HijriNote({ dateStr }) {
  const h = toHijri(dateStr);
  if (!h) return null;
  return <div style={{ fontSize: 10, color: "#a3927a", marginTop: 2 }}>{h}</div>;
}

/* حالة تاريخ (إقامة/عقد) حسب الأيام المتبقية */
function expiryStatus(dateStr, t) {
  const tr = t || ((ar) => ar);
  if (!dateStr) return { label: tr("غير محدد", "Not set"), tone: "gold", days: null };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const d = new Date(dateStr);
  const days = Math.round((d - today) / (1000 * 60 * 60 * 24));
  if (days < 0) return { label: tr(`منتهية منذ ${Math.abs(days)} يوم`, `Expired ${Math.abs(days)} days ago`), tone: "brick", days };
  if (days <= 30) return { label: tr(`تنتهي خلال ${days} يوم`, `Expires in ${days} days`), tone: "brick", days };
  if (days <= 90) return { label: tr(`تنتهي خلال ${days} يوم`, `Expires in ${days} days`), tone: "gold", days };
  return { label: tr(`سارية (${days} يوم متبقي)`, `Valid (${days} days left)`), tone: "green", days };
}

                  t("الفرع", "Branch"),
                  t("الوظيفة", "Position"),
                  t("الجنسية", "Nationality"),
                  t("الراتب", "Salary"),
                  t("تاريخ التعيين", "Hire Date"),
                  t("الحالة", "Status"),
                  "",
                ].map((h, i) => (
                  <th key={i} style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.coffee }}>
                    {h}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {list.map((e) => (
                <tr key={e.id} style={{ borderTop: `1px dashed ${COLORS.line}` }}>
                  <td
                    style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.brick, cursor: "pointer", textDecoration: "underline dotted" }}
                    onClick={() => setProfileEmp(e)}
                    title={t("عرض الملف الكامل", "View full profile")}
                  >
                    {e.name}
                  </td>
                  <td style={{ padding: "9px 12px" }}>{branches.find((b) => b.id === e.branchId)?.name || "—"}</td>
                  <td style={{ padding: "9px 12px" }}>{e.position}</td>
                  <td style={{ padding: "9px 12px" }}>{trLabel(t, NATIONALITY_LABELS_EN, e.nationality)}</td>
                  <td style={{ padding: "9px 12px", fontFamily: "Consolas, monospace" }}>{fmt(e.salary)} ﷼</td>
                  <td style={{ padding: "9px 12px" }}>{e.joinDate || "—"}</td>
                  <td style={{ padding: "9px 12px" }}>
                    <Stamp tone={e.status === "نشط" ? "green" : e.status === "موقوف" ? "gold" : "brick"}>{trLabel(t, STATUS_LABELS_EN, e.status)}</Stamp>
                  </td>
                  <td style={{ padding: "9px 12px", display: "flex", gap: 6 }} className="no-print">
                    <Btn small tone="secondary" onClick={() => edit(e)}>{t("تعديل", "Edit")}</Btn>
                    <Btn small tone="danger" onClick={() => remove(e.id)}>{t("حذف", "Delete")}</Btn>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      </div>

      {profileEmp && (
        <EmployeeProfileModal
          emp={employees.find((e) => e.id === profileEmp.id) || profileEmp}
          branches={branches}
          leaves={leaves || []}
          onAddCareerEntry={addCareerEntry}
          onRemoveCareerEntry={removeCareerEntry}
          onUpdateGovFees={updateGovFees}
          onClose={() => setProfileEmp(null)}
        />
      )}
    </div>
  );
}

/* ============ الملف الشخصي الكامل للموظف ============ */
function EmployeeProfileModal({ emp, branches, leaves, onAddCareerEntry, onRemoveCareerEntry, onUpdateGovFees, onClose }) {
  const { t } = useLang();
  const [careerForm, setCareerForm] = useState({ date: new Date().toISOString().slice(0, 10), title: "", note: "" });
  const [feesForm, setFeesForm] = useState({
    iqamaRenewal: emp.govFees?.iqamaRenewal ?? "",
    workPermit: emp.govFees?.workPermit ?? 100,
    dependentsLevy: emp.govFees?.dependentsLevy ?? 800,
    other: emp.govFees?.other ?? "",
  });

  const branchName = branches.find((b) => b.id === emp.branchId)?.name || "—";
  const iqamaSt = expiryStatus(emp.iqamaExpiry, t);
  const contractSt = expiryStatus(emp.contractEnd, t);
  const empLeaves = (leaves || []).filter((l) => l.employeeId === emp.id);
  const leaveDays = (l) => {
    if (!l.from || !l.to) return 0;
    const d = Math.round((new Date(l.to) - new Date(l.from)) / 86400000) + 1;
    return d > 0 ? d : 0;
  };
  const totalLeaveDays = empLeaves.reduce((s, l) => s + leaveDays(l), 0);
  const leaveBal = leaveBalanceInfo(emp, leaves);
  const career = [...(emp.careerHistory || [])].sort((a, b) => (a.date < b.date ? 1 : -1));

  const addCareer = () => {
    if (!careerForm.title || !careerForm.date) return;
    onAddCareerEntry(emp.id, careerForm);
    setCareerForm({ date: new Date().toISOString().slice(0, 10), title: "", note: "" });
  };

  const feesTotal =
    Number(feesForm.iqamaRenewal || 0) +
    Number(feesForm.workPermit || 0) +
    Number(feesForm.dependentsLevy || 0) +
    Number(feesForm.other || 0);

  const saveFees = () => {
    onUpdateGovFees &&
      onUpdateGovFees(emp.id, {
        iqamaRenewal: Number(feesForm.iqamaRenewal || 0),
        workPermit: Number(feesForm.workPermit || 0),
        dependentsLevy: Number(feesForm.dependentsLevy || 0),
        other: Number(feesForm.other || 0),
      });
  };

  const Section = ({ title, children }) => (
    <div style={{ marginBottom: 18 }}>
      <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.coffee, marginBottom: 10, borderBottom: `1px dashed ${COLORS.line}`, paddingBottom: 6 }}>
        {title}
      </div>
      {children}
    </div>
  );

  const InfoRow = ({ label, value }) => (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12.5, padding: "5px 0" }}>
      <span style={{ color: "#a3927a" }}>{label}</span>
      <span style={{ fontWeight: 700, color: COLORS.espresso }}>{value || "—"}</span>
    </div>
  );

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(36,24,17,0.55)",
        zIndex: 60,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 20,
      }}
      onClick={onClose}
    >
      <div
        style={{
          background: "#fff",
          borderRadius: 12,
          maxWidth: 680,
          width: "100%",
          maxHeight: "92vh",
          overflow: "auto",
          boxShadow: "0 20px 60px rgba(0,0,0,0.35)",
        }}
        onClick={(ev) => ev.stopPropagation()}
      >
        <div
          style={{
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            padding: "14px 20px",
            borderBottom: `1px solid ${COLORS.line}`,
            position: "sticky",
            top: 0,
            background: "#fff",
            zIndex: 2,
            borderRadius: "12px 12px 0 0",
          }}
        >
          <div>
            <div style={{ fontWeight: 800, color: COLORS.espresso, fontSize: 15 }}>{emp.name}</div>
            <div style={{ fontSize: 11.5, color: "#a3927a" }}>{emp.position} — {branchName}</div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            <Stamp tone={emp.status === "نشط" ? "green" : emp.status === "موقوف" ? "gold" : "brick"}>
              {trLabel(t, STATUS_LABELS_EN, emp.status)}
            </Stamp>
            <Btn small tone="secondary" onClick={onClose}>{t("إغلاق ✕", "Close ✕")}</Btn>
          </div>
        </div>

        <div style={{ padding: 20 }}>
          <Section title={t("البيانات الأساسية", "Basic Information")}>
            <InfoRow label={t("رقم الهوية / الإقامة", "National ID / Iqama No.")} value={emp.nationalId} />
            <InfoRow label={t("الجنسية", "Nationality")} value={trLabel(t, NATIONALITY_LABELS_EN, emp.nationality)} />
            <InfoRow label={t("الفرع", "Branch")} value={branchName} />
            <InfoRow label={t("المسمى الوظيفي", "Job Title")} value={emp.position} />
            <InfoRow label={t("تاريخ التعيين", "Hire Date")} value={emp.joinDate} />
            <InfoRow label={t("رقم الجوال", "Mobile Number")} value={emp.phone} />
          </Section>

          <Section title={t("الراتب", "Salary")}>
            <InfoRow label={t("الراتب الأساسي", "Basic Salary")} value={`${fmt(emp.salary)} ﷼`} />
          </Section>

          <Section title={t("الإقامة والعقد", "Iqama & Contract")}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0" }}>
              <span style={{ fontSize: 12.5, color: "#a3927a" }}>{t("تاريخ انتهاء الإقامة", "Iqama Expiry")}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 700, fontSize: 12.5 }}>{emp.iqamaExpiry || "—"}</span>
                <Stamp tone={iqamaSt.tone}>{iqamaSt.label}</Stamp>
              </div>
            </div>
            <InfoRow label={t("المهنة على الإقامة", "Profession on Iqama")} value={emp.iqamaProfession} />
            <InfoRow label={t("نوع العقد", "Contract Type")} value={trLabel(t, CONTRACT_TYPE_LABELS_EN, emp.contractType)} />
            <InfoRow label={t("بداية العقد", "Contract Start")} value={emp.contractStart} />
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0" }}>
              <span style={{ fontSize: 12.5, color: "#a3927a" }}>{t("نهاية العقد", "Contract End")}</span>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontWeight: 700, fontSize: 12.5 }}>{emp.contractEnd || "—"}</span>
                <Stamp tone={contractSt.tone}>
                  {emp.contractType === "غير محدد المدة" && !emp.contractEnd ? t("عقد مفتوح", "Open-ended") : contractSt.label}
                </Stamp>
              </div>
            </div>
          </Section>

          <Section title={t("الرسوم الحكومية", "Government Fees")}>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginBottom: 10 }}>
              <Field label={t("رسوم تجديد الإقامة (﷼)", "Iqama Renewal Fee (SAR)")}>
                <input
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  value={feesForm.iqamaRenewal}
                  onChange={(e) => {
                    const v = e.target.value.replace(/[^0-9.]/g, "");
                    setFeesForm({ ...feesForm, iqamaRenewal: v });
                  }}
                  onBlur={saveFees}
                />
              </Field>
              <Field label={t("رسوم رخصة العمل (﷼)", "Work Permit Fee (SAR)")}>
                <input
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  value={feesForm.workPermit}
                  onChange={(e) => {
                    const v = e.target.value.replace(/[^0-9.]/g, "");
                    setFeesForm({ ...feesForm, workPermit: v });
                  }}
                  onBlur={saveFees}
                />
              </Field>
              <Field label={t("المقابل المالي للعمالة (﷼)", "Expat Levy (SAR)")}>
                <input
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  value={feesForm.dependentsLevy}
                  onChange={(e) => {
                    const v = e.target.value.replace(/[^0-9.]/g, "");
                    setFeesForm({ ...feesForm, dependentsLevy: v });
                  }}
                  onBlur={saveFees}
                />
              </Field>
              <Field label={t("رسوم أخرى (﷼)", "Other Fees (SAR)")}>
                <input
                  type="text"
                  inputMode="decimal"
                  dir="ltr"
                  style={{ ...inputStyle, textAlign: "right" }}
                  value={feesForm.other}
                  onChange={(e) => {
                    const v = e.target.value.replace(/[^0-9.]/g, "");
                    setFeesForm({ ...feesForm, other: v });
                  }}
                  onBlur={saveFees}
                />
              </Field>
            </div>
            <div style={{ background: COLORS.paperDark, borderRadius: 8, padding: "10px 12px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12.5, color: "#a3927a" }}>{t("إجمالي الرسوم الحكومية", "Total Government Fees")}</span>
              <span style={{ fontWeight: 800, fontSize: 14, color: COLORS.brick }}>{fmt(feesTotal)} ﷼</span>
            </div>
            <div style={{ fontSize: 10.5, color: "#a3927a", marginTop: 6 }}>
              {t("القيم بتتحفظ تلقائيًا عند الخروج من كل خانة.", "Values save automatically when you leave each field.")}
            </div>
          </Section>

          <Section title={`${t("المسار الوظيفي", "Career Path")} (${career.length})`}>
            <div style={{ display: "flex", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
              <input type="date" style={{ ...inputStyle, maxWidth: 140 }} value={careerForm.date} onChange={(e) => setCareerForm({ ...careerForm, date: e.target.value })} />
              <input
                style={{ ...inputStyle, maxWidth: 200 }}
                placeholder={t("مثال: ترقية إلى مشرف فرع", "e.g. Promoted to Branch Supervisor")}
                value={careerForm.title}
                onChange={(e) => setCareerForm({ ...careerForm, title: e.target.value })}
              />
              <input
                style={{ ...inputStyle, maxWidth: 200 }}
                placeholder={t("ملاحظة (اختياري)", "Note (optional)")}
                value={careerForm.note}
                onChange={(e) => setCareerForm({ ...careerForm, note: e.target.value })}
              />
              <Btn small onClick={addCareer}>{t("إضافة", "Add")}</Btn>
            </div>
            {career.length === 0 && <Empty text={t("لا يوجد سجل مسار وظيفي بعد", "No career history recorded yet")} />}
            {career.map((h) => (
              <div key={h.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderTop: `1px dashed ${COLORS.line}` }}>
                <div>
                  <div style={{ fontSize: 12.5, fontWeight: 700, color: COLORS.espresso }}>{h.title}</div>
                  {h.note && <div style={{ fontSize: 11, color: "#a3927a" }}>{h.note}</div>}
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ fontSize: 11, color: "#a3927a" }}>{h.date}</span>
                  <Btn small tone="danger" onClick={() => onRemoveCareerEntry(emp.id, h.id)}>{t("حذف", "Delete")}</Btn>
                </div>
              </div>
            ))}
          </Section>

          <Section title={`${t("الإجازات", "Leaves")} — ${t(`إجمالي ${totalLeaveDays} يوم`, `Total ${totalLeaveDays} days`)}`}>
            {leaveBal && (
              <div style={{ background: COLORS.paperDark, borderRadius: 8, padding: "10px 12px", marginBottom: 10, display: "flex", flexWrap: "wrap", gap: "4px 18px" }}>
                <span style={{ fontSize: 12 }}>{t("الاستحقاق السنوي", "Annual Entitlement")}: <b>{fmt(leaveBal.perYear)} {t("يوم", "days")}</b></span>
                <span style={{ fontSize: 12 }}>{t("الرصيد المتراكم", "Accrued to Date")}: <b>{fmt(leaveBal.accrued)} {t("يوم", "days")}</b></span>
                <span style={{ fontSize: 12 }}>{t("المستخدم (سنة الخدمة الحالية)", "Used (Current Service Year)")}: <b>{fmt(leaveBal.usedDays)} {t("يوم", "days")}</b></span>
                {leaveBal.adjustment !== 0 && (
                  <span style={{ fontSize: 12 }}>
                    {t("تسوية يدوية", "Manual Adjustment")}: <b>{leaveBal.adjustment > 0 ? "+" : ""}{fmt(leaveBal.adjustment)} {t("يوم", "days")}</b>
                  </span>
                )}
                <span style={{ fontSize: 12, color: leaveBal.balance < 0 ? COLORS.brick : COLORS.green }}>
                  {t("الرصيد المتبقي", "Remaining Balance")}: <b>{fmt(leaveBal.balance)} {t("يوم", "days")}</b>
                </span>
                <span style={{ fontSize: 10.5, color: "#a3927a", width: "100%" }}>
                  {t(`محسوب منذ ذكرى التعيين ${leaveBal.anniversaryDate} (${leaveBal.monthsCompleted} شهر مكتمل)`, `Calculated since anniversary ${leaveBal.anniversaryDate} (${leaveBal.monthsCompleted} completed months)`)}
                </span>
              </div>
            )}
            {empLeaves.length === 0 && <Empty text={t("لا توجد إجازات مسجّلة لهذا الموظف", "No leaves recorded for this employee")} />}
            {empLeaves.map((l, i) => (
              <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderTop: `1px dashed ${COLORS.line}` }}>
                <Stamp tone="gold">{trLabel(t, LEAVE_TYPE_LABELS_EN, l.type)}</Stamp>
                <span style={{ fontSize: 12.5 }}>{l.from} → {l.to}</span>
                <span style={{ fontSize: 11.5, color: "#a3927a" }}>{t(`${leaveDays(l)} يوم`, `${leaveDays(l)} days`)}</span>
              </div>
            ))}
          </Section>
        </div>
      </div>
    </div>
  );
}

/* ============ الإقامات والعقود ============ */
function IqamasContractsTab({ employees, setEmployees, branches }) {
  const { t } = useLang();
  const [filterUrgency, setFilterUrgency] = useState("");

  const update = (id, field, value) => {
    setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  };

  const nonSaudi = employees.filter((e) => e.status === "نشط");

  const rows = nonSaudi.map((e) => ({
    ...e,
    iqamaStatus: expiryStatus(e.iqamaExpiry, t),
    contractStatus: expiryStatus(e.contractEnd, t),
  }));

  const filtered = rows.filter((r) => {
    if (!filterUrgency) return true;
    if (filterUrgency === "iqama") return r.iqamaStatus.days !== null && r.iqamaStatus.days <= 90;
    if (filterUrgency === "contract") return r.contractStatus.days !== null && r.contractStatus.days <= 90;
    return true;
  });

  const iqamaAlerts = rows.filter((r) => r.iqamaStatus.days !== null && r.iqamaStatus.days <= 30).length;
  const contractAlerts = rows.filter((r) => r.contractStatus.days !== null && r.contractStatus.days <= 30).length;

  return (
    <div>
      <Header title={t("الإقامات والعقود", "Iqamas & Contracts")} subtitle={t("متابعة تواريخ انتهاء الإقامات وعقود العمل لتفادي الغرامات وتجديد العقود في وقتها", "Track iqama and contract expiry dates to avoid fines and renew on time")} />

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }}>
        <ReceiptCard label={t("إقامات تنتهي خلال ٣٠ يوم", "Iqamas expiring within 30 days")} value={fmt(iqamaAlerts)} tone={iqamaAlerts > 0 ? COLORS.brick : COLORS.green} />
        <ReceiptCard label={t("عقود تنتهي خلال ٣٠ يوم", "Contracts expiring within 30 days")} value={fmt(contractAlerts)} tone={contractAlerts > 0 ? COLORS.brick : COLORS.green} />
        <ReceiptCard label={t("إجمالي الموظفين النشطين", "Total Active Employees")} value={fmt(rows.length)} />
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }} className="no-print">
        <SectionTitle>{t("جدول المتابعة", "Tracking Table")}</SectionTitle>
        <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
          <select style={{ ...inputStyle, maxWidth: 260 }} value={filterUrgency} onChange={(e) => setFilterUrgency(e.target.value)}>
            <option value="">{t("عرض الكل", "Show All")}</option>
            <option value="iqama">{t("إقامات مقتربة من الانتهاء (٩٠ يوم)", "Iqamas nearing expiry (90 days)")}</option>
            <option value="contract">{t("عقود مقتربة من الانتهاء (٩٠ يوم)", "Contracts nearing expiry (90 days)")}</option>
          </select>
          <Btn onClick={() => window.print()}>{t("🖶 طباعة الجدول", "🖶 Print Table")}</Btn>
        </div>
      </div>

      <div className="print-section">
        <div style={{ display: "none" }} className="print-only-title">
          <div className="print-brand">{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          {t("الإقامات والعقود", "Iqamas & Contracts")}
        </div>
        <div style={{ display: "none" }} className="print-only-meta">
          <span>{t(`تاريخ الطباعة: ${new Date().toLocaleDateString("ar-SA")}`, `Print Date: ${new Date().toLocaleDateString("en-US")}`)}</span>
          <span>{filtered.length} {t("سجل", "records")}</span>
        </div>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "auto" }}>
        {filtered.length === 0 && <Empty text={t("لا توجد بيانات مطابقة", "No matching data")} />}
        {filtered.length > 0 && (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, minWidth: 980 }}>
            <thead>
              <tr style={{ background: COLORS.paperDark, textAlign: "right" }}>
                {[
                  t("الاسم", "Name"),
                  t("الفرع", "Branch"),
                  t("الجنسية", "Nationality"),
                  t("رقم الهوية/الإقامة", "National ID/Iqama No."),
                  t("انتهاء الإقامة", "Iqama Expiry"),
                  t("حالة الإقامة", "Iqama Status"),
                  t("نوع العقد", "Contract Type"),
                  t("نهاية العقد", "Contract End"),
                  t("حالة العقد", "Contract Status"),
                ].map((h, i) => (
                  <th key={i} style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.coffee }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((r) => (
                <tr key={r.id} style={{ borderTop: `1px dashed ${COLORS.line}` }}>
                  <td style={{ padding: "9px 12px", fontWeight: 700 }}>{r.name}</td>
                  <td style={{ padding: "9px 12px" }}>{branches.find((b) => b.id === r.branchId)?.name || "—"}</td>
                  <td style={{ padding: "9px 12px" }}>{trLabel(t, NATIONALITY_LABELS_EN, r.nationality)}</td>
                  <td style={{ padding: "9px 12px", fontFamily: "Consolas, monospace" }}>{r.nationalId || "—"}</td>
                  <td style={{ padding: "9px 12px" }}>
                    <input
                      type="date"
                      style={{ ...inputStyle, padding: "5px 8px", fontSize: 12 }}
                      value={r.iqamaExpiry || ""}
                      onChange={(e) => update(r.id, "iqamaExpiry", e.target.value)}
                    />
                    <HijriNote dateStr={r.iqamaExpiry} />
                  </td>
                  <td style={{ padding: "9px 12px" }}>
                    <Stamp tone={r.iqamaStatus.tone}>{r.iqamaStatus.label}</Stamp>
                  </td>
                  <td style={{ padding: "9px 12px" }}>
                    <select
                      style={{ ...inputStyle, padding: "5px 8px", fontSize: 12 }}
                      value={r.contractType || "محدد المدة"}
                      onChange={(e) => update(r.id, "contractType", e.target.value)}

                      <option value="محدد المدة">{t("محدد المدة", "Fixed-term")}</option>
                      <option value="غير محدد المدة">{t("غير محدد المدة", "Unlimited")}</option>
                    </select>
                  </td>
                  <td style={{ padding: "9px 12px" }}>
                    <input
                      type="date"
                      style={{ ...inputStyle, padding: "5px 8px", fontSize: 12 }}
                      value={r.contractEnd || ""}
                      onChange={(e) => update(r.id, "contractEnd", e.target.value)}
                    />

const EMPTY_BRANCH_LICENSE = {
  crNumber: "",
  crExpiry: "",
  civilDefenseNumber: "",
  civilDefenseExpiry: "",
  municipalityNumber: "",
  municipalityExpiry: "",
};

const EMPTY_VEHICLE = {
  branchId: "",
  plateNumber: "",
  make: "",
  istimaraExpiry: "",
  periodicInspectionExpiry: "",
  insuranceCompany: "",
  insurancePolicyNumber: "",
  insuranceExpiry: "",
};

function BranchLicensesTab({ branches, setBranches, employees, setEmployees, vehicles, setVehicles }) {
  const { t } = useLang();
  const [filterUrgency, setFilterUrgency] = useState("");
  const [vehicleForm, setVehicleForm] = useState(EMPTY_VEHICLE);
  const [editingVehicleId, setEditingVehicleId] = useState(null);

  const updateBranch = (id, field, value) => {
    setBranches((prev) => prev.map((b) => (b.id === id ? { ...b, [field]: value } : b)));
  };

  const updateEmployee = (id, field, value) => {
    setEmployees((prev) => prev.map((e) => (e.id === id ? { ...e, [field]: value } : e)));
  };

  const resetVehicleForm = () => {
    setVehicleForm(EMPTY_VEHICLE);
    setEditingVehicleId(null);
  };

  const submitVehicle = () => {
    if (!vehicleForm.plateNumber || !vehicleForm.branchId) return;
    if (editingVehicleId) {
      setVehicles((prev) => prev.map((v) => (v.id === editingVehicleId ? { ...vehicleForm, id: editingVehicleId } : v)));
    } else {
      setVehicles((prev) => [...prev, { ...vehicleForm, id: uid() }]);
    }
    resetVehicleForm();
  };

  const editVehicle = (v) => {
    setVehicleForm(v);
    setEditingVehicleId(v.id);
  };

  const removeVehicle = (id) => {
    setVehicles((prev) => prev.filter((v) => v.id !== id));
    if (editingVehicleId === id) resetVehicleForm();
  };

  const updateVehicle = (id, field, value) => {
    setVehicles((prev) => prev.map((v) => (v.id === id ? { ...v, [field]: value } : v)));
  };

  const branchRows = branches.map((b) => ({
    ...b,
    crStatus: expiryStatus(b.crExpiry, t),
    civilDefenseStatus: expiryStatus(b.civilDefenseExpiry, t),
    municipalityStatus: expiryStatus(b.municipalityExpiry, t),
  }));

  const activeEmployees = employees.filter((e) => e.status === "نشط");
  const healthRows = activeEmployees.map((e) => ({
    ...e,
    healthCertStatus: expiryStatus(e.healthCertExpiry, t),
    insuranceStatus: expiryStatus(e.insuranceExpiry, t),
  }));

  const vehicleRows = vehicles.map((v) => ({
    ...v,
    istimaraStatus: expiryStatus(v.istimaraExpiry, t),
    periodicInspectionStatus: expiryStatus(v.periodicInspectionExpiry, t),
    vehicleInsuranceStatus: expiryStatus(v.insuranceExpiry, t),
  }));

  const filteredBranchRows = branchRows.filter((r) => {
    if (!filterUrgency) return true;
    if (filterUrgency === "cr") return r.crStatus.days !== null && r.crStatus.days <= 90;
    if (filterUrgency === "civilDefense") return r.civilDefenseStatus.days !== null && r.civilDefenseStatus.days <= 90;
    if (filterUrgency === "municipality") return r.municipalityStatus.days !== null && r.municipalityStatus.days <= 90;
    return true;
  });

  const crAlerts = branchRows.filter((r) => r.crStatus.days !== null && r.crStatus.days <= 30).length;
  const civilDefenseAlerts = branchRows.filter((r) => r.civilDefenseStatus.days !== null && r.civilDefenseStatus.days <= 30).length;
  const municipalityAlerts = branchRows.filter((r) => r.municipalityStatus.days !== null && r.municipalityStatus.days <= 30).length;
  const healthAlerts = healthRows.filter((r) => r.healthCertStatus.days !== null && r.healthCertStatus.days <= 30).length;
  const insuranceAlerts = healthRows.filter((r) => r.insuranceStatus.days !== null && r.insuranceStatus.days <= 30).length;
  const istimaraAlerts = vehicleRows.filter((r) => r.istimaraStatus.days !== null && r.istimaraStatus.days <= 30).length;
  const periodicInspectionAlerts = vehicleRows.filter((r) => r.periodicInspectionStatus.days !== null && r.periodicInspectionStatus.days <= 30).length;
  const vehicleInsuranceAlerts = vehicleRows.filter((r) => r.vehicleInsuranceStatus.days !== null && r.vehicleInsuranceStatus.days <= 30).length;

/* ============ الرواتب و GOSI ============ */
function PayrollTab({ employees, branches, entities, entityOfBranch, gosiRates, attendance, leaves, payrollItems, setPayrollItems, logActivity }) {
  const { t } = useLang();
  const [branchFilter, setBranchFilter] = useState("");
  const [month, setMonth] = useState(new Date().toISOString().slice(0, 7));
  const [itemForm, setItemForm] = useState({ employeeId: "", type: "سلفة", amount: "", month: new Date().toISOString().slice(0, 7), note: "" });
  const [payslip, setPayslip] = useState(null);

  const addItem = () => {
    if (!itemForm.employeeId || !itemForm.amount || Number(itemForm.amount) <= 0) return;
    setPayrollItems((prev) => [...prev, { ...itemForm, amount: Number(itemForm.amount), id: uid() }]);
    logActivity && logActivity(`تسجيل ${itemForm.type}`, "payroll", `${empName(itemForm.employeeId)} — ${fmt(Number(itemForm.amount))} ﷼`);
    setItemForm({ employeeId: "", type: itemForm.type, amount: "", month: itemForm.month, note: "" });
  };
  const removeItem = (id) => setPayrollItems((prev) => prev.filter((p) => p.id !== id));
  const empName = (id) => employees.find((e) => e.id === id)?.name || "—";

  const rows = employees
    .filter((e) => e.status === "نشط")
    .filter((e) => !branchFilter || e.branchId === branchFilter)
    .map((e) => {
      const salary = Number(e.salary || 0);
      const isSaudi = e.nationality === "سعودي";
      const empShare = isSaudi ? (salary * gosiRates.saudiEmployee) / 100 : 0;
      const employerShare = isSaudi ? (salary * gosiRates.saudiEmployer) / 100 : (salary * gosiRates.nonSaudiEmployer) / 100;

      /* احتساب الغياب والتأخير والإجازة بدون راتب لهذا الموظف خلال الشهر المختار */
      const dailyRate = salary / 30;
      const perMinuteRate = dailyRate / (8 * 60); /* على أساس ٨ ساعات عمل فعلية يوميًا */

      const monthAttendance = attendance.filter((a) => a.employeeId === e.id && (a.date || "").startsWith(month));
      const absentDays = monthAttendance.filter((a) => a.status === "غائب").length;
      const lateMinutesTotal = monthAttendance
        .filter((a) => a.status === "متأخر")
        .reduce((s, a) => s + Number(a.lateMinutes || 0), 0);

      const unpaidLeaveDays = leaves
        .filter((l) => l.employeeId === e.id && l.type === "بدون راتب")
        .reduce((s, l) => s + daysOverlapInMonth(l.from, l.to, month), 0);

      const absentDeduction = absentDays * dailyRate;
      const lateDeduction = lateMinutesTotal * perMinuteRate;
      const unpaidLeaveDeduction = unpaidLeaveDays * dailyRate;
      const attendanceDeduction = absentDeduction + lateDeduction + unpaidLeaveDeduction;

      /* الوقت الإضافي: ساعات الإضافي المسجّلة هذا الشهر × سعر الساعة × ١٫٥ (وفق نظام العمل السعودي) */
      const hourlyRate = dailyRate / 8;
      const overtimeHours = monthAttendance.reduce((s, a) => s + Number(a.overtimeHours || 0), 0);
      const overtimePay = overtimeHours * hourlyRate * 1.5;

      /* السلف والخصومات والحوافز المسجّلة لهذا الموظف في الشهر المختار */
      const monthItems = payrollItems.filter((p) => p.employeeId === e.id && p.month === month);
      const advances = monthItems.filter((p) => p.type === "سلفة").reduce((s, p) => s + Number(p.amount || 0), 0);
      const extraDeductions = monthItems.filter((p) => p.type === "خصم").reduce((s, p) => s + Number(p.amount || 0), 0);
      const incentives = monthItems.filter((p) => p.type === "حافز").reduce((s, p) => s + Number(p.amount || 0), 0);

      const net = salary - empShare - attendanceDeduction - advances - extraDeductions + incentives + overtimePay;
      return {
        ...e,
        salary,
        empShare,
        employerShare,
        dailyRate,
        absentDays,
        absentDeduction,
        lateMinutesTotal,
        lateDeduction,
        unpaidLeaveDays,
        unpaidLeaveDeduction,
        attendanceDeduction,
        overtimeHours,
        overtimePay,
        advances,
        extraDeductions,

          'احتساب الخصومات: راتب اليوم = الراتب الأساسي ÷ ٣٠. خصم الغياب = أيام الغياب × راتب اليوم. خصم التأخير = دقائق التأخير × (راتب اليوم ÷ ٤٨٠ دقيقة، على أساس ٨ ساعات عمل يوميًا). خصم الإجازة بدون راتب = أيامها × راتب اليوم. احتساب الوقت الإضافي: سعر الساعة = راتب اليوم ÷ ٨، وقيمة الإضافي = ساعات الإضافي المسجّلة × سعر الساعة × ١٫٥ (وفق نظام العمل السعودي). البيانات مبنية على سجلات تبويب "الحضور والإجازات" للشهر المختار أعلاه. الصافي للموظف = الراتب − حصة GOSI − خصومات الحضور − السلف − الخصومات الأخرى + الحوافز + قيمة الوقت الإضافي.',
          'Deduction calculation: Daily rate = Basic salary ÷ 30. Absence deduction = absent days × daily rate. Lateness deduction = late minutes × (daily rate ÷ 480 minutes, based on an 8-hour workday). Unpaid leave deduction = leave days × daily rate. Overtime calculation: Hourly rate = daily rate ÷ 8, and overtime pay = registered overtime hours × hourly rate × 1.5 (per Saudi labor law). Figures are based on records from the "Attendance & Leave" tab for the month selected above. Net for employee = Salary − GOSI share − attendance deductions − advances − other deductions + incentives + overtime pay.'
        )}
      </div>
    </div>
  );
}

/* ============ نهاية الخدمة ============ */
function EOSTab({ employees }) {
  const { t } = useLang();
  const [empId, setEmpId] = useState("");
  const [endDate, setEndDate] = useState(new Date().toISOString().slice(0, 10));
  const [reason, setReason] = useState("استقالة");

  const emp = employees.find((e) => e.id === empId);
  const years = emp ? yearsBetween(emp.joinDate, endDate) : 0;
  const salary = Number(emp?.salary || 0);

  const calc = () => {
    if (!emp || years <= 0) return { full: 0, adjusted: 0, ratio: 0 };
    const first5 = Math.min(years, 5) * 0.5 * salary;
    const after5 = Math.max(years - 5, 0) * 1 * salary;
    const full = first5 + after5;

    let ratio = 1;
    let note = "";
    if (reason === "استقالة") {
      if (years < 2) { ratio = 0; note = t("لا يستحق مكافأة (أقل من سنتين خدمة)", "Not entitled to a bonus (less than 2 years of service)"); }
      else if (years < 5) { ratio = 1 / 3; note = t("يستحق ثلث المكافأة (خدمة من ٢ إلى ٥ سنوات)", "Entitled to one-third of the bonus (2 to 5 years of service)"); }
      else if (years < 10) { ratio = 2 / 3; note = t("يستحق ثلثي المكافأة (خدمة من ٥ إلى ١٠ سنوات)", "Entitled to two-thirds of the bonus (5 to 10 years of service)"); }
      else { ratio = 1; note = t("يستحق المكافأة كاملة (خدمة ١٠ سنوات فأكثر)", "Entitled to the full bonus (10+ years of service)"); }
    } else {
      note = reason === "فصل من صاحب العمل" ? t("يستحق المكافأة كاملة (إنهاء من صاحب العمل)", "Entitled to the full bonus (terminated by employer)") : t("يستحق المكافأة كاملة", "Entitled to the full bonus");
    }
    return { full, adjusted: full * ratio, note };
  };

  const result = calc();

  return (
    <div>
      <Header title={t("حاسبة مكافأة نهاية الخدمة", "End of Service Benefit Calculator")} subtitle={t("وفق نظام العمل السعودي (المادتان ٨٤–٨٧) — نصف شهر عن كل سنة من أول ٥ سنوات، وشهر كامل عمّا زاد", "Per Saudi Labor Law (Articles 84–87) — half a month per year for the first 5 years, and a full month for each year after")} />

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 20 }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label={t("الموظف", "Employee")}>
            <select style={inputStyle} value={empId} onChange={(e) => setEmpId(e.target.value)}>
              <option value="">{t("اختر الموظف", "Select employee")}</option>
              {employees.map((e) => (
                <option key={e.id} value={e.id}>{e.name}</option>
              ))}
            </select>
          </Field>
          <Field label={t("تاريخ انتهاء الخدمة", "Service End Date")}>
            <input type="date" style={inputStyle} value={endDate} onChange={(e) => setEndDate(e.target.value)} />
          </Field>
          <Field label={t("سبب انتهاء الخدمة", "Reason for Termination")}>
            <select style={inputStyle} value={reason} onChange={(e) => setReason(e.target.value)}>
              <option value="استقالة">{t("استقالة", "Resignation")}</option>
              <option value="فصل من صاحب العمل">{t("فصل من صاحب العمل", "Termination by Employer")}</option>
              <option value="انتهاء عقد محدد المدة">{t("انتهاء عقد محدد المدة", "Fixed-term Contract End")}</option>
            </select>
          </Field>
        </div>
        {emp && (
          <div style={{ marginTop: 10, fontSize: 12, color: "#8a7a63" }}>
            {t("تاريخ التعيين", "Hire date")}: {emp.joinDate || "—"} · {t("الراتب الأساسي", "Basic salary")}: {fmt(salary)} ﷼ · {t("مدة الخدمة التقريبية", "Approx. length of service")}: {years.toFixed(2)} {t("سنة", "years")}
          </div>
        )}
      </div>

      {emp && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4, marginBottom: 4 }} className="no-print">
          <div />
          <Btn onClick={() => window.print()}>{t("🖶 طباعة مستند التسوية", "🖶 Print Settlement Document")}</Btn>
        </div>
      )}

      <div className="print-section">
        <div style={{ display: "none" }} className="print-only-title">
          <div className="print-brand">{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          {t("مستند تسوية نهاية الخدمة", "End of Service Settlement Document")}
        </div>
        <div style={{ display: "none" }} className="print-only-meta">
          <span>{t(`تاريخ الطباعة: ${new Date().toLocaleDateString("ar-SA")}`, `Print Date: ${new Date().toLocaleDateString("en-US")}`)}</span>
          <span>{emp ? (emp.name || "") : ""}</span>
        </div>
        {emp && (
          <div style={{ display: "flex", gap: 14, flexWrap: "wrap" }}>
            <ReceiptCard label={t("المكافأة الكاملة (نظريًا)", "Full Bonus (Theoretical)")} value={`${fmt(result.full)} ﷼`} />
            <ReceiptCard label={t("المكافأة المستحقة فعليًا", "Actual Bonus Due")} value={`${fmt(result.adjusted)} ﷼`} tone={COLORS.green} sub={result.note} />
          </div>
        )}
        {emp && (
          <div style={{ marginTop: 16, background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, fontSize: 12.5 }}>
            <div style={{ fontWeight: 700, marginBottom: 10, color: COLORS.espresso }}>{t("بيانات الموظف", "Employee Details")}</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "6px 20px" }}>
              <div><b>{t("الاسم", "Name")}:</b> {emp.name}</div>
              <div><b>{t("رقم الهوية/الإقامة", "National ID/Iqama No.")}:</b> {emp.nationalId || "—"}</div>
              <div><b>{t("تاريخ التعيين", "Hire Date")}:</b> {emp.joinDate || "—"}</div>
              <div><b>{t("تاريخ انتهاء الخدمة", "Service End Date")}:</b> {endDate}</div>
              <div><b>{t("مدة الخدمة", "Length of Service")}:</b> {years.toFixed(2)} {t("سنة", "years")}</div>
              <div><b>{t("سبب انتهاء الخدمة", "Reason")}:</b> {trLabel(t, EOS_REASON_LABELS_EN, reason)}</div>
              <div><b>{t("الراتب الأساسي", "Basic Salary")}:</b> {fmt(salary)} ﷼</div>
              <div><b>{t("المكافأة المستحقة", "Bonus Due")}:</b> {fmt(result.adjusted)} ﷼</div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 40 }}>
              <div style={{ textAlign: "center", width: "45%" }}>
                <div style={{ borderTop: `1px solid ${COLORS.ink}`, paddingTop: 6 }}>{t("توقيع الموظف", "Employee Signature")}</div>
              </div>
              <div style={{ textAlign: "center", width: "45%" }}>
                <div style={{ borderTop: `1px solid ${COLORS.ink}`, paddingTop: 6 }}>{t("توقيع الإدارة", "Management Signature")}</div>
              </div>
            </div>
          </div>
        )}
        {!emp && <Empty text={t("اختر موظفًا لعرض احتساب المكافأة", "Select an employee to see the bonus calculation")} />}
      </div>

      <div style={{ marginTop: 22, fontSize: 11.5, color: "#a3927a", background: "#fff", border: `1px dashed ${COLORS.line}`, borderRadius: 10, padding: 14 }} className="no-print">
        {t(
          "ملاحظة: هذا احتساب تقريبي يعتمد على الراتب الأساسي المسجَّل فقط. الاحتساب الرسمي وفق نظام العمل يشمل أحيانًا بنودًا إضافية من الأجر الشامل، وقد تختلف التفاصيل حسب نوع العقد ولائحة المنشأة — يُنصح بمراجعة مختص أو مكتب عمل قبل الاعتماد النهائي.",
          "Note: this is an approximate calculation based only on the recorded basic salary. The official calculation under labor law sometimes includes additional items from total wages, and details may vary by contract type and company policy — consult a specialist or labor office before final approval."
        )}
      </div>
    </div>
  );
}

    { x: 202, w: 20, h: 80 },
    { x: 222, w: 34, h: 150 },
    { x: 256, w: 26, h: 200, empire: true },
    { x: 282, w: 30, h: 110 },
    { x: 312, w: 22, h: 160 },
    { x: 334, w: 34, h: 90 },
    { x: 368, w: 26, h: 140 },
    { x: 394, w: 30, h: 100 },
    { x: 424, w: 24, h: 175, spire: true },

    { x: 480, w: 22, h: 85 },
    { x: 502, w: 30, h: 150 },
    { x: 532, w: 26, h: 105 },
    { x: 558, w: 34, h: 130 },
    { x: 592, w: 24, h: 90 },
    { x: 616, w: 30, h: 165 },
    { x: 646, w: 26, h: 110 },
    { x: 672, w: 28, h: 75 },
  ];
  const baseY = 240;

  return (
    <svg
      viewBox="0 0 700 240"
      preserveAspectRatio="none"
      style={{ position: "absolute", left: 0, right: 0, bottom: 0, width: "100%", height: "38vh", minHeight: 150, maxHeight: 260, zIndex: 0, pointerEvents: "none" }}
    >
      <defs>
        <linearGradient id="nySky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={COLORS.goldLight} stopOpacity="0.35" />
          <stop offset="100%" stopColor={COLORS.gold} stopOpacity="0.12" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="700" height="240" fill="url(#nySky)" />
      {buildings.map((b, i) => (
        <g key={i}>
          <rect x={b.x} y={baseY - b.h} width={b.w} height={b.h} fill={COLORS.espresso} opacity={0.85} />
          {b.empire && (
            <>
              <rect x={b.x + b.w * 0.32} y={baseY - b.h - 22} width={b.w * 0.36} height={22} fill={COLORS.espresso} opacity={0.85} />
              <rect x={b.x + b.w * 0.47} y={baseY - b.h - 34} width={b.w * 0.06} height={34} fill={COLORS.espresso} opacity={0.85} />
            </>
          )}
          {b.spire && (
            <polygon
              points={`${b.x + b.w * 0.5},${baseY - b.h - 16} ${b.x + b.w * 0.38},${baseY - b.h} ${b.x + b.w * 0.62},${baseY - b.h}`}
              fill={COLORS.espresso}
              opacity={0.85}
            />
          )}
          {/* نوافذ مضيئة */}
          {Array.from({ length: Math.max(2, Math.floor(b.h / 22)) }).map((_, row) =>
            Array.from({ length: Math.max(1, Math.floor(b.w / 10)) }).map((_, col) => {
              if ((row + col + i) % 3 === 0) return null;
              return (
                <rect
                  key={`${row}-${col}`}
                  x={b.x + 4 + col * 9}
                  y={baseY - b.h + 8 + row * 20}
                  width={3.5}
                  height={5}
                  fill={COLORS.goldLight}
                  opacity={0.55}
                />
              );
            })
          )}
        </g>
      ))}
    </svg>
  );
}

/* ============ نافذة تغيير كلمة المرور (لكل مستخدم لحسابه الخاص) ============ */
function ChangePasswordModal({ currentUser, setUsers, onClose, logActivity }) {
  const { t } = useLang();
  const [oldPassword, setOldPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [confirmPassword, setConfirmPassword] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);

  const submit = () => {
    setError("");
    if (!oldPassword.trim() || !newPassword.trim() || !confirmPassword.trim()) {
      setError(t("الرجاء تعبئة جميع الحقول", "Please fill in all fields"));
      return;
    }
    if (oldPassword !== currentUser.password) {
      setError(t("كلمة المرور الحالية غير صحيحة", "Current password is incorrect"));
      return;
    }
    if (!/^[A-Za-z]{2}\d+$/.test(newPassword)) {
      setError(t("كلمة المرور يجب أن تبدأ بحرفين إنجليزيين ثم أرقام فقط (مثال: ab1234)", "Password must start with 2 English letters followed by numbers only (e.g. ab1234)"));
      return;
    }
    if (newPassword !== confirmPassword) {
      setError(t("كلمة المرور الجديدة وتأكيدها غير متطابقين", "New password and confirmation do not match"));
      return;
    }
    if (newPassword === oldPassword) {
      setError(t("كلمة المرور الجديدة يجب أن تختلف عن الحالية", "New password must be different from the current one"));
      return;
    }
    setUsers((prev) => prev.map((u) => (u.username === currentUser.username ? { ...u, password: newPassword } : u)));
    logActivity && logActivity("تغيير كلمة المرور", "users", currentUser.username);
    setSuccess(true);
    setOldPassword("");
    setNewPassword("");
    setConfirmPassword("");
  };

  return (
    <div
      className="no-print"
      style={{
        position: "fixed",
        inset: 0,
        background: "rgba(36,24,17,0.55)",
        zIndex: 70,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        padding: 20,
      }}
    >
      <div
        style={{
          background: "#fff",
          borderRadius: 12,
          maxWidth: 380,
          width: "100%",
          boxShadow: "0 20px 60px rgba(0,0,0,0.35)",
          padding: 22,
        }}
      >
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <div style={{ fontWeight: 700, color: COLORS.espresso, fontSize: 15 }}>{t("تغيير كلمة المرور", "Change Password")}</div>
          <button
            onClick={onClose}
            style={{ background: "transparent", border: "none", fontSize: 18, cursor: "pointer", color: "#8a7a63", lineHeight: 1 }}
          >
            ✕
          </button>
        </div>

        {success ? (
          <div>
            <div
              style={{
                background: COLORS.greenBg,
                color: COLORS.green,
                padding: "10px 12px",
                borderRadius: 8,
                fontSize: 13,
                marginBottom: 16,
              }}
            >
              {t("تم تغيير كلمة المرور بنجاح ✓", "Password changed successfully ✓")}
            </div>
            <div style={{ display: "flex" }}>
              <div style={{ flex: 1 }}>
                <Btn onClick={onClose}>{t("إغلاق", "Close")}</Btn>
              </div>
            </div>
          </div>
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
            <Field label={t("كلمة المرور الحالية", "Current Password")}>
              <input
                type="password"
                style={inputStyle}
                value={oldPassword}
                onChange={(e) => setOldPassword(e.target.value)}
                autoFocus
              />
            </Field>
            <Field label={t("كلمة المرور الجديدة", "New Password")}>
              <input
                type="password"
                style={inputStyle}
                value={newPassword}
                onChange={(e) => setNewPassword(e.target.value)}
                placeholder={t("مثال: ab1234", "e.g. ab1234")}
              />
              <div style={{ fontSize: 11, color: "#8a7a63", marginTop: 3 }}>
                {t("حرفين ثم أرقام فقط، مثال: ab1234", "2 letters then numbers only, e.g. ab1234")}
              </div>
            </Field>
            <Field label={t("تأكيد كلمة المرور الجديدة", "Confirm New Password")}>
              <input
                type="password"
                style={inputStyle}
                value={confirmPassword}
                onChange={(e) => setConfirmPassword(e.target.value)}
              />
            </Field>
            {error && (
              <div
                style={{
                  background: COLORS.brickBg,
                  color: COLORS.brick,
                  padding: "8px 12px",
                  borderRadius: 8,
                  fontSize: 12.5,
                }}
              >
                {error}
              </div>
            )}
            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <div style={{ flex: 1 }}>
                <Btn onClick={submit}>{t("حفظ", "Save")}</Btn>
              </div>
              <div style={{ flex: 1 }}>
                <Btn tone="secondary" onClick={onClose}>{t("إلغاء", "Cancel")}</Btn>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============ إدارة المستخدمين (أدمن فقط) ============ */
function UsersTab({ users, setUsers, employees, branches, entities, logActivity }) {
  const { t } = useLang();
  const [form, setForm] = useState(EMPTY_USER);
  const [editingId, setEditingId] = useState(null);
  const [err, setErr] = useState("");

  const resetForm = () => {
    setForm(EMPTY_USER);
    setEditingId(null);
    setErr("");
  };

  const submit = () => {
    if (!form.username.trim() || !form.password.trim() || !form.name.trim()) {
      setErr(t("الرجاء تعبئة الاسم واسم المستخدم وكلمة المرور", "Please fill in the name, username, and password"));
      return;
    }
    const dup = users.find((u) => u.username === form.username.trim() && u.id !== editingId);
    if (dup) {
      setErr(t("اسم المستخدم مستخدم بالفعل، اختر اسمًا آخر", "This username is already taken, please choose another"));
      return;
    }
    if (editingId) {
      setUsers((prev) => prev.map((u) => (u.id === editingId ? { ...form, id: editingId, username: form.username.trim() } : u)));
      logActivity && logActivity("تعديل مستخدم", "users", form.username.trim());
    } else {
      setUsers((prev) => [...prev, { ...form, username: form.username.trim(), id: uid() }]);
      logActivity && logActivity("إضافة مستخدم", "users", form.username.trim());
    }
    resetForm();
  };

  const edit = (u) => {
    setForm(u);
    setEditingId(u.id);
    setErr("");
  };

  const remove = (id) => {
    const target = users.find((u) => u.id === id);
    if (target?.role === "admin" && users.filter((u) => u.role === "admin").length <= 1) {
      setErr(t("لا يمكن حذف آخر حساب أدمن في النظام", "You cannot delete the last admin account in the system"));
      return;
    }
    setUsers((prev) => prev.filter((u) => u.id !== id));
    if (editingId === id) resetForm();
  };

  return (
    <div>
      <Header title={t("المستخدمون والصلاحيات", "Users & Permissions")} subtitle={t("إدارة حسابات الدخول: أدمن، مسؤول فرع، موظف — كل حساب بباسورد خاص به", "Manage login accounts: admin, branch manager, employee — each with its own password")} />

      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, padding: 18, marginBottom: 22 }}>
        <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 12, color: COLORS.espresso }}>
          {editingId ? t("تعديل حساب", "Edit Account") : t("إضافة حساب جديد", "Add New Account")}
        </div>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 12 }}>
          <Field label={t("الاسم المعروض", "Display Name")}>
            <input style={inputStyle} value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          </Field>
          <Field label={t("اسم المستخدم", "Username")}>
            <input style={inputStyle} value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} />
          </Field>
          <Field label={t("كلمة المرور", "Password")}>
            <input style={inputStyle} value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} />
          </Field>
          <Field label={t("الدور", "Role")}>
            <select
              style={inputStyle}
              value={form.role}
              onChange={(e) => setForm({ ...form, role: e.target.value, branchId: "", employeeId: "", entityId: "" })}
            >
              <option value="admin">{t("أدمن (كل الصلاحيات)", "Admin (full access)")}</option>
              <option value="manager">{t("مسؤول (كل الصلاحيات ما عدا التقارير والمستخدمين)", "Manager (full access except Reports & Users)")}</option>
              <option value="entity_manager">{t("مدير كيان", "Entity Manager")}</option>
              <option value="branch_manager">{t("مسؤول فرع", "Branch Manager")}</option>
              <option value="employee">{t("موظف", "Employee")}</option>
            </select>
          </Field>
          {form.role === "entity_manager" && (
            <Field label={t("الكيان", "Entity")}>
              <select style={inputStyle} value={form.entityId} onChange={(e) => setForm({ ...form, entityId: e.target.value })}>
                <option value="">{t("اختر الكيان", "Select entity")}</option>
                {entities.map((en) => (
                  <option key={en.id} value={en.id}>{en.name}</option>
                ))}
              </select>
            </Field>
          )}
          {form.role === "branch_manager" && (
            <Field label={t("الفرع", "Branch")}>
              <select style={inputStyle} value={form.branchId} onChange={(e) => setForm({ ...form, branchId: e.target.value })}>
                <option value="">{t("اختر الفرع", "Select branch")}</option>
                {branches.map((b) => (
                  <option key={b.id} value={b.id}>{b.name}</option>
                ))}
              </select>
            </Field>
          )}
          {form.role === "employee" && (
            <Field label={t("الموظف المرتبط", "Linked Employee")}>
              <select style={inputStyle} value={form.employeeId} onChange={(e) => setForm({ ...form, employeeId: e.target.value })}>
                <option value="">{t("اختر الموظف", "Select employee")}</option>
                {employees.map((e) => (
                  <option key={e.id} value={e.id}>{e.name}</option>
                ))}
              </select>
            </Field>
          )}
        </div>
        {err && <div style={{ color: COLORS.brick, fontSize: 12, marginTop: 10 }}>{err}</div>}
        <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
          <Btn onClick={submit}>{editingId ? t("حفظ التعديل", "Save Changes") : t("إضافة الحساب", "Add Account")}</Btn>
          {editingId && <Btn tone="secondary" onClick={resetForm}>{t("إلغاء", "Cancel")}</Btn>}
        </div>
      </div>

      <SectionTitle>{t("الحسابات الحالية", "Current Accounts")} ({fmt(users.length)})</SectionTitle>
      <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "hidden" }}>
        {users.map((u, i) => (
          <div
            key={u.id}
            style={{
              display: "flex",
              justifyContent: "space-between",
              alignItems: "center",
              padding: "10px 14px",
              borderTop: i ? `1px dashed ${COLORS.line}` : "none",
            }}
          >
            <div>
              <div style={{ fontWeight: 700, fontSize: 13 }}>
                {u.name} <span style={{ fontWeight: 400, color: "#8a7a63" }}>({u.username})</span>
              </div>
              <div style={{ fontSize: 11.5, color: "#8a7a63" }}>
                {t(ROLE_LABELS[u.role], ROLE_LABELS_EN[u.role])}
                {u.role === "entity_manager" && ` · ${entities.find((en) => en.id === u.entityId)?.name || "—"}`}
                {u.role === "branch_manager" && ` · ${branches.find((b) => b.id === u.branchId)?.name || "—"}`}
                {u.role === "employee" && ` · ${employees.find((e) => e.id === u.employeeId)?.name || t("غير مرتبط", "Not linked")}`}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <Btn small tone="secondary" onClick={() => edit(u)}>{t("تعديل", "Edit")}</Btn>
              <Btn small tone="danger" onClick={() => remove(u.id)}>{t("حذف", "Delete")}</Btn>
            </div>
          </div>
        ))}
      </div>

      <div style={{ marginTop: 16, fontSize: 11.5, color: "#a3927a", background: "#fff", border: `1px dashed ${COLORS.line}`, borderRadius: 10, padding: 14 }}>
        {t(
          "تنبيه: كلمات المرور هنا وسيلة تقييد وصول بسيطة داخل الفريق وليست تشفيرًا احترافيًا (يمكن لأي شخص يملك صلاحية الأدمن رؤيتها كنص واضح). البيانات الآن تُخزَّن وتُزامَن عبر قاعدة بيانات Firestore المشتركة، فتأكد من ضبط قواعد الأمان (Rules) في مشروع Firebase لمنع الوصول العام غير المصرّح به.",
          "Note: passwords here are a simple team access restriction, not professional-grade encryption (anyone with admin access can see them in plain text). Data is now stored and synced via the shared Firestore database, so make sure to configure the Firebase project's security Rules to prevent unauthorized public access."
        )}
      </div>
    </div>
  );
}

/* ============ التقارير (سجل الدخول والعمليات — أدمن فقط) ============ */
function ACTION_TONE(action) {
  if (action === "دخول") return "green";
  if (action === "خروج") return "gold";
  if (action.startsWith("حذف")) return "brick";
  return "gold";
}

function ReportsTab({ activityLog, users }) {
  const { t } = useLang();
  const [userFilter, setUserFilter] = useState("");
  const [fromDate, setFromDate] = useState("");
  const [toDate, setToDate] = useState("");

  const fmtDT = (iso) => {
    const d = new Date(iso);
    if (isNaN(d)) return iso;
    return d.toLocaleString(t("ar-SA", "en-US"), { dateStyle: "medium", timeStyle: "short" });
  };

  const rows = activityLog
    .filter((e) => !userFilter || e.username === userFilter)
    .filter((e) => !fromDate || (e.timestamp || "").slice(0, 10) >= fromDate)
    .filter((e) => !toDate || (e.timestamp || "").slice(0, 10) <= toDate)
    .slice()
    .reverse();

  const uniqueUsers = Array.from(new Set(activityLog.map((e) => e.username))).map(
    (u) => activityLog.find((e) => e.username === u)
  );

  const loginCount = rows.filter((r) => r.action === "دخول").length;

  return (
    <div>
      <Header title={t("تقرير الدخول والعمليات", "Login & Activity Report")} subtitle={t("سجلّ بمن دخل النظام ومتى وماذا فعل، مبني على آخر ٥٠٠ عملية", "A log of who accessed the system, when, and what they did — based on the last 500 actions")} />

      <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "flex-end", marginBottom: 16 }} className="no-print">
        <Field label={t("المستخدم", "User")}>
          <select style={inputStyle} value={userFilter} onChange={(e) => setUserFilter(e.target.value)}>
            <option value="">{t("كل المستخدمين", "All Users")}</option>
            {uniqueUsers.map((u) => (
              <option key={u.username} value={u.username}>{u.userName} ({u.username})</option>
            ))}
          </select>
        </Field>
        <Field label={t("من تاريخ", "From Date")}>
          <input type="date" style={inputStyle} value={fromDate} onChange={(e) => setFromDate(e.target.value)} />
        </Field>
        <Field label={t("إلى تاريخ", "To Date")}>
          <input type="date" style={inputStyle} value={toDate} onChange={(e) => setToDate(e.target.value)} />
        </Field>
        <Btn onClick={() => window.print()}>{t("🖶 طباعة التقرير", "🖶 Print Report")}</Btn>
      </div>

      <div style={{ display: "flex", gap: 14, flexWrap: "wrap", marginBottom: 18 }} className="no-print">
        <ReceiptCard label={t("عدد عمليات الدخول", "Login Count")} value={fmt(loginCount)} />
        <ReceiptCard label={t("عدد العمليات المعروضة", "Actions Shown")} value={fmt(rows.length)} tone={COLORS.coffee} />
      </div>

      <div className="print-section">
        <div style={{ display: "none" }} className="print-only-title">
          <div className="print-brand">{t("مؤسسة ديرة فارس للتجارة", "Deerat Fares Trading Est.")}</div>
          {t("تقرير الدخول والعمليات", "Login & Activity Report")}
        </div>
        <div style={{ display: "none" }} className="print-only-meta">
          <span>{t(`تاريخ الطباعة: ${new Date().toLocaleDateString("ar-SA")}`, `Print Date: ${new Date().toLocaleDateString("en-US")}`)}</span>
          <span>{rows.length} {t("عملية", "actions")}</span>
        </div>
        <div style={{ background: "#fff", border: `1px solid ${COLORS.line}`, borderRadius: 10, overflow: "auto" }}>
          {rows.length === 0 && <Empty text={t("لا توجد عمليات مسجّلة مطابقة", "No matching recorded actions")} />}
          {rows.length > 0 && (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
              <thead>
                <tr style={{ background: COLORS.paperDark, textAlign: "right" }}>
                  {[
                    t("التاريخ والوقت", "Date & Time"),
                    t("المستخدم", "User"),
                    t("الدور", "Role"),
                    t("العملية", "Action"),
                    t("التفاصيل", "Details"),
                  ].map((h, i) => (
                    <th key={i} style={{ padding: "9px 12px", fontWeight: 700, color: COLORS.coffee }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map((r) => (
                  <tr key={r.id} style={{ borderTop: `1px dashed ${COLORS.line}` }}>
                    <td style={{ padding: "9px 12px", fontFamily: "Consolas, monospace" }}>{fmtDT(r.timestamp)}</td>
                    <td style={{ padding: "9px 12px", fontWeight: 700 }}>{r.userName} <span style={{ color: "#a3927a", fontWeight: 400 }}>({r.username})</span></td>
                    <td style={{ padding: "9px 12px" }}>{t(ROLE_LABELS[r.role], ROLE_LABELS_EN[r.role]) || "—"}</td>
                    <td style={{ padding: "9px 12px" }}>
                      <Stamp tone={ACTION_TONE(r.action)}>{r.action}</Stamp>
                    </td>
                    <td style={{ padding: "9px 12px" }}>{r.targetLabel || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      </div>
    </div>
  );
}

/* ============ بوابة الدخول (تدير المستخدمين والجلسة) ============ */
function Root() {
  const [users, setUsers] = useState(USERS_SEED);
  const [usersLoaded, setUsersLoaded] = useState(false);
  const [currentUsername, setCurrentUsername] = useState(null);
  const [authLoaded, setAuthLoaded] = useState(false);
  const [loginForm, setLoginForm] = useState({ username: "", password: "" });
  const [loginError, setLoginError] = useState("");
  const [authSyncError, setAuthSyncError] = useState("");
  const lastSyncedUsersRef = useRef("");
  const [activityLog, setActivityLog] = useState([]);
  const [logLoaded, setLogLoaded] = useState(false);
  const lastSyncedLogRef = useRef("");

  /* الجلسة (من هو المسجّل دخوله) تبقى محلية على كل جهاز، ما تتزامنش */
  useEffect(() => {
    try {
      const sess = localStorage.getItem("hr-system-session");
      if (sess) setCurrentUsername(sess);
    } catch (e) {
      /* لا توجد جلسة محفوظة */
    }
    setAuthLoaded(true);
  }, []);

  /* قائمة المستخدمين والصلاحيات تُزامَن لحظيًا عبر Firestore بين كل الأجهزة */
  useEffect(() => {
    const unsub = USERS_DOC.onSnapshot(
      (snap) => {
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        if (d && Array.isArray(d.users) && d.users.length) {
          setUsers(d.users);
          lastSyncedUsersRef.current = JSON.stringify(d.users);
        } else {
          USERS_DOC.set({ users: USERS_SEED }).catch(() => {});
        }
        setAuthSyncError("");
        setUsersLoaded(true);
      },
      (err) => {
        setAuthSyncError("تعذر الاتصال بقاعدة البيانات المشتركة — تحقّق من اتصال الإنترنت");
        setUsersLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!usersLoaded) return;
    const json = JSON.stringify(users);
    if (json === lastSyncedUsersRef.current) return;
    USERS_DOC.set({ users })
      .then(() => {
        lastSyncedUsersRef.current = json;
      })
      .catch(() => setAuthSyncError("تعذر حفظ بيانات المستخدمين — تحقّق من الإنترنت"));
  }, [users, usersLoaded]);

  /* سجلّ الدخول والعمليات (من دخل البرنامج وماذا فعل) — يتزامن لحظيًا بين كل الأجهزة */
  useEffect(() => {
    const unsub = LOG_DOC.onSnapshot(
      (snap) => {
        if (snap.metadata.hasPendingWrites) return;
        const d = snap.data();
        const list = d && Array.isArray(d.entries) ? d.entries : [];
        setActivityLog(list);
        lastSyncedLogRef.current = JSON.stringify(list);
        setLogLoaded(true);
      },
      (err) => {
        setLogLoaded(true);
      }
    );
    return () => unsub();
  }, []);

  /* تسجيل حدث جديد في سجلّ العمليات (نكتب مباشرة على Firestore عشان يشتغل حتى لو الحدث حصل قبل تحميل HRApp، زي الدخول) */
  const logActivity = (user, action, targetType, targetLabel) => {
    const entry = {
      id: uid(),
      username: user?.username || "—",
      userName: user?.name || user?.username || "—",
      role: user?.role || "",
      action,
      targetType: targetType || "",
      targetLabel: targetLabel || "",
      timestamp: new Date().toISOString(),
    };
    const next = [...activityLog, entry].slice(-500); /* الاحتفاظ بآخر ٥٠٠ عملية فقط لتفادي تضخّم القاعدة */
    setActivityLog(next);
    lastSyncedLogRef.current = JSON.stringify(next);
    LOG_DOC.set({ entries: next }).catch(() => {});
  };

  const currentUser = users.find((u) => u.username === currentUsername) || null;

  const login = () => {
    const match = users.find(
      (u) => u.username === loginForm.username.trim() && u.password === loginForm.password
    );
    if (!match) {
      setLoginError("اسم المستخدم أو كلمة المرور غير صحيحة");
      return;
    }
    setCurrentUsername(match.username);
    try {
      localStorage.setItem("hr-system-session", match.username);
    } catch (e) {}
    setLoginForm({ username: "", password: "" });
    setLoginError("");
    logActivity(match, "دخول", "", "");
  };

  const logout = () => {
    if (currentUser) logActivity(currentUser, "خروج", "", "");
    setCurrentUsername(null);
    try {
      localStorage.removeItem("hr-system-session");
    } catch (e) {}
  };

  if (!authLoaded || !usersLoaded) return null;

  if (!currentUser) {
    return (
      <LoginScreen
        form={loginForm}
        setForm={setLoginForm}
        onSubmit={login}
        error={loginError || authSyncError}
      />
    );
  }

  return (
    <HRApp
      currentUser={currentUser}
      users={users}
      setUsers={setUsers}
      onLogout={logout}
      activityLog={activityLog}
      logActivity={(action, targetType, targetLabel) => logActivity(currentUser, action, targetType, targetLabel)}
    />
  );
}

const rootEl = document.getElementById("root");
const root = ReactDOM.createRoot(rootEl);
root.render(
  <LangProvider>
    <Root />
  </LangProvider>
);
</script>
</body>
</html>
